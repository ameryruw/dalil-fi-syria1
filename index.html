/* ================================================================
   DALIL SURIYA · v2.0.0 «FIVE LANDS · Пять земель + Ночь и День»
   Синтез двух школ, написан с чистого листа:
   · NEUMORPHISM (Soft UI) — язык ПОВЕРХНОСТЕЙ: монохромная «глина»,
     элементы отлиты из того же материала, что и фон; двойные мягкие
     тени (блик сверху-слева + тень снизу-справа); выпуклые карточки,
     вдавленные поля ввода; нажатие = физическое вдавливание 150 мс;
     радиусы 14–24px; 145° градиенты на выпуклостях.
   · FLUENT DESIGN — язык СВЕТА/ГЛУБИНЫ/ДВИЖЕНИЯ: акриловый блик по
     верхней кромке (эмуляция, без backdrop-filter — инвариант APK),
     reveal-подсветка кромок при наведении, фирменная кривая движения
     cubic-bezier(.1,.9,.2,1) 200–350 мс, слоистая глубина.

        VIP-планы всплывают при входе (view()/entry) со каскадом;
     5) HORIZONTAL SCROLL: лента городов — snap-трек с прогрессивной
        шкалой (scroll-timeline --ct), краевые растворения, RTL-скролл.
   Палитра: «Аметист-Рубин на фарфоре/обсидиане» — акцент рубин-гранат
   рубин (var(--accent) тёмн./var(--accent) свет.), НЕТ зелёного (п.35 в силе),
   НЕТ розовой семьи v1.4.11, НЕТ лазури v2.0, НЕТ вермильона v3.0.

/* ================= ТОКЕНЫ · v5 · ПЯТЬ ТЕМ-ПАЛИТР =================
   Фото владельца → тема (1 фото = 1 тема). Дефолт = sage.
   Светлые темы (terra, sand) получают data-mode="light" от JS.      */
:root{
  --bg:#243B35;                 /* SAGE · глубокая хвойная ночь */
  --bg2:#1C2E29;
  --card:#F1E9D2;               /* кремовый текст */
  --muted:#9FB3A3;
  --accent:#6B8E7B;             /* шалфей — весь интерактив */
  --accent2:#5A7868;
  --accent-hi:#B7C9B1;
  --accent-lo:#4E6B5C;
  --on-accent:#15261F;
  --line:rgba(183,201,177,.16);
  --line-soft:rgba(183,201,177,.10);
  --surface:#2A443C;            /* та же глина, полутон выше */
  --panel:#284139;
  --panel-text:#F1E9D2;
  --hover-tint:rgba(107,142,123,.14);
  --bar-bg:#264038;             /* шапка/док — сплошные */
  --overlay-bg:rgba(12,22,19,.72);
  --input-bg:#1F332D;
  /* неоморфные тени: блик (свет сверху-слева) + тень (снизу-справа) */
  --neo-hi:rgba(183,201,177,.16);
  --neo-lo:rgba(7,14,11,.78);
  --neo-hi-s:rgba(183,201,177,.11);
  --neo-lo-s:rgba(7,14,11,.52);
  --raise:-10px -10px 26px var(--neo-hi), 12px 14px 32px -8px var(--neo-lo);
  --raise-sm:-5px -5px 12px var(--neo-hi-s), 6px 6px 15px -2px var(--neo-lo-s);
  --raise-xs:-3px -3px 8px var(--neo-hi-s), 3px 4px 9px var(--neo-lo-s);
  --press:inset 6px 6px 13px rgba(7,14,11,.68), inset -5px -5px 11px rgba(183,201,177,.13);
  --press-sm:inset 4px 4px 9px rgba(7,14,11,.60), inset -3px -3px 7px rgba(183,201,177,.11);
  --sheen:inset 0 1px 0 rgba(255,255,255,.07);           /* Fluent acrylic-кромка */
  --glow-accent:0 14px 30px -12px rgba(107,142,123,.45);
  --shadow-card:0 18px 40px -26px rgba(0,0,0,.66);
  --shadow-pop:0 34px 80px -30px rgba(0,0,0,.76);
  --mark:rgba(107,142,123,.40);
  --stroke:rgba(241,233,210,.30);
  --cc-scrim:rgba(16,28,24,.86);             /* плашка поверх фото городов */
  --err-ink:#E09090;
  --orb-hi:rgba(255,255,255,.10); --orb-lo:rgba(0,0,0,.42);
  --acc-rgb:107,142,123;        /* S=акцент R/G/B для rgba(var()) */
  --ink-rgb:241,233,210;
  --hi-rgb:183,201,177;
  --lo-rgb:7,14,11;
  --line-rgb:183,201,177;
  /* фирменная типографика темы */
  --h-weight:800; --h-track:-.015em;
  --r-lg:24px; --r-md:18px; --r-sm:14px;
  --fl-ease:cubic-bezier(.1,.9,.2,1);   /* Fluent standard decelerate */
  --fl-dur:.28s;
  --pad:clamp(16px,4vw,32px);
  --gold-grad:linear-gradient(135deg,var(--accent-hi),var(--accent) 55%,var(--accent2));
  --vip-grad:linear-gradient(135deg,#E7D3A2,#C9A96A 55%,#A5854C);  /* §7: антикварное золото — только VIP */
  --vip-strong:#C9A96A;
  --vip-wash:rgba(201,169,106,.10);
  --tg:#2BA3E0;                 /* Telegram-лазурь */
  --danger:#D45A5A;
}

/* ─── TERRA · «Терракотовое тепло» · светлая (фото 2) ─── */

  --shadow-card:0 18px 40px -28px rgba(140,70,50,.50);
  --shadow-pop:0 34px 80px -34px rgba(140,70,50,.58);
  --mark:rgba(164,74,63,.30); --stroke:rgba(92,40,40,.30);

  --orb-hi:rgba(255,255,255,.95); --orb-lo:rgba(178,110,88,.55);
  --acc-rgb:164,74,63; --ink-rgb:92,40,40; --hi-rgb:255,255,255;

  --h-weight:700; --h-track:-.01em;
  --r-lg:20px; --r-md:16px; --r-sm:12px;
}

  --on-accent:#FFF8EE;
  --line:rgba(24,52,81,.18); --line-soft:rgba(24,52,81,.11);
  --surface:#F6F0E3; --panel:#F4EDE0; --panel-text:#1B3450;
  --hover-tint:rgba(169,80,28,.11);
  --bar-bg:#F5EEE0; --overlay-bg:rgba(40,44,58,.42); --input-bg:#EAE0CB;
  --neo-hi:rgba(255,255,255,.92); --neo-lo:rgba(163,140,104,.55);
  --neo-hi-s:rgba(255,255,255,.78); --neo-lo-s:rgba(163,140,104,.38);
  --press:inset 6px 6px 13px rgba(163,140,104,.50), inset -5px -5px 11px rgba(255,255,255,.90);
  --press-sm:inset 4px 4px 9px rgba(163,140,104,.42), inset -3px -3px 7px rgba(255,255,255,.85);
  --sheen:inset 0 1px 0 rgba(255,255,255,.85);
  --glow-accent:0 14px 30px -14px rgba(169,80,28,.48);
  --shadow-card:0 18px 40px -28px rgba(90,80,60,.50);
  --shadow-pop:0 34px 80px -34px rgba(90,80,60,.58);
  --mark:rgba(169,80,28,.28); --stroke:rgba(27,52,80,.30);
  --cc-scrim:rgba(243,236,222,.94); --err-ink:#A63A2A;
  --orb-hi:rgba(255,255,255,.95); --orb-lo:rgba(163,140,104,.55);
  --acc-rgb:169,80,28; --ink-rgb:27,52,80; --hi-rgb:255,255,255;
  --lo-rgb:163,140,104; --line-rgb:24,52,81;
  --h-weight:800; --h-track:-.02em;
  --r-lg:22px; --r-md:16px; --r-sm:12px;
}

/* ─── NIGHT · «Ночная обсидиановая» · тёмная ───
    Классический ЧЁРНЫЙ владельца (восстановлен: «белую и чёрную не надо
    удалять — пусть будет ночная и дневная»). Обсидиановая глина
    v4 NEO FLUENT + рубин-гранат: строгая ночь без цветного тинта. */
html[data-theme="night"]{
  --bg:#24272F; --bg2:#1F222A;
  --card:#EAECF3; --muted:#9096A8;
  --accent:#D22C42; --accent2:#A31529; --accent-hi:#F06879; --accent-lo:#8E1024;
  --on-accent:#FFF7F9;
  --line:rgba(148,157,182,.17); --line-soft:rgba(148,157,182,.10);
  --surface:#272B35; --panel:#262A34; --panel-text:#EAECF3;
  --hover-tint:rgba(210,44,66,.12);
  --bar-bg:#252933; --overlay-bg:rgba(15,17,24,.74); --input-bg:#20242D;
  --neo-hi:rgba(148,158,190,.17); --neo-lo:rgba(9,11,17,.80);
  --neo-hi-s:rgba(148,158,190,.11); --neo-lo-s:rgba(9,11,17,.55);
  --press:inset 6px 6px 13px rgba(9,11,17,.70), inset -5px -5px 11px rgba(148,158,190,.13);
  --press-sm:inset 4px 4px 9px rgba(9,11,17,.62), inset -3px -3px 7px rgba(148,158,190,.11);
  --sheen:inset 0 1px 0 rgba(255,255,255,.07);
  --glow-accent:0 14px 30px -12px rgba(210,44,66,.55);
  --shadow-card:0 18px 40px -26px rgba(0,0,0,.72);
  --shadow-pop:0 34px 80px -30px rgba(0,0,0,.82);
  --mark:rgba(210,44,66,.36); --stroke:rgba(234,236,243,.30);
  --cc-scrim:rgba(20,23,32,.86); --err-ink:#E09090;
  --orb-hi:rgba(255,255,255,.09); --orb-lo:rgba(0,0,0,.46);
  --acc-rgb:210,44,66; --ink-rgb:234,236,243; --hi-rgb:148,158,190;
  --lo-rgb:9,11,17; --line-rgb:148,157,182;
  --h-weight:800; --h-track:-.02em;
  --r-lg:24px; --r-md:18px; --r-sm:14px;
}

/* ─── DAY · «Дневная фарфоровая» · светлая ───
    Классический БЕЛЫЙ владельца: канонический неоморфный фарфор
    #E4E7EF + глубокий рубин #B81630 — дневной свет без цветного тинта. */
html[data-theme="day"]{
  --bg:#E4E7EF; --bg2:#DCE0EA;
  --card:#2B2F3C; --muted:#687082;
  --accent:#B81630; --accent2:#931022; --accent-hi:#D95264; --accent-lo:#8C0D1F;
  --on-accent:#FFFFFF;
  --line:rgba(76,86,116,.18); --line-soft:rgba(76,86,116,.11);
  --surface:#E6E9F1; --panel:#E4E7EF; --panel-text:#2B2F3C;
  --hover-tint:rgba(184,22,48,.10);
  --bar-bg:#E6E9F1; --overlay-bg:rgba(56,62,82,.46); --input-bg:#DDE1EB;
  --neo-hi:rgba(255,255,255,.94); --neo-lo:rgba(143,153,182,.64);
  --neo-hi-s:rgba(255,255,255,.80); --neo-lo-s:rgba(143,153,182,.44);
  --press:inset 6px 6px 13px rgba(143,153,182,.58), inset -5px -5px 11px rgba(255,255,255,.92);
  --press-sm:inset 4px 4px 9px rgba(143,153,182,.50), inset -3px -3px 7px rgba(255,255,255,.85);
  --sheen:inset 0 1px 0 rgba(255,255,255,.85);
  --glow-accent:0 14px 30px -14px rgba(184,22,48,.50);
  --shadow-card:0 18px 40px -28px rgba(84,94,124,.55);
  --shadow-pop:0 34px 80px -34px rgba(84,94,124,.62);
  --mark:rgba(184,22,48,.30); --stroke:rgba(43,47,60,.30);
  --cc-scrim:rgba(228,231,239,.94); --err-ink:#A63248;
  --orb-hi:rgba(255,255,255,.95); --orb-lo:rgba(143,153,182,.55);
  --acc-rgb:184,22,48; --ink-rgb:43,47,60; --hi-rgb:255,255,255;
  --lo-rgb:143,153,182; --line-rgb:76,86,116;
  --h-weight:800; --h-track:-.01em;
  --r-lg:22px; --r-md:16px; --r-sm:12px;
}

/* ================= БАЗА ================= */
*{ margin:0; padding:0; box-sizing:border-box; }
html{ scroll-behavior:smooth; overflow-x:hidden; overscroll-behavior-y:contain; -webkit-tap-highlight-color:transparent; }
[hidden]{ display:none !important; }
body{
  background:var(--bg);
  color:var(--card);
  font-family:'Rubik','Segoe UI',system-ui,sans-serif;
  font-variant-numeric:tabular-nums;
  min-height:100vh;
  overflow-x:hidden;  /* фолбэк старых WebView */
  overflow-x:clip;    /* clip НЕ создаёт scroll-контейнер — свайпы не запираются */
  width:100%;
  padding-bottom:110px;
  -webkit-font-smoothing:antialiased;
}
button{ font:inherit; touch-action:manipulation; }
svg{ flex-shrink:0; }
img{ max-width:100%; }
button:focus-visible, a:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:8px; }
[onclick]:focus-visible, [tabindex]:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:8px; }
[onclick]{ cursor:pointer; }
::selection{ background:rgba(var(--acc-rgb),.40); color:#FFF; }
html[data-mode="light"] ::selection{ background:rgba(var(--acc-rgb),.26); color:var(--panel-text); }
::-webkit-scrollbar{ width:10px; height:10px; }
::-webkit-scrollbar-track{ background:transparent; }
::-webkit-scrollbar-thumb{
  background:linear-gradient(180deg,var(--neo-hi-s),var(--neo-lo-s));
  border-radius:99px; border:2px solid transparent; background-clip:padding-box;
}
*{ scrollbar-width:thin; scrollbar-color:rgba(var(--line-rgb),.45) transparent; }
html[dir="rtl"] body{ line-height:1.72; }
html[dir="rtl"] *{ letter-spacing:normal !important; }
h1, h2, h3, .vip-h-title{ font-family:'Rubik',sans-serif; font-weight:var(--h-weight,800); letter-spacing:var(--h-track,-.015em); overflow-wrap:break-word; }
p, span, button, .tag, .chip{ overflow-wrap:break-word; }
.hero, .cats, .subs, .list-wrap, .mapsec, footer{ position:relative; }

/* Цифры — Space Grotesk (цены, счётчики, телефоны) */
.ltr-num, .cc-cnt, .cnt, .stat-num, .num, .plan-price, .vip-plan-price,
.reqs-badge, .bn-badge, .hc-stat b, .req-date, .ni-time{
  font-family:'Space Grotesk','Rubik',sans-serif;
  font-variant-numeric:tabular-nums;
}
html[dir="rtl"] .ltr-num{ direction:ltr; unicode-bidi:isolate; display:inline-flex; align-items:center; gap:7px; }
html[dir="rtl"] .ltr-num > span{ direction:ltr; unicode-bidi:isolate; }

/* ================= КЛЮЧЕВЫЕ КАДРЫ (все имена оригинала сохранены) ================= */
@keyframes floaty{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-14px); } }
@keyframes floatSoft{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-7px); } }
@keyframes fadeUp{ from{ opacity:0; transform:translateY(22px); } to{ opacity:1; transform:translateY(0); } }
@keyframes popIn{ 0%{ opacity:0; transform:scale(.86); } 70%{ transform:scale(1.03); } 100%{ opacity:1; transform:scale(1); } }
@keyframes searchPulse{ 0%,100%{ box-shadow:var(--press-sm); } 50%{ box-shadow:var(--press-sm), 0 0 0 4px rgba(var(--acc-rgb),.16); } }
@keyframes wobble{ 0%,100%{ transform:rotate(0); } 25%{ transform:rotate(-11deg); } 75%{ transform:rotate(11deg); } }
@keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:.35; } }
@keyframes promoGlow{ 0%,100%{ box-shadow:0 0 0 0 rgba(var(--acc-rgb),.42); } 50%{ box-shadow:0 0 22px 4px rgba(var(--acc-rgb),.30); } }
@keyframes ripGo{ from{ transform:scale(0); opacity:.5; } to{ transform:scale(1); opacity:0; } }
@keyframes wvA{ from{ transform:translateX(0); } to{ transform:translateX(-1200px); } }
@keyframes wvB{ from{ transform:translateX(0); } to{ transform:translateX(-1600px); } }
@keyframes wvIn{ from{ opacity:0; transform:translateY(14px); } to{ opacity:1; transform:none; } }
/* --- кадры скролл-движка v5 · ходы амплифицированы --- */
@keyframes v5Bar{ from{ transform:scaleX(0); } to{ transform:scaleX(1); } }
@keyframes v5OrbA{ from{ transform:translate3d(0,0,0) scale(1); } to{ transform:translate3d(-16vw,85vh,0) scale(1.16); } }
@keyframes v5OrbB{ from{ transform:translate3d(0,0,0) scale(1); } to{ transform:translate3d(14vw,-92vh,0) scale(.86); } }
@keyframes v5Grid{ from{ background-position:0 0,0 0; } to{ background-position:0 640px,0 460px; } }
@keyframes v5Beam{
  0%{ transform:translate3d(-36vw,0,0) rotate(15deg); opacity:.12; }
  50%{ opacity:.8; }
  100%{ transform:translate3d(36vw,0,0) rotate(15deg); opacity:.12; }
}
@keyframes v5Sh1{ to{ transform:translate3d(7vw,110vh,0) rotate(150deg); } }
@keyframes v5Sh2{ to{ transform:translate3d(-9vw,-70vh,0) rotate(-90deg); } }
@keyframes v5Sh3{ to{ transform:translate3d(11vw,-130vh,0) rotate(70deg); } }
@keyframes v5HeroMain{ to{ opacity:.1; transform:translate3d(0,-13vh,0) scale(.93) rotate(-1.4deg); } }
@keyframes v5HeroPhoto{ to{ opacity:.14; transform:translate3d(0,12vh,0) rotate(2.6deg) scale(.95); } }
@keyframes v5HeroSide{ to{ opacity:.08; transform:translate3d(0,-16vh,0) rotate(1.2deg); } }
@keyframes v5Rise{ from{ opacity:0; transform:translate3d(0,58px,0) scale(.95); } to{ opacity:1; transform:none; } }
@keyframes v5Track{ from{ transform:scaleX(.08); } to{ transform:scaleX(1); } }

/* ================= SCROLL-ДВИЖОК v4 =================
   Всё внутри @supports: без поддержки (старый WebView) страница
   просто статична — ни один элемент не остаётся невидимым.       */

/* 1 · SCROLL-LINKED: лента прогресса чтения сверху (Fluent progress) */
body::before{
  content:""; position:fixed; top:0; left:0; right:0; height:3px; z-index:96;
  background:linear-gradient(90deg,var(--accent-lo),var(--accent) 45%,var(--accent-hi));
  transform:scaleX(0); transform-origin:0 50%; opacity:0; pointer-events:none;
}
html[dir="rtl"] body::before{ transform-origin:100% 50%; }
@supports (animation-timeline: scroll()){
  body::before{ opacity:1; animation:v5Bar linear both; animation-timeline:scroll(root); }
}

/* 2 · PARALLAX: рельеф-орбы и матрица плывут с разными скоростями.
   Орбы БЕЗ filter:blur (инвариант производительности APK) — объём
   собран двойным радиальным градиентом: блик + собственная тень.   */
.bg-deco{ position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;
  background:linear-gradient(158deg,transparent 42%,rgba(255,255,255,.035) 50%,transparent 58%);
}
html[data-mode="light"] .bg-deco{
  background:linear-gradient(158deg,transparent 42%,rgba(255,255,255,.5) 50%,transparent 58%);
}
.orb{ position:absolute; border-radius:50%; }
.orb1{
  width:min(64vw,680px); height:min(64vw,680px); top:-190px; inset-inline-start:-180px;
  background:
    radial-gradient(circle at 33% 28%, var(--orb-hi), transparent 52%),
    radial-gradient(circle at 70% 74%, var(--orb-lo), transparent 62%),
    radial-gradient(circle, var(--surface) 0%, var(--surface) 58%, transparent 66%);
}
html[data-mode="light"] .orb1{
  background:
    radial-gradient(circle at 33% 28%, var(--orb-hi), transparent 50%),
    radial-gradient(circle at 70% 74%, var(--orb-lo), transparent 62%),
    radial-gradient(circle, var(--surface) 0%, var(--surface) 58%, transparent 66%);
}
.orb2{
  width:min(72vw,760px); height:min(72vw,760px); bottom:-250px; inset-inline-end:-220px;
  background:
    radial-gradient(circle at 30% 26%, var(--orb-hi), transparent 50%),
    radial-gradient(circle at 72% 76%, var(--orb-lo), transparent 60%),
    radial-gradient(circle, var(--bg2) 0%, var(--bg2) 56%, transparent 64%);
}
html[data-mode="light"] .orb2{
  background:
    radial-gradient(circle at 30% 26%, var(--orb-hi), transparent 48%),
    radial-gradient(circle at 72% 76%, var(--orb-lo), transparent 58%),
    radial-gradient(circle, var(--bg2) 0%, var(--bg2) 56%, transparent 64%);
}
.bg-grid{
  position:absolute; inset:-40px 0 0 0;
  background-image:
    radial-gradient(rgba(var(--line-rgb),.16) 1.1px, transparent 1.4px),
    repeating-radial-gradient(circle at 82% -10%, transparent 0 118px, rgba(var(--line-rgb),.05) 118px 120px);
  background-size:36px 36px, auto;
  -webkit-mask-image:linear-gradient(180deg,#000 0%,rgba(0,0,0,.5) 42%,transparent 78%);
          mask-image:linear-gradient(180deg,#000 0%,rgba(0,0,0,.5) 42%,transparent 78%);
}
@supports (animation-timeline: scroll()){
  .orb1{ animation:v5OrbA linear both; animation-timeline:scroll(root); }
  .orb2{ animation:v5OrbB linear both; animation-timeline:scroll(root); }
  .bg-grid{ animation:v5Grid linear both; animation-timeline:scroll(root); }
}

/* 3 · SCROLL-TRIGGERED (JS IntersectionObserver .reveal → .vis) */
.reveal{
  opacity:0; transform:translateY(30px) scale(.996);
  transition:opacity .7s var(--fl-ease), transform .7s var(--fl-ease);
  will-change:opacity,transform;
}
.reveal.vis{ opacity:1; transform:none; will-change:auto; }

/* 4 · SCROLL-TRIGGERED (CSS view-timeline): каскад секций.
   Только элементы БЕЗ собственных JS-входов (у .row/.city-card/
   .cat-pill/.level-card/.plan — вход от JS с stagger-delay).      */
@supports (animation-timeline: view()){
  .cities-head h2, .cities-head .cities-sub,
  .map-head h2, .map-head .map-tools,
  .hero-card, .ad-slot, .ad-slot .ad-tag,
  .stat-card, .cab-summary, .test-block, .test-grid{
    animation:v5Rise linear both;
    animation-timeline:view();
    animation-range:entry 0% entry 60%;
  }
  /* каскад: siblings всплывают со сдвигом диапазона */
  .cities-head .cities-sub{ animation-range:entry 8% entry 70%; }
  .map-head .map-tools{ animation-range:entry 10% entry 72%; }
  .ft-tile:nth-child(1){ animation:v5Rise linear both; animation-timeline:view(); animation-range:entry 0% entry 58%; }
  .ft-tile:nth-child(2){ animation:v5Rise linear both; animation-timeline:view(); animation-range:entry 6% entry 64%; }
  .ft-tile:nth-child(3){ animation:v5Rise linear both; animation-timeline:view(); animation-range:entry 12% entry 70%; }
  .ft-tile:nth-child(4){ animation:v5Rise linear both; animation-timeline:view(); animation-range:entry 4% entry 62%; }
  .ft-tile:nth-child(5){ animation:v5Rise linear both; animation-timeline:view(); animation-range:entry 10% entry 68%; }
  .ft-tile:nth-child(6){ animation:v5Rise linear both; animation-timeline:view(); animation-range:entry 16% entry 74%; }
}

/* 5 · SCROLL-LINKED EXIT: hero-триада расходится с разными векторами */
@supports (animation-timeline: view()){
  .hero-main{ animation:v5HeroMain linear both; animation-timeline:view(); animation-range:exit 0% exit 92%; }
  .hero-photo{ animation:v5HeroPhoto linear both; animation-timeline:view(); animation-range:exit 0% exit 100%; }
  .hero-side{ animation:v5HeroSide linear both; animation-timeline:view(); animation-range:exit 0% exit 85%; }
}

/* 6 · RIPPLE (JS-инжект .rip в .rip-host) */
.rip-host{ position:relative; overflow:hidden; }
.rip{
  position:absolute; inset-inline-start:var(--rx,50%); top:var(--ry,50%);
  width:220px; height:220px; margin:-110px 0 0 -110px; border-radius:50%;
  background:radial-gradient(circle, rgba(255,255,255,.28) 0%, rgba(255,255,255,0) 62%);
  transform:scale(0); animation:ripGo .55s ease-out forwards; pointer-events:none;
}
html[data-mode="light"] .rip{
  background:radial-gradient(circle, rgba(var(--ink-rgb),.18) 0%, rgba(var(--ink-rgb),0) 62%);
}

/* ================= ШАПКА · мастхед-карточка ================= */
.topbar{
  position:sticky; top:10px; z-index:50;
  margin:10px auto 18px; max-width:1180px; width:calc(100% - 2*var(--pad));
  background:var(--bar-bg);
  border:1px solid var(--line-soft);
  border-radius:var(--r-md);
  box-shadow:var(--raise-sm), var(--sheen);
  padding:10px 14px;
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
}
.brand{
  display:inline-flex; align-items:center; gap:9px;
  font-weight:800; font-size:.98rem; letter-spacing:.01em;
  color:var(--card); text-decoration:none; white-space:nowrap;
}
.brand svg{ width:24px; height:24px; color:var(--accent); }
.brand-sub{ color:var(--muted); font-weight:500; font-size:.78rem; margin-inline-start:2px; }

/* Brand meta badges — «Бесплатно · 15 городов» */
.brand-meta{
  display:inline-flex; align-items:center; gap:6px;
  margin-inline-start:8px; padding-inline-start:8px;
  border-inline-start:1px solid var(--line-soft);
}
.brand-meta .meta-badge{
  display:inline-flex; align-items:center; gap:4px;
  padding:2px 8px; border-radius:999px;
  font-size:.62rem; font-weight:700; letter-spacing:.04em;
  white-space:nowrap;
}
.brand-meta .meta-badge.free{
  color:#1A1405; background:var(--vip-grad);
  box-shadow:0 2px 8px -2px rgba(201,169,106,.5);
}
.brand-meta .meta-badge.cities{
  color:var(--on-accent); background:var(--gold-grad);
  box-shadow:0 2px 8px -2px rgba(var(--acc-rgb),.4);
}
.brand-meta .meta-badge svg{ width:10px; height:10px; flex:none; }

/* Cabinet button in topbar (replaces bnCab) */
#tbCab{ position:relative; }
#tbCab .bn-badge{ top:-4px; inset-inline-end:-4px; }

.btn-gear{
  width:38px; height:38px; flex:none; border-radius:12px;
  border:1px solid var(--line-soft); background:var(--surface);
  color:var(--muted); display:inline-flex; align-items:center; justify-content:center;
  box-shadow:var(--raise-xs), var(--sheen);
  transition:box-shadow .15s var(--fl-ease), color .15s, transform .15s var(--fl-ease);
}
.btn-gear:hover{ color:var(--accent); }
.btn-gear:active{ box-shadow:var(--press-sm); transform:translateY(1px); }
.btn-gear svg{ width:17px; height:17px; }
.btn-login{
  display:inline-flex; align-items:center; gap:7px;
  border:none; border-radius:12px; padding:0 15px; height:38px;
  font-weight:700; font-size:.83rem; white-space:nowrap;
  color:var(--on-accent); background:var(--gold-grad);
  box-shadow:var(--raise-xs), var(--glow-accent), var(--sheen);
  transition:filter .15s, box-shadow .15s, transform .15s var(--fl-ease);
}
.btn-login:hover{ filter:brightness(1.08); }
.btn-login:active{ box-shadow:var(--press-sm); transform:translateY(1px); }
.btn-login.gold{ color:var(--on-accent); }
.btn-vip{
  display:inline-flex; align-items:center; gap:7px;
  border:1px solid rgba(201,169,106,.55); border-radius:12px; padding:0 13px; height:38px;
  font-weight:800; font-size:.82rem; letter-spacing:.06em; white-space:nowrap;
  color:var(--vip-strong); background:var(--vip-wash);
  box-shadow:var(--raise-xs), var(--sheen);
  transition:box-shadow .15s, transform .15s var(--fl-ease), background .2s;
}
.btn-vip svg{ width:19px; height:14px; }
.btn-vip:hover{ background:rgba(201,169,106,.16); }
.btn-vip:active{ box-shadow:var(--press-sm); transform:translateY(1px); }
.bn-badge{
  min-width:17px; height:17px; padding:0 4px; border-radius:99px;
  background:var(--gold-grad); color:var(--on-accent);
  font-size:.62rem; font-weight:700;
  display:inline-flex; align-items:center; justify-content:center;
  position:absolute; top:-5px; inset-inline-end:-5px;
  box-shadow:0 4px 10px -3px rgba(var(--acc-rgb),.6);
}

/* Поиск — ВДАВЛЕННАЯ пилюля (деboss — сердце неоморфизма) */
.search{
  order:10; flex:1 1 190px; min-width:150px;
  display:flex; align-items:center; gap:9px;
  height:40px; padding:0 14px;
  background:var(--input-bg);
  border:1px solid var(--line-soft);
  border-radius:999px;
  box-shadow:var(--press-sm);
  color:var(--muted);
  transition:box-shadow .2s var(--fl-ease);
}
.search:focus-within{
  box-shadow:var(--press-sm), 0 0 0 3px rgba(var(--acc-rgb),.22);
}
.search svg{ width:16px; height:16px; color:var(--muted); }
.search input{
  flex:1; min-width:0; background:transparent; border:none; outline:none;
  color:var(--card); font:inherit; font-size:.88rem;
}
.search input::placeholder{ color:var(--muted); }
.search.live{ animation:searchPulse .9s ease-in-out infinite; }
.search.live svg{ color:var(--accent-hi); animation:wobble 1s ease-in-out infinite; }

/* ================= КНОПКИ · неоморфный литой пресс ================= */
.btn{
  position:relative; display:inline-flex; align-items:center; justify-content:center; gap:7px;
  border:1px solid var(--line-soft); border-radius:13px;
  padding:9px 15px; min-height:38px;
  font-weight:600; font-size:.84rem; text-decoration:none; white-space:nowrap;
  color:var(--card); background:var(--surface);
  box-shadow:var(--raise-xs), var(--sheen);
  transition:box-shadow .15s var(--fl-ease), transform .15s var(--fl-ease),
             color .15s, background .2s, border-color .2s;
  touch-action:manipulation;
}
.btn svg{ width:15px; height:15px; }
.btn:hover{ color:var(--accent); }
.btn:active{ box-shadow:var(--press-sm); transform:translateY(1px) scale(.985); }
.btn-outline{ color:var(--card); }
.btn-outline:hover{ color:var(--accent); border-color:rgba(var(--acc-rgb),.4); }
html[data-mode="light"] .btn-outline:hover{ border-color:rgba(var(--acc-rgb),.45); }
.btn-solid{
  border:none; color:var(--on-accent);
  background:linear-gradient(145deg,var(--accent-hi),var(--accent) 52%,var(--accent2));
  box-shadow:var(--raise-xs), var(--glow-accent), var(--sheen);
}
.btn-solid:hover{ color:var(--on-accent); filter:brightness(1.09); }
.btn-solid:active{ box-shadow:var(--press-sm); transform:translateY(1px) scale(.985); }
.btn-danger{
  color:#FFF; border:none;
  background:linear-gradient(145deg,#E07676,#C74A4A 55%,var(--err-ink));
  box-shadow:var(--raise-xs), 0 12px 26px -12px rgba(199,74,74,.6), var(--sheen);
}
.btn-danger:hover{ color:#FFF; filter:brightness(1.08); }
.btn-danger:active{ box-shadow:var(--press-sm); }
.btn-sq{ padding:9px; min-width:38px; }
.btn-add{
  border:none; border-radius:13px; padding:10px 16px;
  color:var(--on-accent); font-weight:700; font-size:.85rem;
  background:linear-gradient(145deg,var(--accent-hi),var(--accent) 52%,var(--accent2));
  box-shadow:var(--raise-xs), var(--glow-accent), var(--sheen);
  transition:box-shadow .15s, transform .15s var(--fl-ease), filter .15s;
}
.btn-add:hover{ filter:brightness(1.08); }
.btn-add:active{ box-shadow:var(--press-sm); transform:translateY(1px) scale(.985); }
.btn-add.hidden{ display:none; }
.btn-admin{
  display:inline-flex; align-items:center; gap:7px;
  border:1px solid var(--line); border-radius:12px; padding:9px 15px;
  color:var(--muted); background:var(--surface); font-weight:600; font-size:.82rem;
  box-shadow:var(--raise-xs), var(--sheen);
}
.btn-admin:hover{ color:var(--accent); }
.btn-tg{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  border:none; border-radius:13px; padding:10px 16px; min-height:38px;
  color:#FFF; text-decoration:none; font-weight:700; font-size:.85rem;
  background:linear-gradient(145deg,#4FC0F2,#2BA3E0 55%,#1E86C0);
  box-shadow:var(--raise-xs), 0 14px 28px -12px rgba(43,163,224,.55), var(--sheen);
  transition:box-shadow .15s, transform .15s var(--fl-ease), filter .15s;
}
.btn-tg svg{ width:16px; height:16px; }
.btn-tg:hover{ filter:brightness(1.09); color:#FFF; }
.btn-tg:active{ box-shadow:var(--press-sm); transform:translateY(1px) scale(.985); }

/* ================= HERO · двенадцатиколонная сцена ================= */
.hero{ padding:8px var(--pad) 30px; max-width:1180px; margin:0 auto; }
.hero-grid{
  display:grid; grid-template-columns:repeat(12,1fr); gap:18px; align-items:stretch;
}
.hero-main{
  grid-column:span 7; grid-row:span 2; display:flex; flex-direction:column; align-items:flex-start; justify-content:center; gap:16px;
  padding:clamp(20px,3.4vw,42px);
  background:var(--surface);
  border:1px solid var(--line-soft);
  border-radius:var(--r-lg);
  box-shadow:var(--raise), var(--sheen);
}
.hero-star-wrap{ line-height:0; }
.hero-star{
  display:inline-flex; width:44px; height:44px; padding:9px;
  border-radius:14px; color:var(--accent);
  background:var(--surface);
  box-shadow:var(--raise-xs), var(--sheen);
}
.hero-star svg{ width:100%; height:100%; display:block; }
.hero-main h1{
  font-size:clamp(1.85rem,4.6vw,3.3rem);
  line-height:1.12; font-weight:800; color:var(--card);
  text-wrap:balance;
}
.hero-main h1 em, .hero-main h1 b{
  font-style:normal;
  background:linear-gradient(120deg,var(--accent-hi),var(--accent) 55%,var(--accent2));
  -webkit-background-clip:text; background-clip:text;
  -webkit-text-fill-color:transparent; color:var(--accent);
}
.hero-orn{
  width:58px; height:12px; color:var(--accent); opacity:.9;
  display:inline-flex; align-items:center; gap:6px;
}
.hero-orn::before, .hero-orn::after{
  content:""; height:2px; flex:1; border-radius:2px;
  background:linear-gradient(90deg,transparent,var(--accent));
}
.hero-orn::after{ background:linear-gradient(90deg,var(--accent),transparent); }
.hero-orn svg{ width:14px; height:14px; }
.hero-alt{ font-weight:600; color:var(--accent); font-size:.92rem; min-height:1.2em; }
.hero-desc{ color:var(--muted); font-size:.98rem; line-height:1.62; max-width:52ch; }
.hero-badges{ display:flex; flex-wrap:wrap; gap:9px; }
.h-badge{
  display:inline-flex; align-items:center; gap:7px;
  padding:8px 13px; border-radius:999px;
  font-size:.78rem; font-weight:600; color:var(--muted);
  background:var(--input-bg); border:1px solid var(--line-soft);
  box-shadow:var(--press-sm);
}
.h-badge svg{ width:14px; height:14px; color:var(--accent); }
.hero-cta{
  border:none; border-radius:15px; padding:13px 26px; min-height:48px;
  display:inline-flex; align-items:center; gap:9px;
  color:var(--on-accent); font-weight:800; font-size:.95rem;
  background:linear-gradient(145deg,var(--accent-hi),var(--accent) 52%,var(--accent2));
  box-shadow:var(--raise-sm), var(--glow-accent), var(--sheen);
  transition:box-shadow .18s var(--fl-ease), transform .18s var(--fl-ease), filter .18s;
  margin-top:4px;
}
.hero-cta .ic{ display:inline-flex; }
.hero-cta:hover{ filter:brightness(1.08); transform:translateY(-1px); }
.hero-cta:active{ box-shadow:var(--press-sm); transform:translateY(1px) scale(.985); }
/* Арка с фото Дамаска — выпуклая плитка-свод */
.hero-photo{
  grid-column:span 5; position:relative; overflow:hidden;
  border-radius:var(--r-lg);
  border:1px solid var(--line-soft);
  background:
    linear-gradient(180deg, rgba(36,39,47,0) 42%, rgba(24,26,33,.78) 100%),
    url("assets/img/cities/damascus.webp") center 42% / cover no-repeat,
    repeating-radial-gradient(circle at 78% 18%, transparent 0 26px, rgba(var(--line-rgb),.10) 26px 28px),
    radial-gradient(circle at 30% 24%, rgba(255,255,255,.09), transparent 55%),
    var(--surface);
  box-shadow:var(--raise), var(--sheen);
  min-height:280px;
}
.hero-photo figcaption{
  position:absolute; inset-inline:18px; bottom:16px;
  color:#F4F5F9; font-weight:600; font-size:.88rem;
  text-shadow:0 2px 12px rgba(0,0,0,.55);
}
/* Полоса фактов — вдавленный пульт */
.hero-side{ grid-column:span 5; display:flex; }
.hero-card{
  flex:1; display:flex; flex-direction:column; gap:14px;
  padding:clamp(18px,2.6vw,28px);
  background:var(--input-bg);
  border:1px solid var(--line-soft);
  border-radius:var(--r-lg);
  box-shadow:var(--press), var(--sheen);
}
.hc-title{
  font-weight:800; font-size:.8rem; letter-spacing:.14em; color:var(--muted);
  text-transform:uppercase;
}
.hc-stat{
  display:flex; align-items:baseline; gap:10px;
  padding:11px 14px; border-radius:var(--r-sm);
  background:var(--surface);
  box-shadow:var(--raise-xs), var(--sheen);
}
.hc-stat b{
  font-size:1.5rem; font-weight:700; color:var(--card); line-height:1;
}
.hc-stat span{ font-size:.78rem; color:var(--muted); font-weight:500; }
.hc-stat.gold b{
  background:linear-gradient(120deg,#EBD9AC,#C9A96A 55%,#A5854C);
  -webkit-background-clip:text; background-clip:text;
  -webkit-text-fill-color:transparent; color:var(--vip-strong);
}
.hc-tg{ margin-top:auto; width:100%; }

/* ================= ГОРОДА · HORIZONTAL SNAP-ТРЕК ================= */
.cities{ padding:26px var(--pad) 8px; max-width:1180px; margin:0 auto;
  timeline-scope:--ct; }
.cities-head{ display:flex; flex-direction:column; gap:6px; margin-bottom:16px; }
.cities-head h2{
  display:flex; align-items:center; gap:10px;
  font-size:clamp(1.25rem,2.6vw,1.7rem); color:var(--card);
}
.cities-head h2 svg, .cities-head h2 span:first-child{ display:inline-flex; color:var(--accent); }
.cities-head h2 span{ display:inline-flex; }
.cities-sub{ color:var(--muted); font-size:.88rem; max-width:60ch; }
.city-grid{
  display:flex; gap:12px;
  overflow-x:auto; overscroll-behavior-x:contain;
  scroll-snap-type:x proximity;
  scroll-padding-inline-start:4px;
  scroll-timeline:--ct inline;   /* источник шкалы прокрутки трека */
  padding:8px 4px 20px;
  margin:0 calc(-1 * var(--pad));
  padding-inline:var(--pad);
  scrollbar-width:none;
}
.city-grid::-webkit-scrollbar{ display:none; }
/* прогрессивная шкала трека — scroll-linked по горизонтали */
.cities::after{
  content:""; display:block; height:4px; width:min(200px,32%);
  margin:2px auto 0; border-radius:99px;
  background:linear-gradient(90deg,var(--accent-lo),var(--accent),var(--accent-hi));
  transform:scaleX(var(--ct-pct,.08)); transform-origin:0 50%;
  box-shadow:var(--press-sm);
  opacity:.85;
}
html[dir="rtl"] .cities::after{ transform-origin:100% 50%; }
@supports (animation-timeline: scroll()){
  .cities::after{ animation:v5Track linear both; animation-timeline:--ct; }
}
.city-card{
  position:relative; flex:0 0 138px; width:138px;
  min-height:clamp(104px,12.5vw,136px);
  padding:0; border-radius:var(--r-md);
  cursor:pointer; text-align:start;
  --cc-photo:none;
  background:var(--cc-photo) center 38% / cover no-repeat var(--surface);
  border:1px solid var(--line-soft);
  box-shadow:var(--raise-sm), var(--sheen);
  transition:border-color .2s, transform .18s var(--fl-ease), box-shadow .2s;
  scroll-snap-align:start; touch-action:manipulation;
  display:flex; align-items:flex-end;
  animation:fadeUp .5s var(--fl-ease) backwards;
  overflow:hidden;
}
.city-card::after{                 /* Fluent reveal-засветка кромки */
  content:""; position:absolute; inset:0; border-radius:inherit;
  background:linear-gradient(200deg, rgba(255,255,255,.22), transparent 38%);
  opacity:0; transition:opacity .25s var(--fl-ease); pointer-events:none;
}
.city-card:hover{ transform:translateY(-3px); }
.city-card:hover::after{ opacity:1; }
.city-card:active{ box-shadow:var(--press-sm); transform:translateY(0); }
.cc-top{
  position:relative; z-index:1; width:100%;
  display:flex; align-items:center; gap:6px;
  padding:9px 10px;
  background:linear-gradient(180deg, transparent, var(--cc-scrim) 62%);
  color:#F4F5F9;
}
html[data-mode="light"] .cc-top{
  background:linear-gradient(180deg, transparent, var(--cc-scrim) 62%);
  color:var(--card);
}
.cc-pin{ display:inline-flex; color:var(--accent-hi); }
html[data-mode="light"] .cc-pin{ color:var(--accent); }
.cc-pin svg{ width:13px; height:13px; }
.cc-name{
  flex:1; font-weight:700; font-size:.84rem; line-height:1.25;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.cc-cnt{
  flex:none; min-width:22px; height:20px; padding:0 6px;
  display:inline-flex; align-items:center; justify-content:center;
  font-size:.68rem; font-weight:700; border-radius:99px;
  background:rgba(255,255,255,.16); color:inherit;
  backdrop-filter:none; -webkit-backdrop-filter:none;
}
html[data-mode="light"] .cc-cnt{ background:rgba(var(--ink-rgb),.08); }
.city-card.on{
  border-color:var(--accent);
  box-shadow:var(--press-sm), 0 0 0 2px rgba(var(--acc-rgb),.35);
}
html[data-mode="light"] .city-card.on{
  box-shadow:var(--press-sm), 0 0 0 2px rgba(var(--acc-rgb),.32);
}
.city-card.on .cc-cnt{ background:var(--accent); color:var(--on-accent); }

/* 14 фото городов (п.29: носитель webp не тронут) */
.city-card[data-city="damascus"]  { --cc-photo:url("assets/img/cities/damascus.webp"); }
.city-card[data-city="rifdimashq"]{ --cc-photo:url("assets/img/cities/rifdimashq.webp"); }
.city-card[data-city="aleppo"]    { --cc-photo:url("assets/img/cities/aleppo.webp"); }
.city-card[data-city="homs"]      { --cc-photo:url("assets/img/cities/homs.webp"); }
.city-card[data-city="hama"]      { --cc-photo:url("assets/img/cities/hama.webp"); }
.city-card[data-city="latakia"]   { --cc-photo:url("assets/img/cities/latakia.webp"); }
.city-card[data-city="tartus"]    { --cc-photo:url("assets/img/cities/tartus.webp"); }
.city-card[data-city="idlib"]     { --cc-photo:url("assets/img/cities/idlib.webp"); }
.city-card[data-city="daraa"]     { --cc-photo:url("assets/img/cities/daraa.webp"); }
.city-card[data-city="suwayda"]   { --cc-photo:url("assets/img/cities/suwayda.webp"); }
.city-card[data-city="deirezzor"] { --cc-photo:url("assets/img/cities/deirezzor.webp"); }
.city-card[data-city="hasakah"]   { --cc-photo:url("assets/img/cities/hasakah.webp"); }
.city-card[data-city="qamishli"]  { --cc-photo:url("assets/img/cities/qamishli.webp"); }
.city-card[data-city="manbij"]    { --cc-photo:url("assets/img/cities/manbij.webp"); }

/* ================= КАТЕГОРИИ · облако выпуклых пилюль ================= */
.cats{
  display:flex; flex-wrap:wrap; gap:10px;
  padding:20px var(--pad) 6px; max-width:1180px; margin:0 auto;
}
.cat-pill{
  position:relative; display:inline-flex; align-items:center; gap:8px;
  padding:10px 15px; border-radius:999px;
  border:1px solid var(--line-soft);
  background:var(--surface); color:var(--card);
  font-weight:600; font-size:.83rem;
  box-shadow:var(--raise-xs), var(--sheen);
  transition:box-shadow .15s var(--fl-ease), transform .15s var(--fl-ease),
             color .15s, border-color .2s;
  cursor:pointer; touch-action:manipulation;
}
.cat-pill.anim{ animation:fadeUp .45s var(--fl-ease) backwards; }
.cat-pill svg, .cat-pill .cic{ width:16px; height:16px; color:var(--muted); transition:color .15s; }
.cat-pill:hover{ color:var(--accent); transform:translateY(-2px); }
.cat-pill:hover svg, .cat-pill:hover .cic{ color:var(--accent); }
.cat-pill:active{ box-shadow:var(--press-sm); transform:translateY(0) scale(.98); }
.cat-pill.on{
  border-color:transparent; color:var(--on-accent);
  background:linear-gradient(145deg,var(--accent-hi),var(--accent) 52%,var(--accent2));
  box-shadow:var(--raise-xs), var(--glow-accent), var(--sheen);
}
.cat-pill.on svg, .cat-pill.on .cic{ color:var(--on-accent); }
.cic{ display:inline-flex; }

/* ================= ПОДКАТЕГОРИИ · уровни-«слитки» ================= */
.subs{ padding:8px var(--pad) 18px; max-width:1180px; margin:0 auto; }
.level-cards{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px; }
.level-card{
  position:relative;
  display:flex; flex-direction:column; gap:2px;
  background:var(--surface);
  border:1px solid var(--line-soft); border-radius:var(--r-sm);
  padding:11px 13px 11px 19px; padding-inline-start:19px; cursor:pointer; text-align:start;
  box-shadow:var(--raise-xs), var(--sheen);
  transition:box-shadow .15s var(--fl-ease), transform .15s var(--fl-ease), border-color .2s;
  overflow:hidden;
  animation:fadeUp .45s var(--fl-ease) backwards;
}
.level-card::before{                       /* акцентная штанга слева */
  content:""; position:absolute; inset-inline-start:0; top:14%; bottom:14%;
  width:4px; border-radius:99px;
  background:linear-gradient(180deg,var(--accent-hi),var(--accent2));
  opacity:.38; transition:opacity .2s, top .2s, bottom .2s, box-shadow .2s;
}
.level-card:hover{ transform:translateY(-2px); }
.level-card:hover::before{ opacity:.75; }
.level-card:active{ box-shadow:var(--press-sm); }
.level-card.on{
  border-color:rgba(var(--acc-rgb),.5);
  background:linear-gradient(145deg, rgba(var(--acc-rgb),.14), rgba(var(--acc-rgb),.03));
}
html[data-mode="light"] .level-card.on{
  border-color:rgba(var(--acc-rgb),.45);
  background:linear-gradient(145deg, rgba(var(--acc-rgb),.12), rgba(var(--acc-rgb),.02));
}
.level-card.on::before{
  opacity:1; top:7%; bottom:7%;
  box-shadow:0 0 12px rgba(var(--acc-rgb),.55);
}
html[data-mode="light"] .level-card.on::before{ box-shadow:0 0 12px rgba(var(--acc-rgb),.45); }
.lc-top{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
.lc-title{ font-weight:700; font-size:.9rem; color:var(--card); }
.level-card.on .lc-title{ color:var(--accent); }
html[data-mode="light"] .level-card.on .lc-title{ color:var(--accent-lo); }
.lc-arrow{ color:var(--muted); transition:color .15s, transform .2s var(--fl-ease); }
.lc-arrow svg{ width:15px; height:15px; display:block; }
html[dir="rtl"] .lc-arrow svg{ transform:scaleX(-1); }
.level-card:hover .lc-arrow{ color:var(--accent); transform:translateX(2px); }
html[dir="rtl"] .level-card:hover .lc-arrow{ transform:translateX(-2px); }
.lc-sub{ font-size:.75rem; color:var(--muted); }
.lc-cnt{ font-size:.72rem; color:var(--muted); font-weight:600; }
.subjects-block{ margin-top:16px; padding-top:14px; border-top:1px dashed var(--line); }
.subjects-title{ font-weight:700; font-size:.86rem; color:var(--muted); margin-bottom:10px; }
.subjects-block .btn-add{ display:inline-flex; align-items:center; gap:7px; }
.subjects-block .btn-add.hidden{ display:none; }
.tag{
  display:inline-flex; align-items:center;
  padding:4px 10px; border-radius:99px;
  font-size:.7rem; font-weight:600; color:var(--muted);
  background:var(--input-bg); box-shadow:var(--press-sm);
}

/* ================= ЧИПЫ · вдавленные переключатели ================= */
.chip{
  position:relative; display:inline-flex; align-items:center; gap:7px;
  padding:8px 14px; border-radius:999px;
  border:1px solid var(--line-soft);
  background:var(--surface); color:var(--muted);
  font-weight:600; font-size:.78rem; cursor:pointer;
  box-shadow:var(--raise-xs), var(--sheen);
  transition:box-shadow .15s var(--fl-ease), color .15s, border-color .2s, background .2s;
  touch-action:manipulation;
}
.chip svg{ width:14px; height:14px; }
.chip:hover{ color:var(--accent); }
.chip:active{ box-shadow:var(--press-sm); }
.chip.on{
  color:var(--on-accent); border-color:transparent;
  background:linear-gradient(145deg,var(--accent-hi),var(--accent) 52%,var(--accent2));
  box-shadow:var(--raise-xs), var(--glow-accent), var(--sheen);
}

/* Small chips for subcategories on mobile */
.chip-sm{
  padding:5px 10px !important;
  font-size:.68rem !important;
  border-radius:8px !important;
  min-height:32px !important;
  line-height:1.2 !important;
}
.chip-sm svg{ width:12px !important; height:12px !important; }

.chip-fav{ color:var(--muted); }
.chip-fav.fav-on, .chip-fav.on{ color:var(--on-accent); }
.mf-chip{
  display:inline-flex; align-items:center; gap:6px;
  padding:7px 12px; border-radius:999px;
  border:1px solid var(--line-soft); background:var(--surface);
  color:var(--muted); font-size:.74rem; font-weight:600; cursor:pointer;
  box-shadow:var(--raise-xs), var(--sheen);
}
.mf-chip.on{
  color:var(--on-accent); border-color:transparent;
  background:linear-gradient(145deg,var(--accent-hi),var(--accent) 52%,var(--accent2));
}
.mf-chip svg{ width:13px; height:13px; }

/* ================= КАРТА · выпуклый планшет ================= */
.mapsec{ padding:18px var(--pad) 26px; max-width:1180px; margin:0 auto; }
.map-head{ display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px; margin-bottom:8px; }
.map-head h2{
  display:flex; align-items:center; gap:10px;
  font-size:clamp(1.2rem,2.4vw,1.6rem); color:var(--card);
}
.map-head h2 span{ display:inline-flex; }
.map-head h2 svg, .map-head h2 span:first-child{ color:var(--accent); }
.map-tools{ display:flex; flex-wrap:wrap; gap:8px; }
.map-hint{ color:var(--muted); font-size:.82rem; margin-bottom:12px; }
.map-filter{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
.map-coord-row{ display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
.map-coord-row input{
  flex:1 1 130px; min-width:0; height:40px; padding:0 13px;
  background:var(--input-bg); border:1px solid var(--line-soft);
  border-radius:12px; box-shadow:var(--press-sm);
  color:var(--card); font-size:.85rem; outline:none;
}
.map-coord-row input:focus{ box-shadow:var(--press-sm), 0 0 0 3px rgba(var(--acc-rgb),.2); }
html[data-mode="light"] .map-coord-row input:focus{ box-shadow:var(--press-sm), 0 0 0 3px rgba(var(--acc-rgb),.18); }
.map-shell{
  position:relative; height:min(58vh,460px);
  border-radius:var(--r-md); overflow:hidden;
  border:1px solid var(--line-soft);
  box-shadow:var(--raise), var(--sheen);
  background:var(--bg2);
}
.map-shell #mapCanvas{ position:absolute; inset:0; }
.leaflet-container{ background:var(--bg2); font:inherit; }
.map-shell .leaflet-tile{ filter:grayscale(.4) brightness(.8) contrast(1.05); }
html[data-mode="light"] .map-shell .leaflet-tile{ filter:none; }
.leaflet-control-zoom a{
  background:var(--surface) !important; color:var(--card) !important;
  border-color:var(--line-soft) !important;
}
.leaflet-control-attribution{ background:rgba(36,39,47,.7) !important; color:var(--muted) !important; }
html[data-mode="light"] .leaflet-control-attribution{ background:rgba(228,231,239,.8) !important; }
.leaflet-popup-content-wrapper, .leaflet-popup-tip{
  background:var(--panel); color:var(--panel-text);
  border-radius:14px; box-shadow:var(--shadow-card);
}
.map-pop{ min-width:170px; display:flex; flex-direction:column; gap:8px; }
.map-pop-city{ font-weight:700; font-size:.88rem; }
.map-pop-btn{
  align-self:flex-start; padding:7px 13px; border-radius:11px; border:none;
  background:linear-gradient(145deg,var(--accent-hi),var(--accent) 52%,var(--accent2));
  color:var(--on-accent); font-weight:700; font-size:.76rem; cursor:pointer;
  box-shadow:var(--raise-xs), var(--glow-accent);
}
.dalil-pin{
  position:relative; display:flex; align-items:center; justify-content:center;
  width:30px; height:30px; border-radius:50% 50% 50% 4px;
  transform:rotate(-45deg);
  background:linear-gradient(145deg,var(--accent-hi),var(--accent) 52%,var(--accent2));
  border:2px solid rgba(255,255,255,.75);
  box-shadow:0 8px 18px -6px rgba(0,0,0,.5);
}
html[dir="rtl"] .dalil-pin{ transform:rotate(45deg); }
.dalil-pin .dalil-emoji, .dalil-pin svg{
  transform:rotate(45deg); width:14px; height:14px; color:#FFF;
}
html[dir="rtl"] .dalil-pin .dalil-emoji, html[dir="rtl"] .dalil-pin svg{ transform:rotate(-45deg); }
.dalil-pin.vip{
  background:var(--vip-grad); border-color:#D9BC82;
  box-shadow:0 8px 20px -6px rgba(201,169,106,.65);
}

/* ================= СПИСОК · ряды-карточки ================= */
.list-wrap{ padding:16px var(--pad) 30px; max-width:1180px; margin:0 auto; }
.list-head{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
.list-head h2{ font-size:clamp(1.15rem,2.3vw,1.5rem); color:var(--card); }
.cnt{
  padding:5px 12px; border-radius:99px; font-size:.74rem; font-weight:700;
  color:var(--muted); background:var(--input-bg); box-shadow:var(--press-sm);
}
.conn{ display:inline-flex; align-items:center; gap:7px; font-size:.74rem; color:var(--muted); }
.conn .dot{ width:8px; height:8px; border-radius:50%; background:var(--muted); }
.conn.online{ color:var(--accent); }
.conn.online .dot{ background:var(--accent); animation:pulse 2.2s infinite; }
.dest-filter{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
.dest-label{ font-size:.76rem; color:var(--muted); align-self:center; font-weight:600; }
.list-tools{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-bottom:14px; }
.sort-sep{ width:1px; height:22px; background:var(--line); margin:0 2px; }
.ad-slot{
  position:relative; display:flex; align-items:center; gap:14px;
  padding:14px 16px; margin-bottom:16px;
  background:var(--surface); border:1px dashed var(--line);
  border-radius:var(--r-sm); box-shadow:var(--raise-xs), var(--sheen);
}
.ad-slot img{ width:52px; height:52px; border-radius:12px; object-fit:cover; }
.ad-tag, .foot-ad .ad-tag{
  position:absolute; top:-9px; inset-inline-start:14px;
  padding:2px 9px; border-radius:99px;
  background:var(--input-bg); box-shadow:var(--press-sm);
  font-size:.62rem; font-weight:700; letter-spacing:.08em; color:var(--muted);
  text-transform:uppercase;
}
.sheet{ display:flex; flex-direction:column; gap:12px; }
.row{
  display:grid; grid-template-columns:52px minmax(0,1fr); gap:4px 14px;
  padding:16px;
  background:var(--surface);
  border:1px solid var(--line-soft);
  border-radius:var(--r-md);
  box-shadow:var(--raise-sm), var(--sheen);
  position:relative; cursor:pointer;
  transition:box-shadow .18s var(--fl-ease), transform .18s var(--fl-ease), border-color .2s;
  animation:fadeUp .45s var(--fl-ease) backwards;
  overflow:hidden;
}
.row::before{                            /* Fluent reveal-блик кромки */
  content:""; position:absolute; inset:0; border-radius:inherit;
  background:linear-gradient(160deg, rgba(255,255,255,.09), transparent 34%);
  opacity:0; transition:opacity .25s var(--fl-ease); pointer-events:none;
}
html[data-mode="light"] .row::before{
  background:linear-gradient(160deg, rgba(255,255,255,.75), transparent 36%);
}
.row:hover{ transform:translateY(-2px); }
.row:hover::before{ opacity:1; }
.row:active{ box-shadow:var(--press-sm); }
.row .num{
  grid-row:span 2; align-self:start;
  font-size:1.5rem; font-weight:700; line-height:1.1;
  color:transparent; -webkit-text-stroke:1.4px var(--stroke);
}
/* v2.0.4 · фото анкеты: карточки · форма · админ-заявки */
.row-ph{ grid-row:span 2; align-self:start; min-width:0; }
.row-ph img{
  display:block; width:100%; max-width:72px; aspect-ratio:1; height:auto;
  object-fit:cover; border-radius:12px;
  border:1px solid var(--line-soft); background:var(--surface-2);
}
.ph-pick{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.ph-pick-thumb{
  display:block; width:44px; height:44px; object-fit:cover;
  border-radius:10px; border:1px solid var(--line-soft); background:var(--surface-2);
}
.ph-pick-val{ display:inline-flex; align-items:center; gap:8px; font-size:.76rem; color:var(--muted); }
.req-ph{
  display:block; width:56px; height:56px; object-fit:cover;
  border-radius:12px; border:1px solid var(--line-soft);
  background:var(--surface-2); margin:8px 0 2px;
}
.detail-ph{
  display:block; width:min(320px, 100%); aspect-ratio:3/2; object-fit:cover;
  border-radius:var(--r-md); border:1px solid var(--line-soft); background:var(--surface-2);
}
.row-body{ display:flex; flex-direction:column; gap:7px; min-width:0; }
.row-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
.row-top h3{ font-size:1.02rem; font-weight:700; color:var(--card); display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
.vip-badge{
  display:inline-flex; align-items:center;
  padding:2px 9px; border-radius:8px;
  font-size:.66rem; font-weight:800; letter-spacing:.08em;
  color:#1A1405; background:var(--vip-grad);        /* §7: только золото */
  box-shadow:0 4px 12px -4px rgba(201,169,106,.6);
}
.vrf-badge{
  display:inline-flex; align-items:center; justify-content:center;
  width:16px; height:16px; border-radius:50%; flex:none;
  color:var(--on-accent); background:var(--accent);
}
.vrf-badge svg{ width:8px; height:8px; }
.row-desc{ font-size:.84rem; color:var(--muted); line-height:1.5; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.row-meta{ display:flex; flex-wrap:wrap; gap:6px 14px; }
.row-meta .ltr-num, .row-meta .loc{
  display:inline-flex; align-items:center; gap:6px;
  font-size:.76rem; color:var(--muted); font-weight:500;
}
.row-meta svg{ width:14px; height:14px; color:var(--accent); opacity:.85; }
.loc{ min-width:0; }
.row-actions{
  grid-column:2; display:flex; flex-wrap:wrap; gap:8px; margin-top:4px;
}
.row.vip-card{                                    /* §7: VIP-ряд — золотой венец */
  border:1px solid rgba(201,169,106,.55);
  background:
    linear-gradient(145deg, rgba(201,169,106,.14), rgba(201,169,106,.03)),
    var(--surface);
  box-shadow:var(--raise-sm), 0 0 0 1px rgba(201,169,106,.18), var(--sheen);
}
.row.vip-card::before{
  background:linear-gradient(160deg, rgba(235,217,172,.25), transparent 40%);
}
.row.vip-card .num{ -webkit-text-stroke-color:rgba(201,169,106,.6); }
.wa-link svg{ color:var(--muted); }

/* ================= ПУСТОЕ СОСТОЯНИЕ ================= */
.empty{
  text-align:center; padding:44px 22px;
  background:var(--input-bg); border:1px solid var(--line-soft);
  border-radius:var(--r-md); box-shadow:var(--press), var(--sheen);
}
/* v5.2.3 (перенесено): кнопки выхода из пустого города */
.empty-actions{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:16px; }
.empty-actions .btn{ min-width:170px; justify-content:center; }
.empty svg, .empty > div:empty + *{ margin-inline:auto; }
.empty svg{ width:52px; height:52px; color:var(--muted); opacity:.7; animation:floatSoft 4.5s ease-in-out infinite; }
.empty h4{ margin:12px 0 6px; font-size:1.02rem; color:var(--card); }
.empty p{ color:var(--muted); font-size:.84rem; max-width:44ch; margin:0 auto; line-height:1.6; }

/* ================= ФУТЕР · колофон из плит ================= */
footer{ padding:26px var(--pad) 34px; max-width:1180px; margin:0 auto; }
.ft-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:26px; }
.ft-tile{
  display:flex; flex-direction:column; gap:7px; align-items:flex-start;
  padding:17px 16px;
  background:var(--surface); border:1px solid var(--line-soft);
  border-radius:var(--r-sm);
  box-shadow:var(--raise-xs), var(--sheen);
  transition:transform .2s var(--fl-ease), box-shadow .2s var(--fl-ease);
}
.ft-tile:hover{ transform:translateY(-3px); }
.ft-ic{
  display:inline-flex; align-items:center; justify-content:center;
  width:38px; height:38px; border-radius:12px; color:var(--accent);
  background:var(--input-bg); box-shadow:var(--press-sm);
}
.ft-ic svg{ width:18px; height:18px; }
.ft-tile b{ font-size:.88rem; color:var(--card); font-weight:700; }
.ft-tile span{ font-size:.76rem; color:var(--muted); line-height:1.5; }
.footer-agent{ text-align:center; padding:18px 0 6px; border-top:1px dashed var(--line); }
.fa-line{ font-size:.8rem; color:var(--muted); }
.footer-phone{
  display:inline-flex; align-items:center; gap:8px; margin:7px 0 3px;
  padding:9px 18px; border-radius:999px; text-decoration:none;
  color:var(--card); font-weight:700; font-size:.92rem;
  background:var(--surface); border:1px solid var(--line-soft);
  box-shadow:var(--raise-xs), var(--sheen);
  transition:color .15s, transform .15s var(--fl-ease);
}
.footer-phone:hover{ color:var(--accent); transform:translateY(-1px); }
.footer-phone svg{ color:var(--accent); }
.fa-addr{ margin-top:4px; }
.footer-note{ text-align:center; color:var(--muted); font-size:.74rem; margin-top:14px; line-height:1.6; }
.footer-admin{ display:flex; justify-content:center; margin-top:14px; }
.ver-line{ display:flex; justify-content:center; margin-top:10px; }
.ver-badge{
  font-family:'Space Grotesk','Rubik',sans-serif;
  font-size:.68rem; font-weight:500; color:var(--muted);
  padding:4px 12px; border-radius:99px;
  background:var(--input-bg); box-shadow:var(--press-sm);
}

/* ================= ПЛАВАЮЩАЯ ПАНЕЛЬ + ДОК ================= */
.float-panel{
  position:fixed; bottom:96px; inset-inline-start:50%; transform:translateX(-50%);
  z-index:60; display:none; align-items:center; gap:9px;
  padding:12px 20px; border-radius:999px;
  border:1px solid rgba(var(--acc-rgb),.45);
  background:var(--panel); color:var(--card);
  font-weight:700; font-size:.85rem;
  box-shadow:var(--raise-sm), var(--glow-accent), var(--sheen);
  cursor:pointer; transition:filter .15s, box-shadow .15s, transform .15s var(--fl-ease);
}
html[dir="rtl"] .float-panel{ transform:translateX(50%); }
.float-panel:hover{ filter:brightness(1.1); }
.float-panel:active{ transform:translateX(-50%) translateY(3px); box-shadow:var(--press-sm); }
html[dir="rtl"] .float-panel:active{ transform:translateX(50%) translateY(3px); }
.float-panel.show{ display:inline-flex; animation:fadeUp .35s var(--fl-ease) backwards; }
.float-panel svg{ flex:none; color:var(--accent); width:16px; height:16px; }
.float-panel.rip-host{ position:fixed; }
.bottom-nav{
  position:fixed; bottom:12px; inset-inline:12px; z-index:70;
  max-width:560px; margin:0 auto;
  display:flex; align-items:center; justify-content:space-between; gap:4px;
  padding:8px 10px calc(8px + 0px);
  background:var(--bar-bg);
  border:1px solid var(--line-soft);
  border-radius:22px;
  box-shadow:var(--raise), var(--sheen);
  padding-bottom:calc(8px + env(safe-area-inset-bottom, 0px));
}
.bn-item{
  position:relative; flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:7px 4px 5px; border:none; border-radius:14px;
  background:transparent; color:var(--muted); cursor:pointer;
  transition:color .18s, background .18s, box-shadow .18s var(--fl-ease), transform .15s var(--fl-ease);
}
.bn-item::before{                          /* Fluent-индикатор активности */
  content:""; position:absolute; top:2px; inset-inline:26%; height:3px; border-radius:99px;
  background:linear-gradient(90deg,var(--accent-hi),var(--accent));
  opacity:0; transform:scaleX(.3); transition:opacity .2s, transform .25s var(--fl-ease);
}
.bn-item:hover{ color:var(--card); }
.bn-item.on{ color:var(--accent); background:var(--input-bg); box-shadow:var(--press-sm); }
.bn-item.on::before{ opacity:1; transform:scaleX(1); }
.bn-ic{ display:inline-flex; }
.bn-ic svg{ width:20px; height:20px; }
.bn-t{ font-size:.6rem; font-weight:600; white-space:nowrap; }
.bn-fab{
  position:relative; flex:0 0 auto;
  display:flex; flex-direction:column; align-items:center; gap:3px;
  margin-top:-26px; padding:0 6px 3px;
  border:none; background:transparent; color:var(--muted); cursor:pointer;
}
.fab-disc{
  display:flex; align-items:center; justify-content:center;
  width:52px; height:52px; border-radius:50%;
  color:var(--on-accent);
  background:linear-gradient(145deg,var(--accent-hi),var(--accent) 52%,var(--accent2));
  box-shadow:var(--raise-sm), var(--glow-accent), var(--sheen);
  border:4px solid var(--bg);
  transition:box-shadow .15s, transform .15s var(--fl-ease), filter .15s;
}
.fab-disc svg{ width:22px; height:22px; }
.bn-fab:hover .fab-disc{ filter:brightness(1.08); }
.bn-fab:active .fab-disc{ transform:translateY(1px) scale(.96); box-shadow:var(--press-sm); }
.bn-fab .bn-t{ font-weight:700; }

/* ================= ОВЕРЛЕИ И МОДАЛКИ · литые плиты ================= */
.overlay{
  position:fixed; inset:0; z-index:500;
  display:none; align-items:center; justify-content:center;
  padding:18px; background:var(--overlay-bg);
  overflow-y:auto;
}
.overlay.show{ display:flex; }
/* v5.7.0: заставка (z 10500) перекрывала модалку входа — «Создать аккаунт» с
   welcome открывал modal ПОД заставкой и пользователь его не видел.
   Поднимаем ТОЛЬКО authOverlay над заставкой: вход виден отовсюду. */
#authOverlay{ z-index:11000; }
.modal{
  --modal-px:clamp(18px,4vw,30px); --modal-py:clamp(18px,4vw,28px);
  width:min(560px,100%);
  max-height:min(88vh,860px); overflow-y:auto;
  background:var(--panel); color:var(--panel-text);
  border:1px solid var(--line-soft);
  border-radius:var(--r-lg);
  box-shadow:var(--shadow-pop), var(--sheen);
  padding:var(--modal-py) var(--modal-px);
  position:relative;
  transform:translateY(26px) scale(.97); opacity:0;
  transition:transform .32s var(--fl-ease), opacity .28s ease;
}
.overlay.show .modal{ transform:none; opacity:1; }
.modal-close{
  position:absolute; top:14px; inset-inline-end:14px;
  width:34px; height:34px; border-radius:11px;
  border:1px solid var(--line-soft); background:var(--surface); color:var(--muted);
  display:inline-flex; align-items:center; justify-content:center; cursor:pointer;
  box-shadow:var(--raise-xs), var(--sheen);
  transition:color .15s, box-shadow .15s, transform .15s var(--fl-ease);
}
.modal-close svg{ width:14px; height:14px; display:block; }
.modal-close:hover{ color:var(--accent); }
.modal-close:active{ box-shadow:var(--press-sm); transform:scale(.95); }
.modal-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; padding-inline-end:38px; }
.modal-head h3{ font-size:1.18rem; font-weight:800; color:var(--panel-text); }
.modal-desc{ color:var(--muted); font-size:.86rem; line-height:1.6; }
.modal-actions{ display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; }
.modal-actions .btn{ flex:1; }
.modal-submit{ flex:1; }
.err-banner{
  display:none; margin:0 0 12px; padding:11px 14px;
  border-radius:12px; border:1px solid rgba(212,90,90,.4);
  background:rgba(212,90,90,.1); color:#E88;
  font-size:.8rem; font-weight:600; line-height:1.5;
}
html[data-mode="light"] .err-banner{ color:var(--err-ink); }
/* v5.7.0: баннер ошибки появляется с лёгкой дрожью — рука сама тянется исправить поле;
   уважаем prefers-reduced-motion */
.err-banner.show{ display:block; animation:fadeUp .28s var(--fl-ease) backwards, errShake .42s .04s cubic-bezier(.36,.07,.19,.97) both; }
@keyframes errShake{
  10%, 90%{ transform:translateX(-1px); }
  20%, 80%{ transform:translateX(2px); }
  30%, 50%, 70%{ transform:translateX(-4px); }
  40%, 60%{ transform:translateX(4px); }
}
@media (prefers-reduced-motion:reduce){
  .err-banner.show{ animation:fadeUp .28s var(--fl-ease) backwards; }
  .wv3-oab.busy .wv-gic::after{ animation-duration:1.8s; }
}
.gate-modal{ text-align:center; }
.gate-ic{
  width:58px; height:58px; margin:2px auto 12px; border-radius:18px;
  display:flex; align-items:center; justify-content:center;
  color:var(--accent); background:var(--input-bg); box-shadow:var(--press-sm);
}
.gate-ic svg{ width:26px; height:26px; }
.gate-ic.del-ic{ color:var(--danger); }
.del-acc{ color:var(--danger) !important; }

/* Поля форм — вдавленные лотки */
.field{ display:flex; flex-direction:column; gap:6px; margin-bottom:13px; }
.field label{ font-size:.78rem; font-weight:700; color:var(--muted); letter-spacing:.02em; }
.field input, .field select, .field textarea{
  width:100%; border:1px solid var(--line-soft); border-radius:13px;
  background:var(--input-bg); color:var(--panel-text);

.vip-plan-badge{ min-height:22px; display:inline-flex; align-items:center; }

.vip-ben{

}

.vip-step{

/* ================= WELCOME · AUTH 3 (auth-1 владельца → vanilla) =================
   v5.8.0 · Приказ владельца: «возьми дизайн отсюда — пусть там будут реальные
   наши карточки и под наши темы, а еще арабский пусть будет, ну и наши способы
   аутентификации». Сплит по его файлу auth-1 (1).html: СЛЕВА вход (email+пароль
   — тот же /api/auth/login, remember, фокус-кольца), «или», Google/Telegram/
   GitHub в ОДНОМ ряду (busy-спиннеры), гость + регистрация, честная подпись
   PBKDF2 вместо чужих ToS. СПРАВА витрина: бейдж с живой точкой, заголовок,
   ДВЕ горизонтальные ленты РЕАЛЬНЫХ анкет каталога (renderWvMarquee:
   верифицированные → оценка → VIP → просмотры, до 14 штук, дубликаты для
   бесшовного цикла, пауза по hover, в RTL ленты едут встречно) + реальная
   статистика (средний балл, анкеты, города). Чужого НЕТ: ни Inter, ни
   фиолетового Nova, ни зелёного (п.10 §4) — всё на токенах 7 тем × 2 моды;
   шрифты — офлайн-стек приложения; RTL — логическими свойствами (грид
   зеркалится dir=rtl сам, negative letter-spacing для арабской вязи не
   используется); reduced-motion останавливает ленты и stagger. */
#welcomeOv{
  position:fixed; inset:0; z-index:10500;
  background:var(--bg); color:var(--card);
  display:block; overflow:auto;
}
/* языковые чипы — сверху по центру (функция та же, стиль прежний) */
.wv-top{ position:absolute; top:14px; inset-inline:0; display:flex; justify-content:center; z-index:3; }
.wv-langs{ display:flex; gap:6px; flex-wrap:wrap; justify-content:center; padding:0 12px; }
.wv-langs button{
  font:inherit; font-size:.72rem; font-weight:700; letter-spacing:.06em;
  color:var(--muted); background:var(--surface); border:1px solid var(--line-soft);
  border-radius:999px; padding:7px 12px; cursor:pointer;
  box-shadow:var(--raise-xs); transition:color .15s ease, transform .15s ease, border-color .15s ease;
}
.wv-langs button:hover{ color:var(--accent); }
.wv-langs button:active{ box-shadow:var(--press-sm); }
/* ——— сплит-оболочка: вход | витрина (в RTL зеркалится dir=rtl) ——— */
.wv3-shell{
  position:relative; min-height:100vh; min-height:100dvh;
  display:grid; grid-template-columns:minmax(400px,44%) 1fr;
}
/* ——— ПЕРВАЯ СТОРОНА: ВХОД (в LTR слева, в RTL справа — как в auth-1) ——— */
.wv3-auth{
  position:relative; display:flex; flex-direction:column; align-items:stretch;
  padding:78px 48px 30px; border-inline-end:1px solid var(--line-soft);
  background:
    radial-gradient(900px 420px at -10% -10%, rgba(var(--acc-rgb),.16), transparent 60%),
    radial-gradient(700px 380px at 110% 115%, rgba(var(--acc-rgb),.08), transparent 60%),
    var(--bg);
}
.wv3-brand{
  display:inline-flex; align-items:center; gap:10px; align-self:flex-start;
  font-weight:800; letter-spacing:.14em; font-size:.95rem; color:var(--card);
}
.wv3-mark{
  width:34px; height:34px; flex:none; display:grid; place-items:center;
  border-radius:10px; color:var(--on-accent);
  background:linear-gradient(135deg,var(--accent-hi),var(--accent) 55%,var(--accent2));
  box-shadow:var(--raise-xs), var(--glow-accent);
}
.wv3-mark svg{ width:17px; height:17px; }
.wv3-core{ width:100%; max-width:400px; margin:auto; padding:26px 0 8px; }
.wv3-core > *{ animation:wv3Rise .7s ease both; }
.wv3-core > *:nth-child(2){ animation-delay:.06s; }
.wv3-core > *:nth-child(3){ animation-delay:.12s; }
.wv3-core > *:nth-child(4){ animation-delay:.18s; }
.wv3-core > *:nth-child(5){ animation-delay:.24s; }
.wv3-core > *:nth-child(6){ animation-delay:.30s; }
.wv3-core > *:nth-child(7){ animation-delay:.36s; }
.wv3-core > *:nth-child(8){ animation-delay:.42s; }
.wv3-title{ margin:0 0 10px; font-size:clamp(1.6rem,2.2vw,1.9rem); font-weight:800; line-height:1.15; color:var(--card); }
.wv3-sub{ margin:0; color:var(--muted); font-size:.92rem; line-height:1.6; }
.wv3-form{ margin-top:22px; display:grid; gap:13px; }
.wv3-err{ margin:0; }
.wv3-wrap{ position:relative; }
.wv3-ic{
  position:absolute; inset-inline-start:13px; top:50%; translate:0 -50%;
  color:var(--muted); opacity:.75; pointer-events:none; display:grid; place-items:center;
}
.wv3-ic svg{ width:17px; height:17px; }
.wv3-input{
  width:100%; height:48px; padding-inline:42px 46px;
  font:inherit; font-size:.93rem; color:var(--card);
  background:var(--input-bg); border:1px solid var(--line-soft); border-radius:12px;
  outline:none; transition:border-color .2s ease, box-shadow .2s ease;
}
.wv3-input::placeholder{ color:var(--muted); opacity:.75; }
.wv3-input:hover{ border-color:var(--line); }
.wv3-input:focus{ border-color:rgba(var(--acc-rgb),.6); box-shadow:0 0 0 3px rgba(var(--acc-rgb),.16); }
.wv3-eye{
  position:absolute; top:50%; inset-inline-end:7px; transform:translateY(-50%);
  width:34px; height:34px; display:flex; align-items:center; justify-content:center;
  border:none; background:transparent; color:var(--muted); cursor:pointer;
  border-radius:9px; transition:color .2s ease;
}
.wv3-eye:hover{ color:var(--accent); }
.wv3-eye svg{ width:18px; height:18px; }
.wv3-eye.off .eye-open{ display:none; }
.wv3-eye:not(.off) .eye-closed{ display:none; }
.wv3-meta{ display:flex; align-items:center; justify-content:space-between; font-size:.82rem; }
.wv3-rem{ display:inline-flex; align-items:center; gap:8px; color:var(--muted); cursor:pointer; user-select:none; }
.wv3-cb{
  appearance:none; -webkit-appearance:none; width:17px; height:17px; margin:0; flex:none;
  border-radius:5px; border:1px solid var(--line); background:var(--input-bg);
  display:grid; place-items:center; cursor:pointer;
  transition:background .15s ease, border-color .15s ease;
}
.wv3-cb::after{
  content:""; width:9px; height:9px; scale:0; transition:scale .15s ease;
  clip-path:polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
  background:var(--on-accent);
}
.wv3-cb:checked{ background:var(--accent); border-color:var(--accent); }
.wv3-cb:checked::after{ scale:1; }
.wv3-go{
  position:relative; height:50px; border:none; border-radius:12px; cursor:pointer;
  overflow:hidden; display:grid; place-items:center;
  font:inherit; font-size:.98rem; font-weight:800; color:var(--on-accent);
  background:linear-gradient(145deg,var(--accent-hi),var(--accent) 52%,var(--accent2));
  box-shadow:var(--raise-sm), var(--glow-accent);
  transition:transform .15s ease, filter .2s ease;
}
.wv3-go:hover{ filter:brightness(1.06); transform:translateY(-1px); }
.wv3-go:active{ transform:translateY(0); }
.wv3-go::before{
  content:""; position:absolute; inset:0; translate:-120% 0;
  background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.25) 50%,transparent 70%);
  transition:translate .6s ease;
}
.wv3-go:hover::before{ translate:120% 0; }
.wv3-go:disabled{ opacity:.65; cursor:default; pointer-events:none; }
.wv3-div{ display:flex; align-items:center; gap:12px; color:var(--muted); margin:2px 0; }
.wv3-div span{ flex:1; height:1px; background:var(--line); }
.wv3-div em{ font-style:normal; font-size:.72rem; text-transform:uppercase; letter-spacing:.08em; }
/* наши способы входа — ОДИН ряд из трёх (инвариант 11 §4) */
.wv3-social{ display:grid; grid-template-columns:repeat(auto-fit, minmax(0,1fr)); gap:10px; } /* v5.10.0: auto-fit — после удаления TG две кнопки на всю ширину, без дыры справа */
.wv3-oab{
  height:46px; display:flex; align-items:center; justify-content:center; gap:8px;
  font:inherit; font-size:.86rem; font-weight:600; color:var(--card); cursor:pointer;
  background:var(--surface); border:1px solid var(--line-soft); border-radius:12px;
  box-shadow:var(--raise-xs), var(--sheen);
  transition:transform .15s ease, border-color .2s ease, color .15s ease;
}
.wv3-oab:hover{ transform:translateY(-1px); border-color:rgba(var(--acc-rgb),.45); color:var(--accent); }
.wv3-oab:active{ transform:translateY(1px) scale(.99); box-shadow:var(--press-sm); }
.wv3-oab svg{ width:18px; height:18px; flex:none; }
.wv3-oab.busy{ pointer-events:none; color:var(--muted); }
.wv3-oab.busy .wv-gic{ background:transparent; }
.wv3-oab.busy .wv-gic svg{ display:none; }
.wv3-oab.busy .wv-gic::after{
  content:""; width:13px; height:13px; border-radius:50%;
  border:2px solid rgba(var(--acc-rgb),.3); border-top-color:var(--accent);
  animation:wvSpin .7s linear infinite;
}
@keyframes wvSpin{ to{ transform:rotate(1turn); } }
.wv-gic{ display:inline-flex; width:20px; height:20px; flex:none; align-items:center; justify-content:center; background:#fff; border-radius:50%; }
.wv-gic svg{ width:12px; height:12px; }
.wv-gic.tg{ background:transparent; color:var(--tg); }
.wv-gic.tg svg{ width:18px; height:18px; }
.wv-gic.gh{ background:#fff; color:#181717; }  /* октокэт: чёрный на белом круге — читается во всех 7 темах */
.wv3-oab:focus-visible, .wv3-eye:focus-visible, .wv3-cb:focus-visible,
.wv3-go:focus-visible, .wv3-link:focus-visible{
  outline:2px solid rgba(var(--acc-rgb),.55); outline-offset:2px;
}
.wv3-links{ display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap; }
.wv3-link{
  border:none; background:transparent; cursor:pointer; font:inherit;
  font-size:.84rem; font-weight:700; color:var(--accent); padding:2px 0;
}
.wv3-link:hover{ text-decoration:underline; }
.wv3-dot{ color:var(--muted); opacity:.6; }
.wv3-foot{ font-size:.72rem; color:var(--muted); opacity:.85; line-height:1.55; text-align:center; }
/* ——— ВТОРАЯ СТОРОНА: витрина — v5.8.1 перенесена ДОСЛОВНО из auth-1 (1).html
      (Ctrl+C Ctrl+V, приказ владельца «не меняй не изменяй»). v5.8.2: приказ
      «меняем только цвета шрифты на наши» — значения цветов/шрифтов заменены
      на токены 7 тем × 2 моды, структура/классы/анимации/разметка — 1-в-1.
      Сознательных отклонений от макета всего 4, все вынужденные:
      1) Nova-токены объявлены на .showcase-side — изоляция витрины от 7 тем
         приложения (вне витрины темы живут как жили);
      2) зелёный цвет → фиолетовый (--success/живая точка, аватары av-3/av-7):
         зелёный в UI запрещён инвариантом 10 §4 брифа;
      3) физические свойства заменены логическими ТОЛЬКО там, где RTL ломает
         бесшовный цикл/стек (padding-inline-end, margin-inline-start); в LTR
         результат идентичен макету пиксель-в-пиксель;
      4) Inter не подключаем (в APK/оффлайн его нет) — родные шрифты приложения.
      Marquee-механика (52s/60s, встречные ленты, пауза по hover, маски,
      keyframes scroll-left/right) — 1-в-1. Плашки ДВИГАЮТСЯ ВСЕГДА: приказ
      «двигаться должны» — reduced-motion их не останавливает (rise — можно). ——— */
.showcase-side{
  --background:var(--bg); --background-2:var(--bg2); --foreground:var(--card);
  --muted-2:var(--muted); /* --muted не переопределяем — наследуем тему (цикл var запрещён) */
  --card:var(--surface); --card-hover:var(--hover-tint);
  --border:var(--line-soft); --border-strong:var(--line);
  --primary:var(--accent); --primary-2:var(--accent-hi); --ring:rgba(var(--acc-rgb),.55);
  --success:var(--accent-hi); /* живая точка = accent-hi (зелёный #34d399 макета — инвариант 10 §4) */
  --star:var(--accent-hi); --radius:14px; --radius-sm:10px;

  position:relative; display:flex; flex-direction:column; justify-content:center;
  gap:40px; overflow:hidden; padding:64px 0;
  background:
    radial-gradient(1100px 600px at 85% -10%, rgba(var(--acc-rgb),.18), transparent 60%),
    radial-gradient(900px 500px at 10% 110%, rgba(var(--acc-rgb),.10), transparent 60%),
    linear-gradient(180deg, var(--background-2), var(--background));
}
/* dot grid texture (дословно auth-1) */
.showcase-side::before{
  content:""; position:absolute; inset:0; pointer-events:none;
  background-image:radial-gradient(rgba(var(--acc-rgb),.18) 1px, transparent 1px);
  background-size:26px 26px;
  -webkit-mask-image:radial-gradient(75% 70% at 50% 45%, #000 30%, transparent 100%);
          mask-image:radial-gradient(75% 70% at 50% 45%, #000 30%, transparent 100%);
}
.showcase-head{ position:relative; padding:0 56px; max-width:760px; animation:rise .8s .1s ease both; }
.showcase-badge{
  display:inline-flex; align-items:center; gap:8px; padding:7px 14px; border-radius:999px;
  border:1px solid var(--border); background:var(--card); backdrop-filter:blur(8px);
  font-size:12.5px; font-weight:600; color:var(--muted); letter-spacing:.02em;
}
.showcase-badge .dot{
  width:7px; height:7px; border-radius:50%;
  background:var(--success); box-shadow:0 0 10px var(--success);
  animation:pulse 2.2s ease-in-out infinite;
}
.showcase-quote{
  margin:22px 0 0; font-size:clamp(26px,3vw,40px); font-weight:800;
  letter-spacing:-.03em; line-height:1.18; text-wrap:balance;
}
.showcase-quote em{
  font-style:normal; background:linear-gradient(90deg,var(--primary-2),var(--accent));
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
[dir="rtl"] .showcase-quote{ letter-spacing:0; } /* отриц. трекинг рвёт арабскую вязь */
.showcase-sub{ margin:14px 0 0; font-size:15.5px; color:var(--muted); line-height:1.6; }

/* ---- Marquee (дословно auth-1) ---- */
.marquee{
  position:relative; overflow:hidden; padding:6px 0;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);
          mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);
}
.marquee-track{ display:flex; width:max-content; animation:scroll-left var(--speed,46s) linear infinite; }
.marquee.reverse .marquee-track{ animation-name:scroll-right; }
.marquee:hover .marquee-track{ animation-play-state:paused; }
.marquee-group{ display:flex; gap:18px; padding-inline-end:18px; } /* макет: padding-right; RTL — логическое */
/* ---- карточка анкеты (дословно auth-1 .t-card; внутри — РЕАЛЬНЫЕ анкеты) ---- */
.t-card{
  width:360px; flex:none; margin:0; padding:22px; border-radius:var(--radius);
  border:1px solid var(--border); background:var(--card); backdrop-filter:blur(10px);
  transition:background .25s, border-color .25s, transform .25s;
}
.t-card:hover{ background:var(--card-hover); border-color:var(--border-strong); transform:translateY(-3px); }
.stars{ display:flex; gap:3px; color:var(--star); margin-bottom:13px; }
.stars.dim{ opacity:.35; } /* честный реальный балл: <5 звёзд — тускло */
.t-quote{ margin:0; font-size:14.5px; line-height:1.65; color:rgba(var(--ink-rgb),.88); }
.t-author{ margin-top:18px; display:flex; align-items:center; gap:12px; }
.avatar{
  width:38px; height:38px; border-radius:50%; flex:none; display:grid; place-items:center;
  font-size:13px; font-weight:700; color:var(--on-accent); border:1px solid rgba(var(--ink-rgb),.25);
  font-family:'Space Grotesk','Rubik',sans-serif;
}
.av-1{ background:linear-gradient(135deg,var(--accent-hi),var(--accent)); }
.av-2{ background:linear-gradient(135deg,var(--accent),var(--accent2)); }
.av-3{ background:linear-gradient(135deg,var(--accent-hi),var(--accent2)); }
.av-4{ background:linear-gradient(135deg,var(--tg),var(--accent)); }
.av-5{ background:linear-gradient(135deg,var(--accent2),var(--accent-lo)); }
.av-6{ background:linear-gradient(135deg,var(--accent-lo),var(--tg)); }
.av-7{ background:linear-gradient(135deg,var(--accent-hi),var(--accent-lo)); }
.av-8{ background:linear-gradient(135deg,var(--accent),var(--accent-lo)); }
.t-name{ font-size:13.5px; font-weight:600; }
.t-role{ font-size:12.5px; color:var(--muted-2); margin-top:2px; }
/* ---- статистика под лентами (дословно auth-1) ---- */
.showcase-stats{
  position:relative; display:flex; align-items:center; gap:22px; flex-wrap:wrap;
  padding:0 56px; animation:rise .8s .25s ease both;
}
.stack{ display:flex; }
.stack .avatar{ width:32px; height:32px; font-size:11px; border:2px solid var(--background-2); }
.stack .avatar:not(:first-child){ margin-inline-start:-10px; } /* макет: margin-left; RTL — логическое */
.stat-text{ margin:0; font-size:13.5px; color:var(--muted); }
.stat-text b{ color:var(--foreground); font-weight:700; font-family:'Space Grotesk','Rubik',sans-serif; }
.stars-inline{ display:inline-flex; gap:2px; color:var(--star); vertical-align:-2px; }
/* ---- keyframes (дословно auth-1) ---- */
@keyframes scroll-left  { from{ transform:translateX(0); }    to{ transform:translateX(-50%); } }
@keyframes scroll-right { from{ transform:translateX(-50%); } to{ transform:translateX(0); } }
@keyframes rise { from{ opacity:0; transform:translateY(14px); } to{ opacity:1; transform:translateY(0); } }
/* ВЛАДЕЛЕЦ: «плашки двигаться должны» → marquee НЕ отключается даже при
   prefers-reduced-motion (в v5.8.0 из-за этого ленты стояли). Отключаем только rise. */
@media (prefers-reduced-motion: reduce){
  .showcase-head, .showcase-stats{ animation:none !important; }
}
/* ---- адаптив витрины (дословно auth-1: 1080/960/560) ---- */
@media (max-width:1080px){ .t-card{ width:320px; } }
@media (max-width:960px){
  .showcase-side{ padding:48px 0; gap:32px; }
  .showcase-head, .showcase-stats{ padding:0 24px; }
}
@media (max-width:560px){
  .t-card{ width:280px; padding:18px; }
  .showcase-quote{ font-size:24px; }
}

/* ——— адаптив: <1080 витрина уходит ПОД форму (стек, как в auth-1) ——— */
@media (max-width:1079px){
  .wv3-shell{ grid-template-columns:1fr; }
  .wv3-auth{
    border-inline-end:none; border-bottom:1px solid var(--line-soft);
    padding:70px 22px 26px; min-height:100dvh;
  }
}
@media (max-width:560px){
  .wv3-auth{ padding:66px 16px 22px; }
  .wv3-social{ grid-template-columns:1fr; }
}
