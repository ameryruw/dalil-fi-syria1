.rep-reason{
  text-align:start; padding:11px 14px; border-radius:12px; cursor:pointer;
  border:1px solid var(--line-soft); background:var(--surface); color:var(--panel-text);
  font-size:.82rem; font-weight:600;
  box-shadow:var(--raise-xs), var(--sheen);
  transition:border-color .15s, background .15s, color .15s;
}
.rep-reason:hover{ border-color:rgba(var(--acc-rgb),.45); }
.rep-reason.on{
  color:var(--on-accent); border-color:transparent;
  background:linear-gradient(145deg,var(--accent-hi),var(--accent) 52%,var(--accent2));
  box-shadow:var(--raise-xs), var(--glow-accent);
}
.rem-warn{ font-size:.76rem; color:var(--danger); font-weight:600; line-height:1.5; }
.vip-block{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:11px 13px; border-radius:12px; background:var(--vip-wash); border:1px solid rgba(201,169,106,.35); margin:10px 0; }
.vip-row{ display:flex; align-items:center; gap:8px; font-size:.8rem; color:var(--panel-text); font-weight:600; }
.vip-toggle{ min-width:46px; height:26px; border-radius:99px; border:none; cursor:pointer; background:var(--input-bg); box-shadow:var(--press-sm); position:relative; transition:background .2s; }
.vip-toggle::after{
  content:""; position:absolute; top:3px; inset-inline-start:3px;
  width:20px; height:20px; border-radius:50%;
  background:var(--surface); box-shadow:var(--raise-xs);
  transition:transform .2s var(--fl-ease), background .2s;
}
.vip-toggle.on{ background:var(--vip-grad); box-shadow:none; }
.vip-toggle.on::after{ transform:translateX(20px); }
html[dir="rtl"] .vip-toggle.on::after{ transform:translateX(-20px); }
.vrf-badge{ font-size:.66rem; font-weight:800; }
.vip-hint{ font-size:.72rem; color:var(--muted); line-height:1.5; }
.views-admin{ display:flex; align-items:center; gap:8px; }
.views-admin-l{ font-size:.72rem; color:var(--muted); }
.views-dec-btn{ padding:5px 9px; font-size:.7rem; min-height:30px; }
.views-dec-input{ width:76px; min-height:30px; padding:4px 8px; text-align:center; }
.rate-box{ margin-top:12px; padding:13px 14px; border-radius:var(--r-sm); background:var(--input-bg); box-shadow:var(--press-sm); }
.rate-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px; }
.rate-title{ font-weight:700; font-size:.84rem; color:var(--panel-text); }
.rate-stars{ display:flex; gap:4px; }
.rate-star{
  border:none; background:none; padding:3px; cursor:pointer; color:var(--muted); opacity:.5;
  transition:color .15s, opacity .15s, transform .15s var(--fl-ease);
}
.rate-star svg{ width:20px; height:20px; display:block; }
.rate-star:hover{ transform:scale(1.15); }
.rate-star.on{ color:var(--vip-strong); opacity:1; filter:drop-shadow(0 3px 8px rgba(201,169,106,.5)); }
.rate-sum{ font-size:.74rem; color:var(--muted); margin-top:6px; }

/* ================= УВЕДОМЛЕНИЯ ================= */
.notif-list{ display:flex; flex-direction:column; gap:10px; }
.notif-item{
  display:flex; gap:12px; align-items:flex-start;
  padding:13px 14px;
  background:var(--surface); border:1px solid var(--line-soft);
  border-radius:var(--r-sm);
  box-shadow:var(--raise-xs), var(--sheen);
  animation:fadeUp .3s var(--fl-ease) backwards;
}
.notif-item.unread{ border-color:rgba(var(--acc-rgb),.45); background:linear-gradient(145deg, rgba(var(--acc-rgb),.08), transparent), var(--surface); }
html[data-mode="light"] .notif-item.unread{ border-color:rgba(var(--acc-rgb),.4); background:linear-gradient(145deg, rgba(var(--acc-rgb),.06), transparent), var(--surface); }
.ni-ic{
  flex:none; width:36px; height:36px; border-radius:12px;
  display:flex; align-items:center; justify-content:center;
  color:var(--accent); background:var(--input-bg); box-shadow:var(--press-sm);
}
.ni-ic svg{ width:16px; height:16px; }
.ni-body{ flex:1; min-width:0; display:flex; flex-direction:column; gap:3px; }
.ni-top{ display:flex; justify-content:space-between; gap:8px; align-items:baseline; }
.ni-top b{ font-size:.84rem; color:var(--card); }
.ni-time{ font-size:.66rem; color:var(--muted); flex:none; }
.ni-desc{ font-size:.78rem; color:var(--muted); line-height:1.5; }
.ni-actions{ display:flex; gap:8px; margin-top:6px; flex-wrap:wrap; }
.ni-actions .btn{ padding:6px 11px; font-size:.72rem; min-height:32px; }
.notif-empty{ text-align:center; padding:26px 14px; color:var(--muted); font-size:.84rem; }

/* ================= НАСТРОЙКИ ================= */
.set-block{ margin-bottom:18px; }
.set-label{
  display:flex; align-items:center; gap:8px;
  font-size:.78rem; font-weight:700; color:var(--muted); margin-bottom:9px;
}
.set-label svg{ width:15px; height:15px; color:var(--accent); }
.theme-seg{
  display:grid; grid-template-columns:1fr 1fr; gap:8px;
  padding:7px; border-radius:16px;
  background:var(--input-bg); box-shadow:var(--press-sm);
}
.theme-seg button{
  display:flex; align-items:center; justify-content:center; gap:8px;
  padding:11px 0; border-radius:11px; border:none; cursor:pointer;
  background:transparent; color:var(--muted); font-weight:700; font-size:.84rem;
  transition:box-shadow .18s var(--fl-ease), color .18s, background .2s;
}
.theme-seg button svg{ width:15px; height:15px; }
.theme-seg button.on{
  color:var(--card); background:var(--surface);
  box-shadow:var(--raise-xs), var(--sheen);
}
.set-langs{ display:flex; flex-wrap:wrap; gap:8px; }
.set-langs button{
  padding:9px 14px; border-radius:11px; cursor:pointer;
  border:1px solid var(--line-soft); background:var(--surface); color:var(--muted);
  font-weight:600; font-size:.8rem;
  box-shadow:var(--raise-xs), var(--sheen);
  transition:box-shadow .15s, color .15s, background .2s, border-color .2s;
}
.set-langs button:hover{ color:var(--card); }
.set-langs button.on{
  color:var(--on-accent); border-color:transparent;
  background:linear-gradient(145deg,var(--accent-hi),var(--accent) 52%,var(--accent2));
  box-shadow:var(--raise-xs), var(--glow-accent), var(--sheen);
}
.acc-del{
  display:flex; align-items:center; justify-content:center; gap:8px;
  width:100%; padding:11px 0; border-radius:13px; cursor:pointer;
  color:var(--danger); border:1px solid rgba(212,90,90,.4);
  background:rgba(212,90,90,.08); font-weight:700; font-size:.86rem;
  transition:background .2s, border-color .2s, box-shadow .15s;
}
.acc-del:hover{ background:rgba(212,90,90,.14); border-color:rgba(212,90,90,.65); }
.acc-del:active{ box-shadow:var(--press-sm); }
.acc-del svg{ width:15px; height:15px; }
.acc-del-note{ font-size:.72rem; color:var(--muted); margin-top:8px; line-height:1.5; }

/* ================= ТОСТЫ ================= */
#toastWrap{
  position:fixed; top:14px; inset-inline:0; z-index:20000;
  display:flex; flex-direction:column; align-items:center; gap:8px; pointer-events:none;
  padding:0 14px;
}
.toast{
  display:flex; align-items:center; gap:10px;
  max-width:480px; padding:12px 18px;
  border-radius:14px; border:1px solid var(--line);
  background:var(--panel); color:var(--panel-text);
  font-size:.84rem; font-weight:600; line-height:1.45;
  box-shadow:var(--shadow-pop), var(--sheen);
  border-inline-start:3px solid var(--accent);
  animation:fadeUp .3s var(--fl-ease) backwards;
  pointer-events:auto;
}
.toast.err{ border-inline-start-color:var(--danger); }

/* ================= ТАРИФЫ (модалка подписки) + ПРОМО ================= */
.plans{ display:flex; gap:10px; margin-top:6px; }
.plan{
  flex:1; display:flex; flex-direction:column; gap:6px; align-items:center;
  background:var(--surface); border:1px solid var(--line-soft);
  border-radius:16px; padding:16px 12px; cursor:pointer; text-align:center;
  box-shadow:var(--raise-xs), var(--sheen);
  transition:box-shadow .15s, transform .15s var(--fl-ease), border-color .2s;
  animation:fadeUp .45s var(--fl-ease) backwards;
}
.plan:hover{ transform:translateY(-2px); }
.plan:active{ box-shadow:var(--press-sm); }
.plan.on{
  border-color:rgba(var(--acc-rgb),.55);
  background:linear-gradient(145deg, rgba(var(--acc-rgb),.12), rgba(var(--acc-rgb),.02)), var(--surface);
}
html[data-mode="light"] .plan.on{ border-color:rgba(var(--acc-rgb),.5); }
.plan-name{ font-weight:700; font-size:.84rem; color:var(--card); }
.plan-price{ font-size:1.2rem; font-weight:700; color:var(--accent); }
.plan-free .plan-price{ color:var(--vip-strong); }
.plan-note{ font-size:.68rem; color:var(--muted); }
.promo{
  display:flex; align-items:center; gap:10px;
  padding:11px 14px; margin-bottom:14px;
  border-radius:13px; border:1px solid rgba(var(--acc-rgb),.4);
  background:linear-gradient(145deg, rgba(var(--acc-rgb),.12), rgba(var(--acc-rgb),.03)), var(--surface);
  animation:promoGlow 2.8s ease-in-out infinite;
}
html[data-mode="light"] .promo{
  border-color:rgba(var(--acc-rgb),.4);
  background:linear-gradient(145deg, rgba(var(--acc-rgb),.09), rgba(var(--acc-rgb),.02)), var(--surface);
}
.promo-bar{ flex:none; width:8px; height:34px; border-radius:99px; background:linear-gradient(180deg,var(--accent-hi),var(--accent2)); }
.p-tag{
  flex:none; font-size:.6rem; font-weight:800; letter-spacing:.08em; text-transform:uppercase;
  color:var(--on-accent); padding:3px 9px; border-radius:99px;
  background:var(--accent);
}
.p-text{ font-size:.78rem; font-weight:600; color:var(--card); line-height:1.45; }
.sub-hint{ font-size:.74rem; color:var(--muted); text-align:center; margin-top:10px; line-height:1.55; }
.detail-card{ display:flex; flex-direction:column; gap:12px; }
.detail-tag{ align-self:flex-start; }
.detail-desc{ font-size:.88rem; color:var(--panel-text); line-height:1.6; }
.detail-meta{ display:flex; flex-wrap:wrap; gap:7px 16px; }
.detail-meta span, .detail-meta .ltr-num{
  display:inline-flex; align-items:center; gap:6px;
  font-size:.8rem; color:var(--muted);
}
.detail-meta svg{ width:15px; height:15px; color:var(--accent); opacity:.9; }
.detail-actions{ display:flex; flex-wrap:wrap; gap:9px; margin-top:4px; }
.detail-actions .btn{ flex:1 1 auto; }
.detail-card .vip-badge{ flex:none; }
.foot-ad{ position:relative; display:flex; flex-direction:column; gap:8px; align-items:flex-start; padding:15px 16px; }
.foot-ad-btns{ display:flex; gap:9px; flex-wrap:wrap; }
.vip-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-top:10px; }
.vip-pack{
  display:flex; flex-direction:column; gap:3px; align-items:flex-start;
  padding:13px 14px; border-radius:13px; text-decoration:none;
  background:var(--surface); border:1px solid rgba(201,169,106,.4);
  box-shadow:var(--raise-xs), var(--sheen);
  transition:transform .18s var(--fl-ease), box-shadow .18s;
}
.vip-pack:hover{ transform:translateY(-2px); }
.vip-pack-name{ font-weight:800; font-size:.82rem; color:var(--vip-strong); }
.vip-pack-per{ font-size:.68rem; color:var(--muted); }
.vip-pack-price{ font-size:1.05rem; font-weight:700; color:var(--card); font-family:'Space Grotesk','Rubik',sans-serif; }
.vip-pack-cta{
  margin-top:6px; font-size:.7rem; font-weight:800; color:#1A1405;
  padding:6px 12px; border-radius:9px; background:var(--vip-grad);
}
.vip-benefits{ display:flex; flex-wrap:wrap; gap:8px; margin-top:9px; }
.vip-benefits .vip-badge{ flex:none; }
.vip-strip{
  display:flex; align-items:center; gap:8px;
  padding:9px 13px; border-radius:12px;
  background:var(--vip-wash); border:1px solid rgba(201,169,106,.35);
  font-size:.76rem; font-weight:600; color:var(--panel-text);
}
.vip-strip b{ color:var(--vip-strong); }
.moon-wrap, .tw{ display:none !important; }
.online{ color:var(--accent); }
.w3{ color:var(--accent); }
.me{ font-size:.72rem; color:var(--muted); }
.png{ max-width:100%; border-radius:12px; }
.search-strip{ display:none; }

/* ================= АДАПТИВ ================= */
/* ПК > 980px: док по центру, всё дышит шире */
@media (min-width:981px){
  .bottom-nav{ inset-inline:0; left:50%; transform:translateX(-50%); right:auto; }
  html[dir="rtl"] .bottom-nav{ left:auto; right:50%; transform:translateX(50%); }
  .row{ grid-template-columns:56px minmax(0,1fr) auto; align-items:center; }
  .row-actions{ grid-column:3; grid-row:1 / span 2; flex-direction:column; align-items:stretch; }
  .row .num{ grid-row:span 2; }
}
@media (max-width:900px){
  .hero-main{ grid-column:span 12; grid-row:auto; }
  .hero-photo{ grid-column:span 12; min-height:240px; }
  .hero-side{ grid-column:span 12; }
  .vip-plans{ gap:9px; }
}
@media (max-width:820px){
  /* Мобильная стабилизация (уроки v1.3.1): ничего не блокируем, only transform/opacity */
  .topbar{ top:8px; margin-top:8px; gap:8px; padding:9px 12px; }
  .search{ order:10; flex-basis:100%; }
  .topbar > .search{ margin-top:2px; }
  .brand{ font-size:.9rem; }
  .hero{ padding-top:4px; }
  .hero-grid{ gap:13px; }
  .hero-main, .hero-photo, .hero-card{ border-radius:var(--r-md); }
  .city-grid{ gap:10px; scroll-padding-inline-start:2px; }
  .row{ padding:14px; }
  .row .num{ font-size:1.3rem; }
  .row-actions .btn{ min-height:44px; }        /* Apple HIG: зона пальца */
  .btn-sq{ min-width:44px; }
  .ft-grid{ grid-template-columns:repeat(2,1fr); gap:11px; }
  .bottom-nav{ bottom:10px; inset-inline:10px; border-radius:20px; }
  .bn-fab{ margin-top:-22px; }
  .fab-disc{ width:48px; height:48px; }
  .float-panel{ bottom:92px; font-size:.8rem; padding:11px 18px; }
  .adm-modal{ width:min(760px,100%); height:92vh; max-height:92vh; }
  .adm-tabs{ flex-wrap:wrap; }
  .test-grid{ grid-template-columns:1fr; }
  .modal{ max-height:92vh; }
  .map-shell{ height:52vh; }
}
@media (max-width:640px){
  .vip-plans{ grid-template-columns:repeat(2,1fr); }
  .vip-steps{ flex-direction:column; }
  .vip-step{ flex-direction:row; text-align:start; }
  .vip-step .n{ flex:none; }
  .plans{ flex-direction:column; }
  .plan{ flex-direction:row; justify-content:flex-start; text-align:start; }
  .plan.on{ }
  .hero-cta{ width:100%; justify-content:center; }
  .au-soc2{ grid-template-columns:1fr; }
  .modal-actions .btn{ flex:1 1 100%; }
  .row-actions .btn{ flex:1 1 44%; justify-content:center; }
  .row-actions .btn-sq{ flex:0 0 44px; }
  /* Subcategories horizontal scroll on mobile */
  .subs{
    display:flex; gap:8px; overflow-x:auto;
    scroll-snap-type:x mandatory; padding-bottom:8px;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .subs::-webkit-scrollbar{ display:none; }
  .subs .chip,
  .subs .chip-sm{
    flex:0 0 auto; scroll-snap-align:start;
    white-space:nowrap;
  }
}
@media (max-width:560px){
  .city-card{ flex-basis:112px; width:112px; min-height:112px; }   /* п.29: 112 на телефоне */
  .ft-grid{ grid-template-columns:1fr; }
  .vip-grid{ grid-template-columns:1fr; }
  .vip-plans{ grid-template-columns:1fr; }
  .hero-main h1{ font-size:clamp(1.7rem,7.4vw,2.2rem); }
  .h-badge{ font-size:.72rem; padding:7px 11px; }
  .ad-slot{ flex-wrap:wrap; }
  .adm-stats{ grid-template-columns:repeat(2,1fr); }
  .stat-num{ font-size:1.15rem; }
  .tool-grid{ grid-template-columns:1fr; }
}
@media (max-width:440px){
  .topbar{ padding:8px 10px; }
  .btn-login{ padding:0 11px; font-size:.78rem; }
  .btn-vip{ padding:0 10px; font-size:.76rem; }
  .btn-gear{ width:36px; height:36px; }
  .brand svg{ width:21px; height:21px; }
  .brand-sub{ display:none; }
  .brand-meta{ display:none; }
  .cities{ padding-top:20px; }
  .row{ grid-template-columns:44px minmax(0,1fr); }
  .row-actions{ grid-column:1 / -1; }
  .row-actions .btn{ flex:1 1 calc(50% - 4px); }
  .map-coord-row input{ flex-basis:100%; }
}
@media (max-width:400px){
  .hero-main{ padding:18px 16px; }
  .hero-card{ padding:16px 14px; }
  .hc-stat b{ font-size:1.3rem; }
  .bottom-nav{ inset-inline:8px; padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px)); }
  .bn-t{ font-size:.56rem; }
  .fab-disc{ width:46px; height:46px; }
  .bn-fab{ margin-top:-20px; }
  .toast{ font-size:.78rem; padding:11px 14px; }
}

/* ================= СВЕТЛАЯ ТЕМА · точечные докрутки ================= */
html[data-mode="light"] body{ background:var(--bg); }
html[data-mode="light"] .hero-photo{
  background:
    linear-gradient(180deg, rgba(226,229,238,0) 40%, rgba(30,33,42,.72) 100%),
    url("assets/img/cities/damascus.webp") center 42% / cover no-repeat,
    repeating-radial-gradient(circle at 78% 18%, transparent 0 26px, rgba(var(--lo-rgb),.22) 26px 28px),
    radial-gradient(circle at 30% 24%, rgba(255,255,255,.95), transparent 55%),
    var(--surface);
}
html[data-mode="light"] .cc-top{ text-shadow:0 1px 6px rgba(255,255,255,.3); }
html[data-mode="light"] .btn-solid,
html[data-mode="light"] .hero-cta,
html[data-mode="light"] .btn-add,
html[data-mode="light"] .cat-pill.on,
html[data-mode="light"] .chip.on,
html[data-mode="light"] .auth-tabs button.on,
html[data-mode="light"] .adm-tab.on,
html[data-mode="light"] .set-langs button.on,
html[data-mode="light"] .au-methods button.on,
html[data-mode="light"] .cab-btn,
html[data-mode="light"] .rep-reason.on,
html[data-mode="light"] .map-pop-btn,
html[data-mode="light"] .vip-plan-cta{
  box-shadow:var(--raise-xs), 0 12px 26px -12px rgba(var(--acc-rgb),.45), var(--sheen);
}
html[data-mode="light"] .vip-plan-cta{
  box-shadow:0 10px 22px -10px rgba(201,169,106,.7), var(--sheen);
}
html[data-mode="light"] .fab-disc{
  box-shadow:var(--raise-sm), 0 12px 26px -12px rgba(var(--acc-rgb),.5), var(--sheen);
}
html[data-mode="light"] .toast{ border-inline-start-color:var(--accent); }
html[data-mode="light"] .toast.err{ border-inline-start-color:var(--danger); }
html[data-mode="light"] .btn-login{
  background:linear-gradient(145deg,var(--accent-hi),var(--accent) 52%,var(--accent2));
}


/* ================= v5 · КРУТИЛКА ГОРОДОВ · drag + колесо + стрелки ================= */
.cities-head{
  display:grid; grid-template-columns:1fr auto; align-items:end; gap:2px 18px;
}
.cities-head h2{ grid-column:1; }
.cities-head .cities-sub{ grid-column:1; }
.ct-nav{ grid-column:2; grid-row:1 / span 2; display:flex; gap:8px; align-self:end; }
.ct-btn{
  width:42px; height:42px; flex:none; border-radius:50%;
  border:1px solid var(--line-soft); background:var(--surface); color:var(--card);
  display:inline-flex; align-items:center; justify-content:center;
  box-shadow:var(--raise-sm), var(--sheen);
  transition:box-shadow .15s var(--fl-ease), opacity .25s, transform .15s var(--fl-ease);
}
.ct-btn svg{ width:17px; height:17px; }
.ct-btn:hover{ color:var(--accent); }
.ct-btn:active{ box-shadow:var(--press-sm); transform:scale(.93); }
.ct-btn.dim{ opacity:.32; pointer-events:none; }
@media (max-width:560px){ .ct-btn{ width:36px; height:36px; } }
.city-grid{ cursor:grab; }
.city-grid.dragging{
  scroll-snap-type:none; cursor:grabbing; user-select:none; -webkit-user-select:none;
}
.city-grid.dragging .city-card{ pointer-events:none; }

/* ================= v5 · СВЕТОВОЙ ЛУЧ-СВИП (scroll-linked) ================= */
.bg-beam{
  position:absolute; top:-30vh; left:50%;
  width:min(46vw,560px); height:160vh;
  margin-left:calc(min(46vw,560px) / -2);
  background:linear-gradient(90deg, transparent, rgba(var(--acc-rgb),.10) 46%, rgba(var(--acc-rgb),.06) 58%, transparent);
  transform:translate3d(-36vw,0,0) rotate(15deg);
  border-radius:40%; opacity:.2;
}
@supports (animation-timeline: scroll()){
  .bg-beam{ animation:v5Beam linear both; animation-timeline:scroll(root); }
}

/* ================= v5 · ПАРЯЩИЕ НЕОМОРФНЫЕ ТЕЛА (3 глубины) ================= */
.bg-shape{ position:absolute; }
.bg-shape.s1{
  width:110px; height:110px; top:12%; inset-inline-start:5%; border-radius:30%;
  border:1.5px solid rgba(var(--line-rgb),.40);
  box-shadow:var(--raise-sm), var(--sheen);
}
.bg-shape.s2{
  width:64px; height:64px; top:42%; inset-inline-end:9%; border-radius:50%;
  background:
    radial-gradient(circle at 32% 30%, rgba(var(--acc-rgb),.50), transparent 60%),
    var(--surface);
  box-shadow:var(--raise-sm), var(--sheen);
}
.bg-shape.s3{
  width:190px; height:190px; top:68%; inset-inline-start:12%; border-radius:42%;
  background:linear-gradient(145deg, rgba(var(--acc-rgb),.10), transparent 60%);
  border:1px solid var(--line-soft);
  box-shadow:var(--raise), var(--sheen);
}
@supports (animation-timeline: scroll()){
  .bg-shape.s1{ animation:v5Sh1 linear both; animation-timeline:scroll(root); }
  .bg-shape.s2{ animation:v5Sh2 linear both; animation-timeline:scroll(root); }
  .bg-shape.s3{ animation:v5Sh3 linear both; animation-timeline:scroll(root); }
}

/* ================= v5 · ПАТТЕРНЫ ФОНА И ДЕТАЛИ ТЕМ ================= */
html[data-theme="terra"] .bg-grid{
  background-image:
    radial-gradient(rgba(var(--line-rgb),.15) 1.1px, transparent 1.4px),
    repeating-linear-gradient(45deg, rgba(var(--line-rgb),.045) 0 2px, transparent 2px 16px);
}
html[data-theme="tang"] .bg-grid{
  background-image:
    radial-gradient(rgba(var(--line-rgb),.13) 1.1px, transparent 1.4px),
    repeating-linear-gradient(-45deg, rgba(var(--line-rgb),.05) 0 2px, transparent 2px 18px);
}
html[data-theme="ocean"] .bg-grid{
  background-image:
    repeating-linear-gradient(0deg, rgba(var(--line-rgb),.05) 0 1px, transparent 1px 28px),
    repeating-linear-gradient(90deg, rgba(var(--line-rgb),.05) 0 1px, transparent 1px 28px);
}
html[data-theme="sand"] .bg-grid{
  background-image:
    radial-gradient(rgba(var(--line-rgb),.14) 1.1px, transparent 1.4px),
    repeating-radial-gradient(circle at 15% 120%, transparent 0 90px, rgba(var(--line-rgb),.05) 90px 92px);
}
/* NIGHT: звёздная пыль + ночные струи дождя; DAY: миллиметровка дневного света */
html[data-theme="night"] .bg-grid{
  background-image:
    radial-gradient(rgba(var(--line-rgb),.22) 1px, transparent 1.3px),
    repeating-linear-gradient(0deg, rgba(var(--line-rgb),.045) 0 1px, transparent 1px 30px);
}
html[data-theme="day"] .bg-grid{
  background-image:
    radial-gradient(rgba(var(--line-rgb),.13) 1px, transparent 1.3px),
    repeating-linear-gradient(90deg, rgba(var(--line-rgb),.05) 0 1px, transparent 1px 26px);
}
/* детали тем: брунсвик-зелёный у счётчиков TANG, сандалия у SAND, каппитель OCEAN,
   суровый каппитель у NIGHT, тонкая шкала у DAY */
html[data-theme="night"] .brand-sub{
  letter-spacing:.09em; text-transform:uppercase; font-size:.7rem;
}
html[data-theme="day"] .cities::after{ height:4px; }
html[data-theme="tang"] .cc-cnt{ background:rgba(44,87,69,.62); color:#EBE3A7; }
html[data-theme="sand"] .cc-cnt{ background:rgba(212,175,131,.34); color:#183451; }
html[data-theme="ocean"] .brand-sub{
  letter-spacing:.07em; text-transform:uppercase; font-size:.7rem;
}
html[data-theme="tang"] .cities::after,
html[data-theme="sand"] .cities::after{ height:5px; }

/* звезда-орнамент hero: stop-цвета SVG градиента — из токенов темы
   (VIP-золото vgold и золотая лупа §7 не трогаются) */
#hstar stop:first-child{ stop-color:var(--accent-hi); }
#hstar stop:last-child{ stop-color:var(--accent-lo); }

/* ================= v5 · СВИТЧЕР ТЕМ В НАСТРОЙКАХ ================= */
.theme-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
@media (min-width:560px){ .theme-grid{ grid-template-columns:repeat(7,1fr); } }
.theme-sw{
  position:relative; display:flex; flex-direction:column; align-items:center; gap:8px;
  padding:12px 6px 10px; border:1px solid var(--line-soft); border-radius:var(--r-md);
  background:var(--surface); color:var(--muted);
  box-shadow:var(--raise-xs), var(--sheen);
  transition:box-shadow .18s var(--fl-ease), color .18s, transform .18s var(--fl-ease);
}
.theme-sw:hover{ color:var(--card); }
.theme-sw:active{ box-shadow:var(--press-sm); transform:translateY(1px); }
.sw-disc{
  width:34px; height:34px; border-radius:50%;
  background:linear-gradient(135deg, var(--sw1) 0 44%, var(--sw2) 44% 72%, var(--sw3) 72% 100%);
  box-shadow:var(--raise-xs), inset 0 0 0 2px rgba(255,255,255,.18);
}
.theme-sw .sw-name{ font-size:.72rem; font-weight:700; line-height:1.15; text-align:center; }
.theme-sw .sw-check{
  position:absolute; top:6px; inset-inline-end:6px;
  width:18px; height:18px; border-radius:50%;
  display:none; align-items:center; justify-content:center;
  background:var(--accent); color:var(--on-accent);
}
.theme-sw.on{
  box-shadow:var(--press-sm), 0 0 0 2px rgba(var(--acc-rgb),.55);
  color:var(--card);
}
.theme-sw.on .sw-check{ display:inline-flex; }

/* ================= v5.9.0 · БЫСТРЫЕ ТЕМЫ В ШАПКЕ =================
   Приказ владельца: «темы из настроек в верху гдето поставь но не панель
   а гдето в начале сбоку» — строка дисков внутри липкой шапки (своя строка
   после основного ряда), прижата к инлайн-старту; в RTL зеркалится сама
   (flexbox по направлению). Это НЕ панель: оверлей не открывает, клик = тот
   же ирис-переход, что в настройках; блок тем в настройках остаётся. */
.quick-themes{
  flex-basis:100%;
  display:flex; align-items:center; gap:7px;
  padding-top:9px; margin-top:9px;
  border-top:1px solid var(--line-soft);
  justify-content:flex-start;
}
.qt-sw{
  width:20px; height:20px; border-radius:50%; padding:0; cursor:pointer;
  border:1px solid rgba(var(--ink-rgb),.28);
  background:linear-gradient(135deg, var(--sw1) 0 44%, var(--sw2) 44% 72%, var(--sw3) 72% 100%);
  box-shadow:var(--raise-xs), inset 0 0 0 2px rgba(255,255,255,.14);
  transition:transform .15s var(--fl-ease), box-shadow .15s;
}
.qt-sw:hover{ transform:scale(1.16); }
.qt-sw:active{ transform:scale(.94); }
.qt-sw.on{ box-shadow:0 0 0 2px rgba(var(--acc-rgb),.55), var(--raise-xs); }

/* ================= v5.2.1 · ИРИС-ПЕРЕХОД ТЕМ =================
    Градиентная чернильная маска расходится ОТ ЦЕНТРА нажатого свотча
    (мягкий радиальный край — темнота нарастает виньеткой), накрывает экран
    до 100% чёрного → под чернотой переключается тема → маска осветляется,
    открывая новую тему. Цикл ≈ 1.37с (быстрее v5.2). Ввод НИКОГДА не
    блокируется: резкие перекликивания безопасны — последний клик главный. */
#themeWipe{
  position:fixed; inset:0; z-index:15000; /* выше welcome 10500, ниже тостов 20000 */
  pointer-events:none; visibility:hidden; opacity:0;
}
#themeWipe .wipe-disc{
  position:absolute; left:var(--wx,50%); top:var(--wy,50%);
  width:var(--wd,220vmax); height:var(--wd,220vmax);
  margin:calc(var(--wd,220vmax) / -2);
  border-radius:50%;
  /* мягкий градиентный край: сплошное ядро 70% (JS компенсирует радиус /0.7),
     на пике ядро накрывает весь экран → честные 100% чёрного */
  background:radial-gradient(circle closest-side,
    #000 0%, #000 70%, rgba(0,0,0,.88) 78%, rgba(0,0,0,.5) 90%, transparent 100%);
  transform:scale(0); will-change:transform,opacity;
}
@media (prefers-reduced-motion: reduce){
  #themeWipe{ display:none; }
}


/* ================= ДОСТУПНОСТЬ · reduced motion ================= */
@media (prefers-reduced-motion: reduce){
  html{ scroll-behavior:auto; }
  *, *::before, *::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
  }
  body::before{ display:none; }
  .orb1, .orb2, .bg-grid, .hero-main, .hero-photo, .hero-side,
  .cities-head h2, .cities-head .cities-sub, .map-head h2, .map-head .map-tools,
  .ft-tile, .stat-card, .ad-slot, .hero-card, .cab-summary, .test-block, .test-grid,
  .cities::after{ animation:none !important; }
  .bg-beam, .bg-shape{ animation:none !important; opacity:.5; }
  .reveal{ opacity:1; transform:none; transition:none; }
  .wv1, .wv2, .wv3, .wv4{ animation:none !important; }
  .empty svg{ animation:none !important; }
}


/* ================= v5.3 · TEXT LOOP (React Bits → vanilla) =================
    Бегущая по волне лента бренда между hero и городами. Классы компонента
    сохранены (.text-loop*), геометрия — viewBox 1200×420 (v5.3.1: компактнее).
    Лента декоративная: aria-hidden внутри, role="img" с aria-label. */
.text-loop{ position:relative; width:100%; overflow:hidden; }
.text-loop-svg{ display:block; width:100%; height:auto; }
.text-loop-text{ user-select:none; -webkit-user-select:none; }
.text-loop-measure{ visibility:hidden; pointer-events:none; }
.tl-band{ max-width:1180px; margin:0 auto; padding:2px var(--pad) 0; }
.tl-band .text-loop{ border-radius:var(--r-sm); }
/* ================= v5.3 · MAGIC BENTO (React Bits → vanilla) ================
    Бенто-сетка кабинета. Переменные --mb-* замаплены на токены тем Dalil:
    акцент свечения = var(--acc-rgb) → сетка живёт во всех 7 темах и обеих
    модах без единого js-пересчёта. Поверхности — неоморфные тени app. */
.magic-bento{
  --mb-spring:cubic-bezier(0.34,1.4,0.64,1);
  --mb-surface:linear-gradient(165deg, var(--surface) 0%, var(--input-bg) 100%);
  --mb-edge:var(--line-soft);
  --mb-highlight:rgba(var(--hi-rgb,255,255,255),.06);
  --mb-shadow:var(--raise-xs), var(--sheen);
  --mb-tile:var(--input-bg);
  --mb-tile-edge:var(--line-soft);
  --mb-tile-highlight:rgba(var(--hi-rgb,255,255,255),.12);
  --mb-tile-shadow:var(--press-sm);
  --mb-well:rgba(var(--ink-rgb,0,0,0),.04);
  --mb-well-edge:var(--line-soft);
  --mb-ink:var(--card);
  --mb-muted:var(--muted);
  --mb-glow-rgb:var(--acc-rgb);
  --mb-accent-rgb:var(--acc-rgb);
  --mb-accent-ink:var(--on-accent);
  --mb-glow-alpha:.8;
  --mb-spot-alpha:.08;
  --mb-radius:var(--r-sm);
  --mb-inner-radius:12px;
  --mb-pad:15px;
  --mb-spot-size:300px;
  --mb-border-size:225px;
  position:relative; box-sizing:border-box; display:grid;
  grid-auto-flow:row dense; width:100%;
  color:var(--mb-ink); -webkit-tap-highlight-color:transparent;
}
html[data-mode="light"] .magic-bento{
  --mb-highlight:rgba(255,255,255,.85);
  --mb-glow-alpha:.55;
  --mb-spot-alpha:.05;
  --mb-tile-shadow:0 4px 10px -5px rgba(24,24,27,.22);
}
@supports (transition-timing-function:linear(0,1)){
  .magic-bento{ --mb-spring:linear(0,0.0603,0.2033,0.3821,0.5633,0.7258,0.8584,0.9574,1.0242,1.0634,1.0809,1.0828,1.0747,1.0613,1.046,1.0313,1.0186,1.0085,1.0012,0.9965,0.994,0.9931,0.9933,0.9941,0.9953,0.9966,0.9978,0.9988,1); }
}
.magic-bento__cell{ position:relative; min-width:0; min-height:0; --mb-delay:0ms; }
.magic-bento[data-intro] .magic-bento__cell{ opacity:0; transform:translate3d(0,16px,0) scale(.97); }
.magic-bento[data-intro] .magic-bento__cell[data-state="in"]{
  opacity:1; transform:none;
  transition:opacity 420ms cubic-bezier(.22,1,.36,1) var(--mb-delay),
             transform 760ms var(--mb-spring) var(--mb-delay);
}
.magic-bento__card{
  position:relative; box-sizing:border-box; display:flex;
  width:100%; height:100%; flex-direction:column; overflow:hidden;
  border-radius:var(--mb-radius); background:var(--mb-surface);
  box-shadow:var(--mb-shadow); color:var(--mb-ink); text-decoration:none;
  isolation:isolate; outline:none;
  transform:perspective(900px) translate3d(var(--mb-tx,0px),var(--mb-ty,0px),0) scale(var(--mb-press,1));
  user-select:none; -webkit-user-select:none;
}
.magic-bento__card[data-clickable]{ cursor:pointer; }
.magic-bento__card:focus-visible{ box-shadow:var(--mb-shadow), 0 0 0 2px rgba(var(--mb-accent-rgb),.5); }
.magic-bento__light{
  position:absolute; inset:0; z-index:1; border-radius:inherit;
  background:radial-gradient(var(--mb-spot-size) circle at var(--mb-x,-999px) var(--mb-y,-999px),
    rgba(var(--mb-glow-rgb),calc(var(--mb-spot-alpha)*var(--mb-hot,0)*1)) 0%,
    rgba(var(--mb-glow-rgb),calc(var(--mb-spot-alpha)*var(--mb-hot,0)*.973)) 15%,
    rgba(var(--mb-glow-rgb),calc(var(--mb-spot-alpha)*var(--mb-hot,0)*.837)) 30%,
    rgba(var(--mb-glow-rgb),calc(var(--mb-spot-alpha)*var(--mb-hot,0)*.593)) 45%,
    rgba(var(--mb-glow-rgb),calc(var(--mb-spot-alpha)*var(--mb-hot,0)*.317)) 60%,
    rgba(var(--mb-glow-rgb),calc(var(--mb-spot-alpha)*var(--mb-hot,0)*.104)) 75%,
    rgba(var(--mb-glow-rgb),calc(var(--mb-spot-alpha)*var(--mb-hot,0)*.009)) 90%,
    rgba(var(--mb-glow-rgb),0) 100%);
  pointer-events:none;
}
.magic-bento__rim{
  position:absolute; inset:0; z-index:3; border-radius:inherit;
  box-shadow:inset 0 0 0 1px var(--mb-edge), inset 0 1px 0 var(--mb-highlight);
  pointer-events:none;
}
.magic-bento__border{
  position:absolute; inset:0; z-index:4; box-sizing:border-box; padding:1px;
  border-radius:inherit;
  background:
    radial-gradient(var(--mb-border-size) circle at var(--mb-x,-999px) var(--mb-y,-999px),
      rgba(var(--mb-glow-rgb),calc(var(--mb-glow-alpha)*var(--mb-near,0)*1)) 0%,
      rgba(var(--mb-glow-rgb),calc(var(--mb-glow-alpha)*var(--mb-near,0)*.973)) 15%,
      rgba(var(--mb-glow-rgb),calc(var(--mb-glow-alpha)*var(--mb-near,0)*.837)) 30%,
      rgba(var(--mb-glow-rgb),calc(var(--mb-glow-alpha)*var(--mb-near,0)*.593)) 45%,
      rgba(var(--mb-glow-rgb),calc(var(--mb-glow-alpha)*var(--mb-near,0)*.317)) 60%,
      rgba(var(--mb-glow-rgb),calc(var(--mb-glow-alpha)*var(--mb-near,0)*.104)) 75%,
      rgba(var(--mb-glow-rgb),calc(var(--mb-glow-alpha)*var(--mb-near,0)*.009)) 90%,
      rgba(var(--mb-glow-rgb),0) 100%),
    radial-gradient(circle at var(--mb-wx,-999px) var(--mb-wy,-999px),
      rgba(var(--mb-glow-rgb),0) calc(var(--mb-wr,0px) - 110px),
      rgba(var(--mb-glow-rgb),calc(var(--mb-glow-alpha)*var(--mb-wa,0)*.1)) calc(var(--mb-wr,0px) - 80px),
      rgba(var(--mb-glow-rgb),calc(var(--mb-glow-alpha)*var(--mb-wa,0)*.32)) calc(var(--mb-wr,0px) - 52px),
      rgba(var(--mb-glow-rgb),calc(var(--mb-glow-alpha)*var(--mb-wa,0)*.68)) calc(var(--mb-wr,0px) - 28px),
      rgba(var(--mb-glow-rgb),calc(var(--mb-glow-alpha)*var(--mb-wa,0)*.94)) calc(var(--mb-wr,0px) - 10px),
      rgba(var(--mb-glow-rgb),calc(var(--mb-glow-alpha)*var(--mb-wa,0))) calc(var(--mb-wr,0px) - 3px),
      rgba(var(--mb-glow-rgb),0) var(--mb-wr,0px));
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
          mask:linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
  pointer-events:none;
}
.magic-bento__content{
  position:relative; z-index:2; box-sizing:border-box; display:flex;
  min-height:0; flex:1; flex-direction:column; gap:10px; padding:var(--mb-pad);
}
.magic-bento__header{
  display:flex; min-width:0; align-items:center; gap:8px;
  color:var(--mb-muted); font-size:12px; font-weight:600; line-height:16px;
}
.magic-bento__icon{
  display:inline-flex; align-items:center; justify-content:center;
  width:24px; height:24px; border-radius:8px; flex:none;
  color:var(--mb-accent-ink); background:rgb(var(--mb-accent-rgb));
  box-shadow:0 2px 8px -3px rgba(var(--mb-accent-rgb),.55);
}
.magic-bento__icon svg{ width:13px; height:13px; }
.magic-bento__label{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.magic-bento__visual{ position:relative; min-height:0; flex:1; display:flex; }
.magic-bento__text{ display:flex; min-width:0; flex-direction:column; gap:2px; }
.magic-bento__title{
  margin:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  color:var(--mb-ink); font-size:15px; font-weight:800; line-height:20px;
}
.magic-bento__description{
  margin:0; overflow:hidden; color:var(--mb-muted);
  font-size:12.5px; line-height:17px;
}
.magic-bento[data-autohide] .magic-bento__title{ white-space:nowrap; }
.magic-bento__well{
  position:relative; box-sizing:border-box; border-radius:var(--mb-inner-radius);
  background:var(--mb-well); box-shadow:inset 0 0 0 1px var(--mb-well-edge);
}
.magic-bento__figure{ display:flex; min-width:0; align-items:baseline; gap:6px; white-space:nowrap; }
.magic-bento__figure-value{
  color:var(--mb-ink); font-size:15px; font-variant-numeric:tabular-nums;
  font-weight:700; letter-spacing:-.02em; line-height:18px;
}
.magic-bento__figure-note{
  min-width:0; overflow:hidden; color:var(--mb-muted); text-overflow:ellipsis;
  font-size:11.5px; font-variant-numeric:tabular-nums; line-height:14px;
}
.magic-bento__bars{ display:flex; min-height:0; flex:1; flex-direction:column; }
.magic-bento__bars-plot{ display:flex; min-height:0; flex:1; align-items:flex-end; gap:5px; margin-top:6px; }
.magic-bento__bar{
  position:relative; height:calc(var(--h)*100%); min-height:3px; flex:1;
  border-radius:3px 3px 2px 2px; background:rgba(var(--mb-accent-rgb),.18);
  transform-origin:50% 100%;
  transition:background-color 200ms ease, filter 200ms ease;
}
.magic-bento__bar[data-peak]{ background:rgb(var(--mb-accent-rgb)); }
@media (hover:hover){
  .magic-bento__bar:hover{ background:rgba(var(--mb-accent-rgb),.42); }
  .magic-bento__bar[data-peak]:hover{ background:rgb(var(--mb-accent-rgb)); filter:brightness(1.1); }
}
/* --- крупная цифра стат-карты кабинета + подпись-примечание --- */
.magic-bento .mb-big{ font-size:27px; font-weight:800; line-height:30px; letter-spacing:-.02em; }
.magic-bento .mb-big .mb-note{ margin-inline-start:7px; font-size:11.5px; font-weight:600; color:var(--mb-muted); letter-spacing:0; }
/* --- строки метрик в карточке анкеты --- */
.cab-bento .mb-row{ display:flex; flex-wrap:wrap; gap:4px 13px; margin-top:2px; }
.cab-bento .mb-row span{ font-size:.73rem; color:var(--mb-muted); display:inline-flex; align-items:center; gap:5px; }
.cab-bento .mb-row svg{ width:12px; height:12px; color:var(--accent); opacity:.85; flex:none; }
.cab-bento .mb-row b{ color:var(--mb-ink); font-weight:700; }
.cab-bento .mb-row2{ font-size:.7rem; }
.cab-bento .cab-item-act{ display:flex; flex-wrap:wrap; gap:8px; margin-top:auto; padding-top:4px; }
.cab-bento .cab-item-act .btn{ padding:7px 12px; font-size:.76rem; min-height:34px; }
.cab-bento .vip-badge{ flex:none; }
.cab-bento .cab-vip{ border-radius:var(--mb-radius); }
.cab-bento .cab-vip::before{
  content:""; position:absolute; inset:0; z-index:0; border-radius:inherit;
  background:linear-gradient(140deg, rgba(var(--mb-accent-rgb),.14), transparent 46%);
  pointer-events:none;
}
/* --- пустой кабинет внутри бенто-карточки --- */
.cab-empty-in{ align-items:center; justify-content:center; text-align:center; gap:9px; }
.cab-empty-in h4{ margin:0; font-size:1rem; color:var(--mb-ink); }
.cab-empty-in p{ margin:0; font-size:.8rem; color:var(--mb-muted); line-height:1.5; max-width:34ch; }
.cab-empty-in .cab-empty-ic{
  width:52px; height:52px; margin:2px auto 0; border-radius:16px;
  display:flex; align-items:center; justify-content:center;
  color:var(--mb-muted); background:var(--mb-well); box-shadow:var(--press-sm);
}
/* --- анимации карточек: рост баров / появление цифр (реиграются по клику) --- */
.magic-bento[data-motion] .magic-bento__bar{
  animation:magic-bento-grow 760ms var(--mb-spring) calc(var(--mb-delay) + 200ms + var(--i)*55ms) both paused;
}
.magic-bento[data-motion] .mb-big{
  animation:magic-bento-pop 520ms var(--mb-spring) calc(var(--mb-delay) + 320ms) both paused;
}
/* как в оригинале: ячейка вошла в кадр (data-state=in) → анимации разблокируются */
.magic-bento[data-motion] .magic-bento__cell[data-state="in"] .magic-bento__bar{ animation-play-state:running; }
.magic-bento[data-motion] .magic-bento__cell[data-state="in"] .mb-big{ animation-play-state:running; }
@keyframes magic-bento-grow{ from{ transform:scaleY(0); } to{ transform:scaleY(1); } }
@keyframes magic-bento-pop{ from{ opacity:0; scale:.6; } to{ opacity:1; scale:1; } }
/* --- сетка кабинета: модалка ≤560px → фикс 2 колонки --- */
.cab-bento{ grid-template-columns:repeat(2,minmax(0,1fr)); grid-auto-rows:minmax(116px,auto); gap:12px; }

/* ================= ГАРАНТИИ ИНВАРИАНТОВ ================= */
/* Жёсткий запрет blur-стекла (инвариант APK-WebView, все версии) */
.topbar, .bottom-nav, .overlay, .overlay .modal, #welcomeOv,
.search, .map-shell, .cc-cnt, .leafbar, .leaflet-pane, .toast, .float-panel{
  backdrop-filter:none !important; -webkit-backdrop-filter:none !important;
}
/* Ripple не должен ломать фиксированные панели (FIX v1.2.4) */
.float-panel.rip-host{ position:fixed; }
/* Плашки городов — ровно 138/112 (п.29), что бы ни придумал каскад */
#cityGrid .city-card{ flex:0 0 138px; width:138px; }
@media (max-width:560px){
  #cityGrid .city-card{ flex-basis:112px; width:112px; }
}

/* ================= СОСТОЯНИЯ JS · не пропустить ни одно ================= */
.hidden{ display:none !important; }
.no-city{ display:none !important; }          /* до выбора города — скрыты */
.hero-meta{ display:none !important; }        /* удалённая строка координат */
.moon-wrap, .tw{ display:none !important; }
.btn-vip .t{ white-space:nowrap; }
/* gear-иконка: Fluent микро-движение + мини-бейдж заявок */
.btn-gear{ position:relative; }
.btn-gear svg{ transition:transform .5s var(--fl-ease); }
.btn-gear:hover svg{ transform:rotate(60deg); }
.btn-gear .mini-badge{
  position:absolute; top:-5px; inset-inline-end:-5px;
  min-width:17px; height:17px; padding:0 4px; border-radius:99px;
  background:var(--accent); color:#FFF; border:2px solid var(--bar-bg);
  font-size:.6rem; font-weight:800; font-variant-numeric:tabular-nums;
  display:inline-flex; align-items:center; justify-content:center;
}
/* вход выполнен: имя в кнопке входа */
.btn-login.on span{ max-width:130px; overflow:hidden; text-overflow:ellipsis; }
/* счётчики */
.counter.over{ color:var(--danger); font-weight:700; }
.cat-pill .cnt{
  font-size:.7rem; font-weight:700; color:var(--muted);
  background:rgba(var(--line-rgb),.16); border-radius:99px; padding:2px 8px;
  font-family:'Space Grotesk','Rubik',sans-serif;
}
.cat-pill.on .cnt{ background:rgba(255,255,255,.2); color:var(--on-accent); }
/* избранное — сердце залито (НЕ зелёное, НЕ розовое — акцент рубина) */
.fav-on svg{ fill:var(--accent); color:var(--accent); }
.row-fav.fav-on, .detail-fav.fav-on{ color:var(--accent); border-color:rgba(var(--acc-rgb),.5); }
html[data-mode="light"] .row-fav.fav-on,
html[data-mode="light"] .detail-fav.fav-on{ color:var(--accent-lo); border-color:rgba(var(--acc-rgb),.5); }
.chip-fav.fav-on{ color:var(--accent); border-color:rgba(var(--acc-rgb),.5); }
.chip-fav.fav-on svg{ fill:var(--accent); }
/* соединение: офлайн-кэш */
.conn.cache .dot{ background:var(--accent2); }
/* счётчик символов поверх лимита + тосты: уход */
.toast.out{ opacity:0; transform:translateY(-8px); transition:opacity .3s, transform .3s; }
/* подпись-звёздочка обязательных полей */
.field label .req{ color:var(--danger); }
/* ripple на сплошных кнопках — всегда белый */
.rip.on-solid{ background:radial-gradient(circle, rgba(255,255,255,.38) 0%, rgba(255,255,255,0) 62%) !important; }
/* нативный крестик поиска убран — поле чистое */
.search input::-webkit-search-cancel-button{ -webkit-appearance:none; display:none; }
/* .btn-sub — фирменная сплошная пилюля (hero-CTA наследует) */
.btn-sub{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  border:none; border-radius:15px; padding:12px 24px;
  color:var(--on-accent); font-weight:800; font-size:.9rem; white-space:nowrap;
  background:linear-gradient(145deg,var(--accent-hi),var(--accent) 52%,var(--accent2));
  box-shadow:var(--raise-sm), var(--glow-accent), var(--sheen);
  cursor:pointer;
  transition:box-shadow .18s var(--fl-ease), transform .18s var(--fl-ease), filter .18s;
}
.btn-sub .ic{ display:inline-flex; }
.btn-sub .ic svg{ width:17px; height:17px; }
.btn-sub:hover{ filter:brightness(1.08); transform:translateY(-1px); }
.btn-sub:active{ box-shadow:var(--press-sm); transform:translateY(1px) scale(.985); }
/* «Назад» в модалках */
.modal-back{
  display:inline-flex; align-items:center; gap:7px;
  background:var(--input-bg); color:var(--panel-text);
  border:1px solid var(--line-soft); border-radius:11px;
  padding:8px 14px 8px 10px; font-weight:700; font-size:.8rem;
  cursor:pointer; margin-bottom:14px;
  box-shadow:var(--raise-xs), var(--sheen);
  transition:background .2s, transform .15s var(--fl-ease), color .15s;
}
html[dir="rtl"] .modal-back{ padding:8px 10px 8px 14px; }
.modal-back:hover{ color:var(--accent); }
.modal-back:active{ transform:scale(.96); box-shadow:var(--press-sm); }
.modal-close:active{ transform:scale(.88); }
/* гейты (модалки-ограничители) */
.gate-modal h3{ font-size:1.15rem; font-weight:800; margin-bottom:8px; color:var(--panel-text); }
.gate-modal .modal-desc{ margin-bottom:18px; }
.gate-enter{
  display:block; width:100%; margin-top:13px;
  background:none; border:none; color:var(--accent); font:inherit;
  font-size:.9rem; font-weight:800; cursor:pointer;
  text-decoration:underline; text-underline-offset:3px;
}
.gate-enter:hover{ filter:brightness(1.12); color:var(--accent-hi); }
html[data-mode="light"] .gate-enter{ color:var(--accent-lo); }
/* кабинет: добавить анкету / VIP-плашка / срок */
.cab-add{
  display:flex; align-items:center; justify-content:center; gap:8px;
  width:100%; padding:13px 0; border-radius:14px; border:none; cursor:pointer;
  color:var(--on-accent); font-weight:800; font-size:.9rem;
  background:linear-gradient(145deg,var(--accent-hi),var(--accent) 52%,var(--accent2));
  box-shadow:var(--raise-sm), var(--glow-accent), var(--sheen);
  transition:box-shadow .15s, transform .15s var(--fl-ease), filter .15s;
}
.cab-add:hover{ filter:brightness(1.08); }
.cab-add:active{ box-shadow:var(--press-sm); transform:scale(.98); }
.cab-btn:hover{ filter:brightness(1.08); }
.cab-item.vip{
  border-color:rgba(201,169,106,.55);
  background:linear-gradient(145deg, rgba(201,169,106,.12), rgba(201,169,106,.02)), var(--surface);
}
.cab-item-stats b{ color:var(--card); font-family:'Space Grotesk','Rubik',sans-serif; }
.cab-expired{
  display:inline-flex; padding:3px 10px; border-radius:99px;
  font-size:.64rem; font-weight:700;
  color:var(--danger); background:rgba(212,90,90,.12);
  border:1px solid rgba(212,90,90,.35);
}
.cab-sub b{ color:var(--card); }
.cab-empty h4{ color:var(--card); margin-bottom:5px; font-size:.98rem; }
.cab-empty p{ font-size:.8rem; line-height:1.55; }
/* карта: чипы фильтра и координаты */
.mf-chip:hover{ color:var(--card); }
.mf-chip .n{
  min-width:18px; height:18px; padding:0 5px; border-radius:99px;
  display:inline-flex; align-items:center; justify-content:center;
  font-size:.62rem; font-weight:800;
  background:rgba(var(--line-rgb),.18); color:var(--muted);
  font-family:'Space Grotesk','Rubik',sans-serif;
}
.mf-chip.on .n{ background:rgba(255,255,255,.22); color:var(--on-accent); }
.mf-chip.me{ border-color:rgba(var(--acc-rgb),.45); color:var(--accent); }
html[data-mode="light"] .mf-chip.me{ border-color:rgba(var(--acc-rgb),.4); color:var(--accent-lo); }
.map-pop b{ font-size:.8rem; color:var(--muted); }
.map-pop .map-pop-city svg{ width:14px; height:14px; color:var(--accent); }
.dalil-pin.vip svg{ color:#1A1405; }
/* стат-карточки «горячие» */
.stat-card.hot{ border-color:rgba(var(--acc-rgb),.35); }
html[data-mode="light"] .stat-card.hot{ border-color:rgba(var(--acc-rgb),.3); }
.stat-card.hot .stat-num{ color:var(--accent); }
/* welcome: активный язык */
.wv-langs button.on{
  color:var(--on-accent); border-color:transparent;
  background:linear-gradient(145deg,var(--accent-hi),var(--accent) 52%,var(--accent2));
  box-shadow:var(--raise-xs), var(--glow-accent);
}
.vip-badge b{ font-weight:inherit; letter-spacing:inherit; }
.vip-toggle input{ position:absolute; opacity:0; pointer-events:none; }
.vip-strip .b{ color:var(--vip-strong); font-weight:800; }
.views-dec-input{
  background:var(--input-bg); border:1px solid var(--line-soft); border-radius:9px;
  color:var(--panel-text); font:inherit; outline:none;
}
.views-dec-input:focus{ border-color:rgba(var(--acc-rgb),.5); box-shadow:0 0 0 2px rgba(var(--acc-rgb),.18); }
html[data-mode="light"] .views-dec-input:focus{ border-color:rgba(var(--acc-rgb),.5); }
/* Leaflet-кнопки зума — неоморфные */
.leaflet-bar a{
  background:var(--surface) !important; color:var(--card) !important;
  border-bottom:1px solid var(--line-soft) !important;
}
.leaflet-bar a:hover{ background:var(--input-bg) !important; }
.leaflet-popup-content{ margin:12px 14px; line-height:1.45; }
/* футер-реклама и VIP-пакеты */
.foot-ad h4{ font-size:.92rem; color:var(--card); font-weight:700; }
.foot-ad p{ font-size:.76rem; color:var(--muted); line-height:1.5; }
.ttl-pill.ttl-ok{ color:var(--on-accent); background:rgba(var(--acc-rgb),.75); }
html[data-mode="light"] .ttl-pill.ttl-ok{ background:rgba(var(--acc-rgb),.82); }
.ttl-pill.ttl-warn{ color:#8A5A12; background:rgba(255,197,61,.25); border:1px solid rgba(255,197,61,.4); }
.ttl-pill.ttl-dead{ color:#E88; background:rgba(212,90,90,.14); border:1px solid rgba(212,90,90,.35); }
.btn-renew svg{ width:14px; height:14px; }
.btn-danger svg{ color:currentColor; }
h4{ font-weight:700; }
/* деталка: блок оценки и просмотрщиков */
.rate-title svg{ width:15px; height:15px; color:var(--accent); }
.rate-star.on svg{ fill:var(--vip-strong); }
.detail-meta > span{ min-width:0; }
.notif-item.unread .ni-ic{ color:var(--on-accent); background:var(--accent); box-shadow:none; }
.notif-empty svg{ width:40px; height:40px; opacity:.5; margin-bottom:8px; }
/* subjects-чипы и маршрутные чипы наследуют .chip ✓ */
.route-pick .chip{ font-size:.74rem; }
.subjects-block .chip{ font-size:.74rem; }
.subjects-title svg{ width:14px; height:14px; color:var(--accent); }
.test-head span:first-child{ display:inline-flex; }
.theme-seg button + button{ }
.plan-free{ border-color:rgba(201,169,106,.45); }
.body-no-scroll{ overflow:hidden; }

/* ================= v5.5.0 · PRICING 1 (React Bits Pro → vanilla) — в секции #subsSec внизу главной =================
    Три тарифа (Базовый / Проверено / VIP) + тумблер биллинга месяц↔год.
    Цены — наши ($0, $5/$39, $10/$70); CTA: мастер заявки, WhatsApp (data-pack),
    «все пакеты» → VIP-модалка. VIP-карточка — антикварное золото §7
    (--vip-grad/--vip-strong/--vip-wash не меняются). Все цвета — токены. */
.pricing{
  max-width:1180px; margin:0 auto; padding:30px var(--pad) 6px;
  display:flex; flex-direction:column; gap:20px;
}
.pr-head{ display:flex; flex-direction:column; align-items:center; gap:9px; text-align:center; }
.pr-head h2{ font-size:1.42rem; color:var(--card); display:flex; align-items:center; gap:9px; }
.pr-head h2 svg{ width:21px; height:21px; color:var(--accent); }
.pr-sub{ font-size:.86rem; color:var(--muted); line-height:1.55; max-width:540px; }
.pr-toggle{
  display:inline-flex; gap:4px; padding:4px; margin-top:4px;
  border-radius:99px; background:var(--surface); border:1px solid var(--line-soft);
  box-shadow:var(--raise-xs), var(--sheen);
}
.pr-toggle button{
  border:none; background:transparent; cursor:pointer;
  padding:8px 20px; border-radius:99px;
  font-weight:700; font-size:.8rem; color:var(--muted);
  transition:color .15s, box-shadow .15s, transform .15s var(--fl-ease);
}
.pr-toggle button.on{
  color:var(--on-accent);
  background:linear-gradient(145deg,var(--accent-hi),var(--accent) 52%,var(--accent2));
  box-shadow:var(--raise-xs), var(--glow-accent);
}
.pr-toggle button:active{ transform:scale(.97); }
.pr-grid{ display:grid; gap:14px; grid-template-columns:1fr; }
@media (min-width:920px){ .pr-grid{ grid-template-columns:repeat(3,1fr); align-items:stretch; } }
.pr-card{
  position:relative; display:flex; flex-direction:column; gap:12px;
  padding:22px 20px 18px; border-radius:22px;
  background:var(--panel); border:1px solid var(--line-soft);
  box-shadow:var(--raise-sm), var(--sheen);
  transition:transform .2s var(--fl-ease), box-shadow .2s;
}
.pr-card:hover{ transform:translateY(-3px); box-shadow:var(--raise), var(--shadow-pop), var(--sheen); }
.pr-card.best{ border-color:rgba(var(--acc-rgb),.5); }
.pr-card.vipc{
  border-color:rgba(201,169,106,.55);
  background:linear-gradient(170deg,var(--panel) 46%,var(--vip-wash) 130%);
}
.pr-name{ font-weight:800; font-size:1rem; color:var(--card); display:flex; align-items:center; gap:8px; }
.pr-name .pr-nic{
  width:26px; height:26px; flex:none; border-radius:9px; padding:5px;
  color:var(--accent); background:var(--surface); box-shadow:var(--raise-xs), var(--sheen);
}
.pr-name .pr-nic svg{ width:100%; height:100%; }
.pr-card.vipc .pr-name .pr-nic{ color:#8A6B2F; background:var(--vip-wash); }
.pr-price{ display:flex; align-items:baseline; gap:9px; flex-wrap:wrap; }
.pr-num{
  font-size:2.05rem; font-weight:800; color:var(--accent); line-height:1;
  font-family:'Space Grotesk','Rubik',sans-serif;
}
.pr-card.vipc .pr-num{ color:var(--vip-strong); }
.pr-per2{ font-size:.78rem; color:var(--muted); }
.pr-per-free{ font-size:.78rem; color:var(--muted); }
.pr-feats{ list-style:none; margin:4px 0 2px; padding:0; display:flex; flex-direction:column; gap:9px; flex:1; }
.pr-feats li{
  display:flex; gap:9px; align-items:flex-start;
  font-size:.82rem; line-height:1.5; color:var(--muted);
}
.pr-feats li::before{
  content:"✓"; flex:none; width:17px; height:17px; margin-top:1px;
  display:inline-flex; align-items:center; justify-content:center;
  border-radius:50%; font-size:.62rem; font-weight:900;
  color:var(--on-accent); background:var(--accent);
}
.pr-card.vipc .pr-feats li::before{ color:#1A1405; background:var(--vip-grad); }
.pr-cta{
  margin-top:4px; width:100%; min-height:44px; padding:11px 12px;
  border-radius:13px; display:inline-flex; align-items:center; justify-content:center;
  font-weight:800; font-size:.88rem; text-align:center; text-decoration:none; cursor:pointer;
  transition:box-shadow .15s, transform .15s var(--fl-ease), filter .15s;
}
.pr-cta.ghost{ border:1px solid var(--line-soft); background:var(--surface); color:var(--card); box-shadow:var(--raise-xs), var(--sheen); }
.pr-cta.solid{ border:none; color:var(--on-accent); background:linear-gradient(145deg,var(--accent-hi),var(--accent) 52%,var(--accent2)); box-shadow:var(--raise-sm), var(--glow-accent), var(--sheen); }
.pr-cta.gold{ border:none; color:#1A1405; background:var(--vip-grad); box-shadow:var(--raise-sm), var(--sheen); }
.pr-cta:active{ transform:scale(.985); box-shadow:var(--press-sm); }
.pr-cta:hover{ filter:brightness(1.05); }
.pr-ribbon{
  position:absolute; top:-11px; inset-inline-start:16px;
  padding:3px 12px; border-radius:99px; white-space:nowrap;
  font-size:.6rem; font-weight:800; letter-spacing:.06em; text-transform:uppercase;
  color:#1A1405; background:var(--vip-grad); box-shadow:var(--raise-xs), var(--sheen);
}
.pr-foot{ text-align:center; font-size:.74rem; color:var(--muted); line-height:1.5; padding:0 12px; }
.pr-all{
  align-self:center; border:none; background:transparent; cursor:pointer;
  font-size:.8rem; font-weight:700; color:var(--accent);
  display:inline-flex; align-items:center; gap:6px; padding:6px 10px;
  border-radius:10px; transition:color .15s;
}
.pr-all svg{ width:14px; height:14px; }
.pr-all:hover{ color:var(--accent-hi); }

/* ================= v5.5.0 · Прайсинг живёт в секции #subsSec внизу главной =================
    Вкладки кабинета переиспользуют .adm-tabs (темы/светлая мода уже
    покрыты). Панель «Подписки»: текущие подписки анкет владельца
    (реальные данные) + тарифы Pricing 1. В модалке ~560px тарифы всегда
    в одну колонку, независимо от ширины вьюпорта. */
.cab-tabs{ margin-top:2px; }
.cab-pane{ display:flex; flex-direction:column; gap:14px; }
.cab-pane[hidden]{ display:none; }
/* v5.6.0: .cab-pane-оверрайды прайсинга удалены — прайсинг переехал
   в секцию #subsSec внизу главной, в кабинете только список. */
.pr-now{ display:flex; flex-direction:column; gap:8px; }
.pr-now-none{
  font-size:.8rem; color:var(--muted); line-height:1.55;
  padding:11px 14px; border-radius:14px;
  border:1px dashed var(--line-soft); background:var(--surface);
}
.pr-now-row{
  display:flex; align-items:center; gap:10px; min-width:0;
  padding:10px 13px; border-radius:14px;
  background:var(--surface); border:1px solid var(--line-soft);
  box-shadow:var(--raise-xs), var(--sheen);
}
.pr-now-row > b{
  flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  font-size:.82rem; color:var(--card);
}
.pr-now-meta{ display:flex; align-items:center; gap:7px; flex:none; font-size:.72rem; color:var(--muted); }
.pr-now-exp{ color:var(--danger); font-weight:700; }
.pr-now-badge{
  flex:none; display:inline-flex; align-items:center;
  padding:3px 9px; border-radius:99px;
  font-size:.64rem; font-weight:800; letter-spacing:.04em;
}
.pr-now-badge.base{ color:var(--muted); background:var(--panel); border:1px solid var(--line-soft); }
.pr-now-badge.ver{ color:var(--accent); background:rgba(var(--acc-rgb),.12); border:1px solid rgba(var(--acc-rgb),.4); }
.pr-now-badge.vipb{ color:#1A1405; background:var(--vip-grad); }
/* ============ v2.0.1 · ЕДИНЫЙ ПОЛНОЭКРАННЫЙ ЭКРАН ТАРИФОВ (#subsSec) ============
   Приказ владельца: «тарифы везде отдельным экраном с кнопкой назад».
   Один экран: body.subs-mode прячет всё, кроме #subsSec (модалки
   .overlay остаются доступны — CTA с экрана работают); дверь назад —
   sticky-шапка с кнопкой «назад». Входы: VIP-кнопка шапки, CTA 13
   «Выделяйся», «Все тарифы и подписки» кабинета. Карта НЕ тронута.
   Состав: шапка-бар + текущие подписки + Pricing 1 + золотой блок
   «DALIL VIP» (бывшая vipOv). display:flex требует явного [hidden]-
   правила. Всё на токенах — 7 тем × 2 моды; RTL — на inline-логике,
   движение только transform/opacity (WebView-дружелюбно). */
.subs-sec{
  position:relative; width:100%; max-width:1060px; margin:0 auto;
  padding:0 var(--pad) 8px;
  display:flex; flex-direction:column; gap:18px; align-items:center;
}
.subs-sec[hidden]{ display:none !important; }  /* flex перебивает UA-hidden */
body.subs-mode .subs-sec{ min-height:100dvh; padding-bottom:34px; }
/* v2.0.1 · режим экрана: прячем все прямые children body, кроме самого
   #subsSec, модалок (.overlay — доступны для CTA) и тостов; welcome-экран
   тоже прячется (#welcomeOv не .overlay, а fixed div — иначе накрыл бы
   экран у гостя). Сокрытие наследуемое: главная уходит целиком —
   отдельные её узлы не перечисляются. */
body.subs-mode > :not(#subsSec):not(.overlay):not(#toastWrap){ display:none !important; }
body.subs-mode #welcomeOv{ display:none !important; }
/* Полутоновая подложка сверху секции (наследие фон-декора страницы 2) */
.subs-sec::before{
  content:""; position:absolute; inset:0 0 auto 0; height:340px;
  pointer-events:none;
  background-image:radial-gradient(rgba(var(--acc-rgb),.055) 1.2px, transparent 1.3px);
  background-size:22px 22px;
  -webkit-mask-image:linear-gradient(#000 30%, transparent);
          mask-image:linear-gradient(#000 30%, transparent);
}
.subs-sec > *{ position:relative; }
/* Шапка экрана: sticky-бар — «назад» + корона; фон почти прозрачный
   (halftone секции слегка просвечивает), fallback — сплошной var(--bg). */
.subs-topbar{
  position:sticky; top:0; z-index:60; align-self:stretch; width:100%;
  margin:0 0 20px; padding:9px max(var(--pad),calc((100% - 1060px)/2));
  display:flex; align-items:center; gap:10px;
  background:var(--bg);
  background:color-mix(in srgb,var(--bg) 86%,transparent);
  -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line-soft);
}
.subs-back{
  display:inline-flex; align-items:center; gap:7px;
  padding:9px 16px 9px 13px; border-radius:999px;
  border:1px solid var(--line-soft); background:var(--surface);
  color:var(--card); font:inherit; font-size:.84rem; font-weight:700;
  cursor:pointer; box-shadow:var(--raise-xs);
  transition:filter .15s ease, transform .15s ease;
}
.subs-back svg{ width:15px; height:15px; flex:none; }
.subs-back:hover{ filter:brightness(1.12); }
.subs-back:active{ transform:scale(.96); box-shadow:var(--press-sm); }
[dir="rtl"] .subs-back svg{ transform:scaleX(-1); }
.sp-crown{ margin-inline-start:auto; width:34px; height:24px; color:var(--accent); opacity:.9; }
.sp-crown svg{ width:100%; height:100%; }
.subs-head{ display:flex; flex-direction:column; align-items:center; gap:9px; text-align:center; margin-top:26px; }
.sp-title{ font-size:1.5rem; color:var(--card); text-align:center; margin:0; }
.sp-sub{ font-size:.88rem; color:var(--muted); line-height:1.6; text-align:center; max-width:560px; margin:0; }
.sp-now{ width:100%; max-width:980px; }
/* Прайсинг в секции: как в Pricing 1 — 3 колонки на ПК, одна на телефоне */
.subs-sec .pricing{ width:100%; padding:6px 0 0; }
.subs-sec .pr-grid{ grid-template-columns:repeat(3,1fr); max-width:980px; }
.cab-look{ margin-top:2px; }
/* ============ v5.5.0 · CTA 13 (React Bits Pro → vanilla) ============
   Serif-панель с полутоновой (halftone) текстурой: точки — чистый CSS
   (radial-gradient + mask-image), без blur-фильтров; заголовок Georgia
   italic (для арабского — системный насх), золотая галочка и кнопка
   в VIP-золоте §7 (без изменений канона).
   v5.6.2: стоит НАВЕРХУ главной страницы — после волны-ленты,
   перед городами (приказ: «выше, заметнее»), вне #subsSec. */
/* v5.6.2: кубик «Выделяйся» живёт в общем потоке главной (после
   волны-ленты) — центрируется сам через margin-inline:auto */
.cta13{
  position:relative; overflow:hidden; width:100%; max-width:980px;
  margin:18px auto 0;
  text-align:center; padding:36px 26px 32px;
  display:flex; flex-direction:column; align-items:center; gap:12px;
  background:var(--surface); border:1px solid var(--line-soft);
  border-radius:var(--r-lg); box-shadow:var(--raise), var(--sheen);
}
.cta13::before{
  content:""; position:absolute; inset:0; pointer-events:none;
  background-image:radial-gradient(rgba(var(--acc-rgb),.16) 1.3px, transparent 1.4px);
  background-size:12px 12px;
  -webkit-mask-image:radial-gradient(130% 100% at 50% 0%, #000 26%, transparent 76%);
          mask-image:radial-gradient(130% 100% at 50% 0%, #000 26%, transparent 76%);
}
.cta13 > *{ position:relative; }
.cta13-t{
  font-family:Georgia,'Times New Roman',serif; font-style:italic; font-weight:700;
  font-size:2.25rem; line-height:1.12; letter-spacing:.01em;
  color:var(--card); margin:0;
}
.cta13-t::after{
  content:""; display:block; width:64px; height:3px; margin:12px auto 0;
  border-radius:2px; background:var(--vip-grad);
}
.cta13-s{
  display:flex; align-items:center; justify-content:center; gap:9px; flex-wrap:wrap;
  font-size:.92rem; color:var(--muted); line-height:1.55; max-width:560px; margin:0;
}
.cta13-chk{
  width:24px; height:24px; flex:none; border-radius:50%;
  display:inline-flex; align-items:center; justify-content:center;
  color:#1A1405; background:var(--vip-grad); box-shadow:var(--raise-xs);
}
.cta13-chk svg{ width:13px; height:13px; }
.cta13-btn{
  display:inline-flex; align-items:center; gap:9px; cursor:pointer;
  border:none; border-radius:16px; padding:13px 26px;
  font:inherit; font-weight:800; font-size:.95rem; color:#1A1405;
  background:var(--vip-grad); box-shadow:var(--raise-sm), var(--sheen);
  transition:transform .15s ease, box-shadow .15s ease, filter .15s ease;
}
.cta13-btn:hover{ transform:translateY(-2px); filter:brightness(1.05); }
.cta13-btn:active{ transform:translateY(1px) scale(.98); box-shadow:var(--press-sm); }
.cta13-btn svg{ width:17px; height:17px; }
/* ============ v5.5.0 · Footer 8 (React Bits Pro → vanilla) ============
   Центрированный футер секции #subsSec: бренд, тэглайн, соцкнопки
   (Telegram-канал + WhatsApp-поддержка), агент и офис — наша инфа. */
.ft8{
  width:100%; max-width:980px; margin:10px auto 14px; padding-top:22px; /* v5.10.0: auto — центр внизу страницы (перенесён из вкладки «Тарифы») */
  border-top:1px solid var(--line-soft);
  display:flex; flex-direction:column; align-items:center; gap:9px; text-align:center;
}
.ft8-brand{ font-weight:800; letter-spacing:.14em; font-size:.86rem; color:var(--card); }
.ft8-brand b{ color:var(--accent); margin:0 6px; }
.ft8-tag{ font-size:.78rem; color:var(--muted); }
.ft8-soc{ display:flex; align-items:center; justify-content:center; gap:12px; margin:6px 0 2px; }
.ft8-soc a{
  width:42px; height:42px; border-radius:14px;
  display:inline-flex; align-items:center; justify-content:center;
  color:var(--card); background:var(--surface); border:1px solid var(--line-soft);
  box-shadow:var(--raise-xs), var(--sheen);
  transition:transform .15s ease, color .15s ease;
}
.ft8-soc a:hover{ transform:translateY(-2px); color:var(--accent); }
.ft8-soc a svg{ width:19px; height:19px; }
.ft8-line{ font-size:.74rem; color:var(--muted); line-height:1.55; max-width:620px; margin:0; }
.ft8-line.ft8-addr{ font-size:.7rem; opacity:.85; }
.ft8-copy{ font-size:.68rem; color:var(--muted); opacity:.8; letter-spacing:.06em; margin:2px 0 0; }
@media (max-width:920px){
  .subs-sec .pr-grid{ grid-template-columns:1fr; }
  /* v2.0.2: width:auto — ширина 100% + боковые поля выпирали за экран */
  .cta13{ padding:30px 18px 26px; margin:16px var(--pad) 0; width:auto; }
  .cta13-t{ font-size:1.72rem; }
}
@media (max-width:560px){
  .subs-sec{ padding:0 14px 4px; gap:15px; }
  .sp-title{ font-size:1.3rem; }
  .ft8-soc a{ width:38px; height:38px; }
  /* ============ v2.0.2 · МОБИЛЬНЫЕ КОМПАКТЫ ============
     Тарифы: 2 плитки РЯДОМ для сравнения (Базовый | VIP),
     «Проверено» — во всю ширину строкой ниже; компактная типографика,
     иначе цены ($10) переносятся. Десктоп (3 колонки) не тронут. */
  .subs-sec .pr-grid{
    grid-template-columns:repeat(2,1fr); gap:10px;
    grid-template-areas:"b v" "q q";  /* ряд 1: Базовый|VIP рядом; ряд 2: Проверено на всю ширину */
  }
  .subs-sec .pr-card:nth-child(1){ grid-area:b; }
  .subs-sec .pr-card:nth-child(2){ grid-area:q; }
  .subs-sec .pr-card:nth-child(3){ grid-area:v; }
  .subs-sec .pr-card{ padding:14px 12px 12px; }
  .pr-num{ font-size:1.4rem; }
  .pr-feats li{ font-size:.72rem; gap:7px; }
  .pr-cta{ min-height:38px; padding:8px 10px; font-size:.78rem; }
  /* Подкатегории-«слитки»: 2 в ряд, высота ~вдвое меньше —
     длинный вертикальный список на телефоне убран. */
  .level-cards{ grid-template-columns:repeat(2,1fr); gap:9px; }
  .level-card{ padding:7px 9px 7px 12px; }
  .lc-title{ font-size:.76rem; }
  .lc-sub{ font-size:.62rem; }
  .lc-cnt{ font-size:.7rem; }
  .level-card::before{ width:3px; }
}
/* Marquee заставки: приглушённые звёзды без оценок + VIP-чип реальной анкеты */
.wv-tstars.dim{ opacity:.4; }
.wv-trow{ display:flex; align-items:center; justify-content:space-between; gap:8px; min-width:0; }
.wv-trow .vip-badge{ flex:none; }

</style>
</head>

<!-- v5.2 · Ирис-маска перехода тем: чернильный круг от нажатого свотча -->
<div id="themeWipe" aria-hidden="true"><i class="wipe-disc"></i></div>
<script type="module">
  /* DALIL SURIYA · دليل سوريا · build: SYRIA-v1.3.0 · MIDNIGHT GOLD (нумерация — по требованию владельца;
     в пакет входит всё: админ-панель, избранное, хотфиксы v1.3.x и новые функции ниже) —
     ХОТФИКС v1.2.8:
     · ЖАЛОБЫ — в форме «Пожаловаться» кнопки-причины были НЕВИДИМЫ, пока
       не выберешь: чипы наследовали color:var(--card), а фон самой модалки
       тоже var(--card) — текст был цвет-в-цвет с фоном (в ОБЕИХ темах).
       Теперь явные читаемые цвета: заливка, тёмный/светлый текст var(--bg),
       понятная рамка, hover; выбранная причина — акцентная (как и раньше);
     · МАРШРУТЫ — город-чипы выбора пункта Б в форме заявки были бледными
       (var(--muted) на модалке) — тот же класс проблемы, укреплены так же;
     ПАКЕТ v1.2.7:
     · ЖАЛОБА — кнопка «Пожаловаться» теперь видна ВСЕМ, включая админа
       (раньше пряталась за !state.admin — владелец её не видел и думал,
       что кнопки нет; посетители её всегда видели в открытой карточке);
     · ЗАЩИТА: блокировка подбора пароля — после 5 неудачных входов форма
       блокируется на 5 минут (dalil_lockuntil, текст «Слишком много попыток»);
       антиспам заявок — номер отправленной заявки запоминается (dalil_sentphones),
       повтор с тем же номером отклоняется («Заявка с этим номером уже на
       рассмотрении»); мгновенные (ботовые) отправки < 2.5 с отклоняются;
     · СЕРДЦЕ: прямая привязка обработчика на КАЖДУЮ кнопку в списке с
       stopPropagation (карточка физически не может открыться от тапа по сердцу)
       + дебаунс 400 мс от двойного тапа + иконка 16px;
     · ВОЛНЫ: пустое пространство под списком заполнено динамичными
       анимированными линиями-волнами (4 слоя, бронза/бирюза, разная скорость,
       остановка при prefers-reduced-motion);
     · ПОИСК: триграммный нечёткий поиск — запрос и текст режутся на 3-символьные
       куски; совпадение ≥ 30% триграмм находит анкету с опечаткой или неполным
       словом («хлебб» → «хлеб», «الشعيي» → «الشعيب»);
     · ПОДКАТЕГОРИИ +5: Пекарня·хлеб (مخبز) и Пахлава·хелуият (حلويات) — после
       «Продуктовый», Обувь (أحذية) и Макияж·косметика (مكياج) — после «Одежда»
       в магазинах; Парикмахерская (حلاق) — после «Кафе» в услугах;
     ХОТФИКС ПАНЕЛИ v1.3.1: модалка админки сжималась под контент, а 5 вкладок
     не влезали в ряд: за скрытым горизонтальным скроллом прятались «Анкеты» и
     «Инструменты» — админ не знал, что они есть. Теперь: .adm-modal — жёсткая
     колоночная высота min(90vh,780px) (мобила 92vh), .adm-pane забирает всё
     оставшееся место (max-height:58vh убран), на ≤760px вкладки переносятся
     в 2 ряда — видны все пять; статы компактнее;
     ХОТФИКС СЕРДЦА v1.3.1: кнопка ♥ на карточке была высотой 33px, промах
     пальцем по зазору попадал в строку и ОТКРЫВАЛ анкету — избранное ставилось
     только со второго раза из открытой карточки. Теперь: тап в зоне .row-actions
     мимо кнопки больше не открывает карточку (guard в обработчике #list),
     а кнопки действий на ≤760px стали 44px высотой (Apple HIG);
     ИЗБРАННОЕ v1.3.1: подсказка в пустом состоянии на 6 языках — список хранится
     в браузере устройства (localStorage), без регистрации, отдельно на каждом
     телефоне/компьютере;

     pointerdown ловит и мышь, и палец, и стилус; span.rip удаляется сам по animationend.

  const RIP_SEL = ".btn, .btn-sub, .btn-add, .btn-admin, .cat-pill, .chip, " +
    ".city-card, .level-card, .plan, .float-sub, .float-panel, .adm-tab, .tool-btn, .modal-back, .bn-item, .bn-fab";
  const RIP_SOLID = ".btn-solid, .btn-sub, .btn-add, .float-sub, .float-panel, .bn-fab, " +
    ".cat-pill.on";
  document.addEventListener("pointerdown", (e) => {
    if (e.button !== 0) return; // левая кнопка / тач / перо — правый клик молчит
    const host = e.target.closest(RIP_SEL);
    if (!host || !host.isConnected) return;
    host.classList.add("rip-host");
    const r = host.getBoundingClientRect();
    const d = Math.max(r.width, r.height) * 1.7 + 6;
    const sp = document.createElement("span");
    sp.className = "rip" + (host.matches(RIP_SOLID) ? " on-solid" : "");
    sp.style.width = sp.style.height = d + "px";
    sp.style.left = (e.clientX - r.left - d / 2) + "px";
    sp.style.top  = (e.clientY - r.top  - d / 2) + "px";
    host.appendChild(sp);
    /* FIX v1.2.4: span.rip удаляется вместе с классом .rip-host — раньше класс
       оставался навсегда и держал на кнопке position:relative (см. CSS-хотфикс).
       Если на хосте ещё живёт другой span (быстрый повторный тап) — класс ждёт его */
    const dropRip = () => {
      sp.remove();
      if (!host.querySelector(".rip")) host.classList.remove("rip-host");
    };
    sp.addEventListener("animationend", dropRip, { once: true });
    setTimeout(dropRip, 700); // страховка, если анимация прервана
  }, { passive: true });

    const st = (r && r.stack) ? String(r.stack) : "";

    toast(msg, "err");

     MetaMask" (chrome-extension://…/inpage.js) — это ЧУЖОЙ код, не DALIL. */
  const EXT_NOISE_RE = /chrome-extension:\/\/|moz-extension:\/\/|safari-(web-)?extension:\/\/|edge-extension:\/\/|extensions::|inpage\.js|content[-_]script/i;
  const NOISE_MSG_RE = /metamask|ethereum\b|web3\b|window\.ethereum|ResizeObserver loop|Script error\.?|Extension context invalidated|listener indicated an asynchronous response|Non-Error promise rejection|Failed to fetch.*extensions/i;
  const ERR_SEEN = new Set(); let ERR_SENT = 0;
  function isErrNoise(msg, stack, src) {
    const all = String(msg || "") + "\n" + String(stack || "") + "\n" + String(src || "");
    if (EXT_NOISE_RE.test(all)) return true;  /* код расширений браузера */
    if (NOISE_MSG_RE.test(all)) return true;  /* известный посторонний шум */
    return false;
  }
  function reportClientError(kind, msg, extra) {
    try {
      const stack = (extra && extra.stack) || "", src = (extra && extra.src) || "";
      if (isErrNoise(msg, stack, src)) return;      /* п.37: чужое — молча */
      const key = kind + "|" + String(msg).slice(0, 120);
      if (ERR_SEEN.has(key)) return;                /* дедуп: одна ошибка — один репорт за сессию */
      ERR_SEEN.add(key);
      if (++ERR_SENT > 6) return;                   /* лимит: бот не спамим */
      fetch(API + "/api/client-error", {
        method: "POST", headers: { "Content-Type": "application/json" },
        keepalive: true,
        body: JSON.stringify(Object.assign({
          v: (typeof APP_VERSION !== "undefined") ? APP_VERSION : "?",
          msg: kind + ": " + String(msg).slice(0, 260),
          url: location.href.slice(0, 180),
          ua: navigator.userAgent.slice(0, 180),
          deviceId: (typeof deviceId !== "undefined") ? deviceId : undefined
        }, extra || {}))
      }).catch(() => {});
    } catch (_) {}
  }
  window.addEventListener("error", e => reportClientError("js",
    e.message, { src: String(e.filename || "").split("/").pop() + ":" + (e.lineno || 0),
      stack: (e.error && e.error.stack || "").slice(0, 600) }));
