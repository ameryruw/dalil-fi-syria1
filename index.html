  function loadXLSXLib() {
    return new Promise((res, rej) => {
      if (window.XLSX) return res();
      const s = document.createElement("script");
      s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
      s.onload = res;
      s.onerror = () => rej(new Error("XLSX library failed to load"));
      document.head.appendChild(s);
    });
  }

  /* Дата из ответа сервера (createdAt/updatedAt) или числа мс (expiresAt) */
  function fmtTs(v) {
    if (v === null || v === undefined || v === "") return "";
    try {
      const d = typeof v.toDate === "function" ? v.toDate()
        : (typeof v.seconds === "number" ? new Date(v.seconds * 1000) : new Date(Number(v)));
      if (isNaN(d.getTime())) return "";
      const pad = (n) => String(n).padStart(2, "0");
      return `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    } catch { return ""; }
  }

  /* Строки для Excel — все поля анкеты, значения по-человечески (не id) */
  function buildExportRows(docs) {
    return (docs || []).map(p => {
      const cat = CATS.find(c => c.id === p.category || c.base === p.category);
      const lv = cat && cat.levels ? cat.levels.find(l => l.id === p.group) : null;
      const routes = Array.isArray(p.routes) ? p.routes : [];
      return {
        "ID": p.id || "",
        "Название (ар)": (p.names && p.names.ar) || p.title || "",
        "Название (en)": (p.names && p.names.en) || "",
        "Категория": cat ? catName(cat) : (p.category || ""),
        "Уровень": lv ? levelName(lv) : "",
        "Подкатегория": p.subcategory ? subName(p.group || p.category, p.subcategory) : "",
        "Город": cityName(p.city),
        "Телефон": p.phone || "",
        "Локация": p.location || "",
        "Маршруты": routes.map(id => cityName(id)).join(", "),
        "Марка авто": p.carMake || "",
        "Просмотры": p.views || 0,
        "Описание": p.description || "",
        "Создано": fmtTs(p.createdAt),
        "Обновлено": fmtTs(p.updatedAt),
        "Действует до": fmtTs(p.expiresAt)
      };
    });
  }

  function exportExcel() {
    const rows = buildExportRows(state.docs);
    if (!rows.length) { toast(t("exportEmpty"), "err"); return; }
    const ws = XLSX.utils.json_to_sheet(rows);
    /* ширины колонок по самой длинной ячейке (потолок 40) */
    ws["!cols"] = Object.keys(rows[0]).map(k => ({
      wch: Math.min(40, Math.max(k.length + 2, ...rows.map(r => String(r[k] ?? "").length + 2)))
    }));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Анкеты");
    const dte = new Date();
    const pad = (n) => String(n).padStart(2, "0");
    XLSX.writeFile(wb, `dalil-ankety-${dte.getFullYear()}-${pad(dte.getMonth() + 1)}-${pad(dte.getDate())}.xlsx`);
    toast(t("exportDone").replace("{n}", rows.length));
  }

  /* метка времени в мс: {seconds} с сервера | {toDate()} | ISO-строка | число */
  const tsOf = (v) => {
    if (!v) return 0;
    if (typeof v === "number") return v;
    if (typeof v.seconds === "number") return v.seconds * 1000;
    if (v.toDate) { try { return v.toDate().getTime(); } catch (e) {} }
    const t = Date.parse(v);
    return Number.isFinite(t) ? t : 0;
  };

  /* v1.4.0: живой канал заменён опросом нашего сервера (20 сек) */
  async function fetchReqs() {

    reqsInFlight = true;
    try {
      const j = await admFetch("/api/admin/applications?status=pending");
      reqsCache = (j.docs || []).sort((a, b) => tsOf(b.createdAt) - tsOf(a.createdAt));
      updateReqsBadge();
      if (state.admin && $("admOverlay").classList.contains("show") && admTab === "reqs") renderReqs();
    } catch (e) { console.warn("reqs poll:", e && e.message); }
    reqsInFlight = false;
  }
  function watchReqs() {
    if (reqsTimer) return;
    fetchReqs();
    reqsTimer = setInterval(fetchReqs, 20000);
  }
  function unwatchReqs() {
    if (reqsTimer) { clearInterval(reqsTimer); reqsTimer = null; }
    reqsCache = [];
    updateReqsBadge();
  }

  function renderReqs() {
    const list = $("admReqsList");
    $("admReqsCount").textContent = reqsCache.length
      ? `${reqsCache.length} · ${t("reqsPending")}`
      : t("reqsEmpty");
    if (!reqsCache.length) { list.innerHTML = ""; return; }
    list.innerHTML = reqsCache.map((r, i) => {
      const tel = (r.phone || "").replace(/[^\d+]/g, "");
      const routes = (Array.isArray(r.routes) && r.routes.length)
        ? `${esc(t("routeFrom"))}: ${esc(cityName(r.city))} ${flowArrow()} ${r.routes.map(id => esc(cityName(id))).join(" · ")}`
        : "";
      return `
      <div class="req-card" style="animation-delay:${Math.min(i * 45, 300)}ms">
        <div class="req-top">
          <span class="req-plan">${esc(planName(r.plan))} · ${esc(r.planPrice || PLAN_PRICE[r.plan] || "")}</span>
          <span class="req-date">${esc(fmtTs(r.createdAt))}</span>
        </div>
        <div class="req-name">${esc(r.title || "")}</div>
        ${PHOTO_UI && r.img ? `<img class="req-ph" src="${esc(r.img)}" alt="" loading="lazy" decoding="async">` : ""}
        <div class="req-meta">
          ${tel ? `<span class="ltr-num">${icon("phone", 13)}${esc(r.phone)}</span>` : ""}
          <span>${icon("city", 13)}${esc(cityName(r.city))}</span>
          <span>${icon("book", 13)}${esc(subName(r.group, r.subcategory))}</span>
          ${r.location ? `<span>${icon("pin", 13)}${esc(r.location)}</span>` : ""}
          ${r.carMake ? `<span>${icon("car", 13)}${esc(r.carMake)}</span>` : ""}
        </div>
        ${routes ? `<div class="req-meta"><span>${icon("route", 13)}${routes}</span></div>` : ""}
        ${r.description ? `<p class="req-desc">${esc(r.description)}</p>` : ""}
        <div class="req-actions">
          <button type="button" class="btn btn-solid req-approve" data-id="${esc(r.id)}">${icon("check", 14)}${esc(t("reqsApprove"))}</button>
          <button type="button" class="btn btn-danger req-reject" data-id="${esc(r.id)}">${icon("x", 14)}${esc(t("reqsReject"))}</button>
          ${tel ? `<a class="btn btn-outline" href="tel:${esc(tel)}">${icon("phone", 14)}${esc(t("call"))}</a>` : ""}
        </div>
      </div>`;
    }).join("");
  }

  /* v1.3.0: очередь заявок открыается вкладкой «Заявки» в админ-панели */

  $("admReqsList").addEventListener("click", e => {
    const ap = e.target.closest(".req-approve");
    if (ap) { approveReq(ap.dataset.id, ap); return; }
    const rj = e.target.closest(".req-reject");
    if (rj) { rejectReq(rj.dataset.id, rj); return; }
  });

  /* v1.2.5: перемотка справочника к только что одобренной анкете —
     админ сразу ВИДИТ результат, а не ищет её по городам и категориям */
  function showApproved(r) {
    try {
      const cat = CATS.find(c => c.id === r.category || c.base === r.category);
      const cityOk = CITIES.some(c => c.id === r.city);
      const lvls = cat ? levelsOf(cat) : [];
      const grp = lvls.some(l => l.id === r.group) ? r.group : (lvls[0] && lvls[0].id);
      if (cityOk) { state.city = r.city; store.set("dalil_city", state.city); }
      if (cat) state.cat = cat.id;
      if (grp) state.level = grp;
      state.sub = "all";
      state.dest = "all";
      state.levelSelected = !(cat && cat.levels);
      closeOv("admOverlay");
      animCities = true; animCats = true;
      renderCities(); updateCityVisibility(); renderCats(); renderSubs(); renderList();
      setTimeout(() => { try { $("listWrap").scrollIntoView({ behavior: "smooth", block: "start" }); } catch {} }, 80);
    } catch (e) { console.error(e); }
  }

  async function approveReq(id, btn) {
    const r = reqsCache.find(x => x.id === id);
    if (!r || btn.disabled) return;
    btn.disabled = true;
    btn.textContent = t("reqsBusy");
    try {
      /* v1.4.0: публикацию делает наш сервер — карточка создаётся из заявки,
         TTL считается по тарифу на сервере */
      const j = await admFetch("/api/admin/applications/" + encodeURIComponent(id) + "/approve", { method: "POST" });
      reqsCache = reqsCache.filter(x => x.id !== id);
      updateReqsBadge();
      await loadOnce();
      /* v1.2.5: сразу показываем результат — экран прыгает к новой анкете */
      showApproved(state.docs.find(d => d.id === j.providerId) || r);
      toast(t("reqsApproved"));
    } catch (err) {
      console.error(err);
      toast(writeErrText(err), "err", 7000);
      btn.disabled = false;
      btn.textContent = t("reqsApprove");
    }
  }

  async function rejectReq(id, btn) {
    if (btn.disabled) return;
    btn.disabled = true;
    btn.textContent = t("reqsBusy");
    try {
      await admFetch("/api/admin/applications/" + encodeURIComponent(id) + "/reject", { method: "POST" });
      reqsCache = reqsCache.filter(x => x.id !== id);
      updateReqsBadge();
      if ($("admOverlay").classList.contains("show") && admTab === "reqs") renderReqs();
      toast(t("reqsRejected"));
    } catch (err) {
      console.error(err);
      toast(writeErrText(err), "err", 7000);
      btn.disabled = false;
      btn.textContent = t("reqsReject");
    }
  }

  /* ================= v1.2.7 · Напоминания об истечении (только админ) =================
     За 3 дня до конца срока (expiresAt) анкета попадает в панель «Напоминания».
     Панель сама открывается раз в сессию при входе админа; каждая карточка —
     кнопка «Напомнить»: WhatsApp владельца открывается с ГОТОВЫМ сообщением
     (имя, город, дата истечения, тариф, цена) на языке анкеты (uiLang, иначе арабский).
     «Напомнить»/«Пропустить» запоминаются в localStorage до конца дня —
     при продлении expiresAt меняется, и напоминание появится снова в новое окно. */
  const REM_WINDOW = 3 * 86400000;   /* напоминать за 3 дня до истечения TTL */
  const REM_MAP_KEY = "dalil_rem";
  const REM_SEEN_KEY = "dalil_rem_seen";
  const pad2 = (n) => String(n).padStart(2, "0");
  const dayKey = (ms) => { const d = new Date(ms); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; };
  const loadRemMap = () => { try { return JSON.parse(store.get(REM_MAP_KEY) || "{}") || {}; } catch { return {}; } };
  let remCache = [];

  function updateReminders() {
    const now = Date.now();
    const map = loadRemMap();
    remCache = state.docs
      .filter(p => p.expiresAt && p.expiresAt > now && p.expiresAt - now <= REM_WINDOW)
      .filter(p => !(map[p.id] && map[p.id].e === p.expiresAt && map[p.id].d === dayKey(now)))
      .sort((a, b) => a.expiresAt - b.expiresAt);   /* срочные сверху */
    updateRemBadge();
    maybeAutoOpenRems();
  }

  function updateRemBadge() {
    /* v1.3.0: бейджи рисует единый updateAdmBadges (вкладки + кнопка панели) */
    updateAdmBadges();
  }

  /* Панель сама открывается на вкладке «Напоминания» раз за сессию,
     если есть кому напомнить */
  function maybeAutoOpenRems() {
    if (!state.admin || !remCache.length) return;
    try { if (sessionStorage.getItem(REM_SEEN_KEY)) return; sessionStorage.setItem(REM_SEEN_KEY, "1"); } catch {}
    openAdmPanel("rems");
  }

  function markReminded(id) {
    const map = loadRemMap();
    const r = remCache.find(x => x.id === id);
    if (r) map[id] = { e: r.expiresAt, d: dayKey(Date.now()) };
    store.set(REM_MAP_KEY, JSON.stringify(map));
  }

  function renderRems() {
    const list = $("admRemList");
    $("admRemCount").textContent = remCache.length
      ? `${remCache.length} · ${t("remPending")}`
      : t("remEmpty");
    if (!remCache.length) { list.innerHTML = ""; return; }
    list.innerHTML = remCache.map((r, i) => {
      const tel = (r.phone || "").replace(/\D/g, "");
      const days = Math.max(1, Math.ceil((r.expiresAt - Date.now()) / 86400000));
      /* Сообщение владельцу — на языке его анкеты (uiLang), по умолчанию арабский */
      const ml = (r.uiLang && I18N[r.uiLang]) ? r.uiLang : "ar";
      const planTxt = t(r.plan === "m1" ? "subM1" : r.plan === "m3" ? "subM3" : "subY1", ml);
      const price = r.planPrice || PLAN_PRICE[r.plan] || "";
      const cObj = cityById(r.city);
      const cityTxt = cObj ? (cObj[ml] || cObj.ar || cObj.ku || cObj.ru) : (r.city || "");
      const d = new Date(r.expiresAt);
      const dateStr = `${pad2(d.getDate())}.${pad2(d.getMonth() + 1)}.${d.getFullYear()}`;
      const msg = encodeURIComponent(
        t("remWaMsg", ml)
          .replace("{name}", r.title || "")
          .replace("{city}", cityTxt)
          .replace("{date}", dateStr)
          .replace("{n}", String(days))
          .replace("{plan}", planTxt)
          .replace("{price}", price));
      return `
      <div class="req-card" style="animation-delay:${Math.min(i * 45, 300)}ms">
        <div class="req-top">
          <span class="req-plan">${esc(planName(r.plan))} · ${esc(price)}</span>
          <span class="rem-warn">${icon("bell", 12)}${esc(t("remDays").replace("{n}", String(days)))}</span>
        </div>
        <div class="req-name">${esc(r.title || "")}</div>
        <div class="req-meta">
          ${r.phone ? `<span class="ltr-num">${icon("phone", 13)}${esc(r.phone)}</span>` : ""}
          <span>${icon("city", 13)}${esc(cityName(r.city))}</span>
          <span>${icon("book", 13)}${esc(subName(r.group, r.subcategory))}</span>
        </div>
        <div class="req-actions">
          ${tel
            ? `<a class="btn btn-solid" href="https://wa.me/${esc(tel)}?text=${msg}" target="_blank" rel="noopener" data-remind="${esc(r.id)}">${icon("send", 14)}${esc(t("remRemind"))}</a>
             <button type="button" class="btn btn-outline" data-remskip="${esc(r.id)}">${icon("x", 14)}${esc(t("remSkip"))}</button>`
            : `<span class="req-desc">${esc(t("remNoPhone"))}</span>`}
        </div>
      </div>`;
    }).join("");
  }

  /* v1.3.0: напоминания открыаются вкладкой «Напоминания» в админ-панели */

  $("admRemList").addEventListener("click", e => {
    const sk = e.target.closest("[data-remskip]");
    if (sk) {
      markReminded(sk.dataset.remskip);
      remCache = remCache.filter(x => x.id !== sk.dataset.remskip);
      updateRemBadge();
      renderRems();
      toast(t("remSkippedToast"));
      return;
    }
    const rd = e.target.closest("[data-remind]");
    if (rd) {
      markReminded(rd.dataset.remind);
      remCache = remCache.filter(x => x.id !== rd.dataset.remind);
      updateRemBadge();
      renderRems();   /* карточка уходит из списка — считаем напоминание отправленным */
      toast(t("remOpenedToast"));
    }
  });

  /* ================= v1.3.0 · ЯДРО АДМИН-ПАНЕЛИ =================
     Одна организованная панель вместо разрозненных кнопок:
     • 4 живые статкарточки (пересчёт на каждом снапшоте);
     • 5 вкладок: Заявки · Напоминания · Жалобы · Анкеты · Инструменты;
     • реестр анкет с поиском и продлением TTL в один клик;
     • жалобы посетителей из коллекции reports. */

  let admTab = "reqs";          /* активная вкладка панели */
  let admSearchQ = "";          /* поисковый запрос в реестре анкет */
  let repsTimer = null;
  let repsInFlight = false;
  let repsCache = [];

  /* v1.4.0: админ восстанавливается по своему токену (localStorage), не по Firebase.
     ВАЖНО (hotfix TDZ): этот блок обязан выполняться ПОСЛЕ объявлений всех
     админ-кэшей (reqsCache/remCache/repsCache и их таймеров) — см. комментарий
     на месте прежней (ошибочной) позиции выше. */
  if (adminToken) {
    state.admin = true;
    syncAdminUI();
    watchReqs(); watchReports();
  }

  /* ---------- Бейджи: вкладки + плавающая кнопка ---------- */
  function setBadge(el, n) {
    if (!el) return;
    el.hidden = !n;
    if (n) el.textContent = n > 99 ? "99+" : String(n);
  }
  function updateAdmBadges() {
    if (!state.admin) return;
    setBadge($("admReqBadge"), reqsCache.length);
    setBadge($("admRemBadge"), remCache.length);
    setBadge($("admRepBadge"), repsCache.length);
    setBadge($("floatPanelBadge"), reqsCache.length + remCache.length + repsCache.length);
    if ($("admOverlay").classList.contains("show")) renderAdmStats();
  }

  /* ---------- Жалобы (reports) ---------- */
  /* v1.4.0: жалобы — опрос нашего сервера (20 сек) */
  async function fetchReps() {
    if (!state.admin || repsInFlight) return;
    repsInFlight = true;
    try {
      const j = await admFetch("/api/admin/reports?status=new");
      repsCache = (j.docs || []).sort((a, b) => tsOf(b.createdAt) - tsOf(a.createdAt));
      updateAdmBadges();
      if ($("admOverlay").classList.contains("show") && admTab === "reps") renderReports();
    } catch (e) { console.warn("reps poll:", e && e.message); }
    repsInFlight = false;
  }
  function watchReports() {
    if (repsTimer) return;
    fetchReps();
    repsTimer = setInterval(fetchReps, 20000);
  }
  function unwatchReports() {
    if (repsTimer) { clearInterval(repsTimer); repsTimer = null; }
    repsCache = [];
    updateAdmBadges();
  }

  const REP_REASON_KEYS = { dead: "repR1", fake: "repR2", wrong: "repR3", other: "repR4" };

  function renderReports() {
    const list = $("admRepList");
    $("admRepCount").textContent = repsCache.length
      ? `${repsCache.length} · ${t("statReps")}`
      : t("repEmpty");
    if (!repsCache.length) { list.innerHTML = ""; return; }
    list.innerHTML = repsCache.map((r, i) => `
      <div class="req-card" style="animation-delay:${Math.min(i * 45, 300)}ms">
        <div class="req-top">
          <span class="req-plan" style="color:#E07A6C;background:rgba(224,122,108,.12);border-color:rgba(224,122,108,.45)">${icon("flag", 12)}${esc(t(REP_REASON_KEYS[r.reason] || "repR4"))}</span>
          <span class="req-date">${esc(fmtTs(r.createdAt))}</span>
        </div>
        <div class="req-name">${esc(r.title || "")}</div>
        <div class="req-meta">
          ${r.phone ? `<span class="ltr-num">${icon("phone", 13)}${esc(r.phone)}</span>` : ""}
          ${r.city ? `<span>${icon("city", 13)}${esc(cityName(r.city))}</span>` : ""}
        </div>
        ${r.comment ? `<p class="req-desc">${esc(r.comment)}</p>` : ""}
        <div class="req-actions">
          <button type="button" class="btn btn-outline rep-open" data-id="${esc(r.id)}">${icon("book", 14)}${esc(t("repOpen"))}</button>
          <button type="button" class="btn btn-solid rep-resolve" data-id="${esc(r.id)}">${icon("check", 14)}${esc(t("repResolve"))}</button>
          <button type="button" class="btn btn-danger rep-del" data-id="${esc(r.id)}">${icon("trash", 14)}${esc(t("repDelete"))}</button>
        </div>
      </div>`).join("");
  }

  $("admRepList").addEventListener("click", async e => {
    const open = e.target.closest(".rep-open");
    if (open) {
      const r = repsCache.find(x => x.id === open.dataset.id);
      const p = r && state.docs.find(d => d.id === r.providerId);
      if (p) { showApproved(p); }
      else toast(t("repNoCard"), "err", 5000);
      return;
    }
    const res = e.target.closest(".rep-resolve");
    if (res) {
      try {
        await admFetch("/api/admin/reports/" + encodeURIComponent(res.dataset.id) + "/resolve", { method: "POST" });
        repsCache = repsCache.filter(x => x.id !== res.dataset.id);
        updateAdmBadges(); renderReports();
      } catch (err) { toast(writeErrText(err), "err", 7000); }
      return;
    }
    const del = e.target.closest(".rep-del");
    if (del) {
      try {
        await admFetch("/api/admin/reports/" + encodeURIComponent(del.dataset.id) + "/delete", { method: "POST" });
        repsCache = repsCache.filter(x => x.id !== del.dataset.id);
        updateAdmBadges(); renderReports();
      } catch (err) { toast(writeErrText(err), "err", 7000); }
    }
  });

  /* ---------- Статкарточки ---------- */
  function renderAdmStats() {
    const now = Date.now();
    $("statDocs").textContent = String(state.docs.filter(d => !isExpired(d)).length);
    $("statReqs").textContent = String(reqsCache.length);
    $("statExp").textContent = String(state.docs.filter(p => p.expiresAt && p.expiresAt > now && p.expiresAt - now <= REM_WINDOW).length);
    $("statReps").textContent = String(repsCache.length);
  }

  /* ---------- Реестр анкет (вкладка «Анкеты») ---------- */
  function ttlPill(p) {
    /* v1.4.2: бессрочная карточка — плашка не нужна вовсе */
    if (!p.expiresAt) return "";
    const ms = Number(p.expiresAt) - Date.now();
    if (ms <= 0) return `<span class="ttl-pill ttl-dead">${esc(t("pillExpired"))}</span>`;
    const days = Math.ceil(ms / 86400000);
    const d = new Date(Number(p.expiresAt));
    const dateStr = `${pad2(d.getDate())}.${pad2(d.getMonth() + 1)}.${d.getFullYear()}`;
    if (days <= 7) return `<span class="ttl-pill ttl-warn">${esc(t("pillDays").replace("{n}", String(days)))}</span>`;
    return `<span class="ttl-pill ttl-ok">${esc(t("pillOk").replace("{d}", dateStr))}</span>`;
  }

  function renderAdmDocs() {
    const q = admSearchQ.toLowerCase();
    const qs = q.replace(/\s/g, "");
    const items = state.docs
      .filter(d => !q ||
        (d.title || "").toLowerCase().includes(q) ||
        (d.phone || "").replace(/\s/g, "").includes(qs) ||
        (d.names && Object.values(d.names).some(v => String(v || "").toLowerCase().includes(q))) ||
        cityName(docCityId(d)).toLowerCase().includes(q))
      .sort((a, b) => {
        const ea = a.expiresAt ? Number(a.expiresAt) : Infinity;
        const eb = b.expiresAt ? Number(b.expiresAt) : Infinity;
        if ((ea <= Date.now()) !== (eb <= Date.now())) return (ea <= Date.now()) ? -1 : 1;
        return ea - eb;   /* срочные и просроченные сверху */
      });
    $("admDocsCount").textContent = `${t("found")}: ${items.length}`;
    const list = $("admDocsList");
    if (!items.length) { list.innerHTML = ""; return; }
    list.innerHTML = items.map((p, i) => {
      const tel = (p.phone || "").replace(/[^\d+]/g, "");
      return `
      <div class="adm-doc" style="animation-delay:${Math.min(i * 35, 250)}ms">
        <div class="adm-doc-top">
          <span class="adm-doc-name">${esc(pname(p))}</span>
          ${ttlPill(p)}
        </div>
        <div class="req-meta">
          ${p.phone ? `<span class="ltr-num">${icon("phone", 13)}${esc(p.phone)}</span>` : ""}
          <span>${icon("city", 13)}${esc(cityName(docCityId(p)))}</span>
          <span>${icon("book", 13)}${esc(subName(p.group, p.subcategory))}</span>
          <span>${icon("eye", 13)}${fmtViews(p.views)}</span>
        </div>
        <div class="adm-doc-actions">
          <button type="button" class="btn btn-outline adm-edit" data-id="${esc(p.id)}">${icon("edit", 13)}${esc(t("edit"))}</button>
          <button type="button" class="btn btn-danger adm-del" data-id="${esc(p.id)}">${icon("trash", 13)}${esc(t("delete"))}</button>
          ${tel ? `<a class="btn btn-outline" href="tel:${esc(tel)}">${icon("phone", 13)}${esc(t("call"))}</a>` : ""}
        </div>
      </div>`;
    }).join("");
  }

  /* v1.4.2: продление срока удалено — анкеты бессрочные, удаляются владельцем
     или админом (функция renewProvider и кнопки +1/+3/+12 мес упразднены) */

  $("admDocsList").addEventListener("click", e => {
    const ed = e.target.closest(".adm-edit");
    if (ed) { closeOv("admOverlay"); openEditModal(ed.dataset.id); return; }
  });

  $("admSearch").addEventListener("input", e => {
    admSearchQ = e.target.value.trim();
    renderAdmDocs();
  });

  /* ---------- v1.4.2: вкладка «Ошибки» ---------- */
  let admErrsCache = [];
  async function loadAdminErrors() {
    try {
      const r = await admFetch("/api/admin/errors");
      admErrsCache = (r && r.docs) || [];
    } catch (e) { console.error(e); admErrsCache = []; }
    const list = $("admErrsList");
    $("admErrsCount").textContent = t("found") + ": " + admErrsCache.length;
    const badge = $("admErrBadge");
    const fresh = admErrsCache.filter(x => x.resolved !== "done").length;

  /* ================= v5 · КРУТИЛКА ГОРОДОВ =================
     Мышь: drag-скролл с гашением клика после перетаскивания.
     Колесо поверх трека: вертикаль → горизонталь (на краях — страница).
     Стрелки ‹ › в шапке секции. Шкала: CSS scroll-timeline, а для
     старых WebView — JS-фолбэк через --ct-pct. Snap = proximity. */
  (function () {
    const g = $("cityGrid");
    const sec = document.querySelector(".cities");
    if (!g || !sec) return;
    let down = false, sx = 0, sl = 0, moved = 0;
    g.addEventListener("pointerdown", e => {
      if (e.pointerType !== "mouse") return;            /* touch — нативно */
      down = true; moved = 0; sx = e.clientX; sl = g.scrollLeft;
    });
    window.addEventListener("pointermove", e => {
      if (!down) return;
      const dx = e.clientX - sx;
      const m = Math.abs(dx);
      /* класс dragging — только при реальном сдвиге >6px: иначе
         pointer-events:none на карточках перебивает обычный клик */
      if (m > 6 && !g.classList.contains("dragging")) g.classList.add("dragging");
      moved = Math.max(moved, m);
      g.scrollLeft = sl - dx;
    });
    const drop = () => { down = false; g.classList.remove("dragging"); };
    window.addEventListener("pointerup", drop);
    window.addEventListener("pointercancel", drop);
    g.addEventListener("click", e => {                   /* drag ≠ выбор города */
      if (moved > 6) { e.stopPropagation(); e.preventDefault(); moved = 0; }
    }, true);
    g.addEventListener("wheel", e => {
      const d = Math.abs(e.deltaY) >= Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
      if (!d) return;
      const max = g.scrollWidth - g.clientWidth;
      const fwd = d > 0;
      if ((fwd && g.scrollLeft >= max - 1) || (!fwd && g.scrollLeft <= 1)) return;
      e.preventDefault();
      g.scrollLeft += d;
    }, { passive: false });
    const page = dir => g.scrollBy({ left: dir * Math.max(240, g.clientWidth - 200), behavior: "smooth" });
    const pB = $("ctPrev"), nB = $("ctNext");
    if (pB) pB.addEventListener("click", () => page(-1));
    if (nB) nB.addEventListener("click", () => page(1));
    const upd = () => {
      const max = g.scrollWidth - g.clientWidth;
      const pct = max > 0 ? Math.min(1, Math.abs(g.scrollLeft) / max) : 0;
      sec.style.setProperty("--ct-pct", (0.08 + pct * 0.92).toFixed(4));
      if (pB) {
        pB.classList.toggle("dim", Math.abs(g.scrollLeft) <= 6);
        nB.classList.toggle("dim", Math.abs(g.scrollLeft) >= max - 6);
      }
    };
    let raf = 0;
    g.addEventListener("scroll", () => {
      if (!raf) raf = requestAnimationFrame(() => { raf = 0; upd(); });
    });
    window.addEventListener("resize", upd);
    upd();
  })();

  let delBusy = false;

        '<span>' + icon("eye", 13) + '<b class="ltr-num">' + fmtViews(p.views) + '</b> ' + esc(t("cabViews")) + '</span>' +
        '<span>' + icon("star", 13) + '<b class="ltr-num">' + (ra < 0 ? "—" : (Math.round(ra * 10) / 10).toFixed(1)) + '</b>' +
          (Number(p.rateCount) > 0 ? " " + esc(t("cabVotes").replace("{n}", String(Number(p.rateCount) || 0))) : "") + '</span>' +
        '<span>' + icon("crown", 13) + esc(t("cabRank").replace("{a}", String(rk.pos)).replace("{b}", String(rk.total))) + '</span></div>' +
        '<div class="mb-row mb-row2"><span>' + icon("check", 13) + esc(t("cabCreated")) + ': ' + esc(cabDateStr(p)) + '</span><span>' + expTxt + '</span></div>';
      const acts = '<div class="cab-item-act">' +
        '<button type="button" class="btn btn-outline cab-open" data-id="' + esc(p.id) + '">' + icon("eye", 14) + esc(t("cabOpen")) + '</button>' +
        '<button type="button" class="btn btn-outline cab-share" data-id="' + esc(p.id) + '">' + icon("share", 14) + esc(t("shareBtn")) + '</button></div>';
      parts.push(mbCard('<div class="magic-bento__content">' + head +
        '<div class="magic-bento__text"><h3 class="magic-bento__title">' + esc(pname(p)) + '</h3></div>' +
        stats + acts + '</div>',
        { span2: true, clickable: true, id: p.id, vip: !!p.feat, label: pname(p) }));
    });
    bento.innerHTML = parts.join("");
    bento.querySelectorAll(".cab-open").forEach(b => b.addEventListener("click", ev => {
      ev.stopPropagation();
      closeOv("cabOverlay");
      renderDetail(b.dataset.id);
    }));
    bento.querySelectorAll(".cab-share").forEach(b => b.addEventListener("click", ev => {
      ev.stopPropagation();
      const d = state.docs.find(x => x.id === b.dataset.id);
      if (d) shareProvider(d);
    }));
    bento.querySelectorAll(".magic-bento__card[data-clickable]").forEach(card => {
      card.addEventListener("click", () => { closeOv("cabOverlay"); renderDetail(card.dataset.id); });
      card.addEventListener("keydown", ev => {
        if (ev.key !== "Enter" && ev.key !== " ") return;
        ev.preventDefault(); card.click();
      });
    });
    bentoApi = mountBento(bento);
  }
  function renderCabinet() {
    const bento = $("cabBento");
    if (!bento) return;
    const docs = [...myListingIds].map(id => state.docs.find(d => d.id === id)).filter(Boolean);
    /* сигнатура: не пересобирать бенто (и не гасить движок) без изменений —
       автообновление 25с/60с зовёт renderCabinet постоянно */
    const sig = docs.map(d => [d.id, d.views, d.rateCount, d.rateSum, d.feat ? 1 : 0, d.ver ? 1 : 0,
      d.expiresAt || 0, state.lang].join(":")).join("|") + "#" + docs.length;
    if (sig === cabSig && !bento.hidden) return;
    cabSig = sig;
    renderCabBento(docs);
  }
  /* ============ v5.5.0 · Вкладки кабинета: «Анкеты» / «Подписки» ============
     Прайсинг (Pricing 1) живёт в секции #subsSec внизу главной (v5.6.0);
     во вкладке кабинета — список текущих подписок своих анкет (VIP /
     Проверено / Базовый + срок) и кнопка «Все тарифы» → скролл к секции.
     Табы переиспользуют .adm-tabs. */
  function cabSetTab(id) {
    document.querySelectorAll("#cabTabs .adm-tab").forEach(x => {
      const on = x.dataset.cabtab === id;
      x.classList.toggle("on", on);
      x.setAttribute("aria-selected", on ? "true" : "false");
    });
    const pd = $("cabPaneDocs"), ps = $("cabPaneSubs");
    if (pd) pd.hidden = id !== "docs";
    if (ps) ps.hidden = id !== "subs";
    if (id === "subs") renderSubsNow();
  }
  $("cabTabs").addEventListener("click", e => {
    const b = e.target.closest(".adm-tab");
    if (b) cabSetTab(b.dataset.cabtab);
  });
  /* Текущие подписки: реальные анкеты владельца и их статус.
     v5.5.0: пишем в ДВА контейнера — вкладку «Подписки» кабинета
     (#cabSubsNow, с сообщением о пустом списке) и блок в секции #subsSec
     (#spNow, при пустом списке просто скрыт).
     preDocs — готовый массив (пробы/переиспользование), иначе myListingIds. */
  function renderSubsNow(preDocs) {
    const cab = $("cabSubsNow"), sp = $("spNow");
    if (!cab && !sp) return;
    let docs;
    if (Array.isArray(preDocs)) docs = preDocs.slice();
    else {
      try { docs = [...myListingIds].map(id => state.docs.find(d => d.id === id)).filter(Boolean); }
      catch (e) { docs = []; }
    }
    if (!docs.length) {
      if (cab) cab.innerHTML = '<div class="pr-now-none">' + esc(t("cabSubsNone")) + '</div>';
      if (sp) { sp.innerHTML = ""; sp.hidden = true; }
      return;
    }
    const rows = docs.map(p => {
      const badge = p.feat ? '<span class="pr-now-badge vipb">VIP</span>'
        : p.ver ? '<span class="pr-now-badge ver">' + esc(t("prVerName")) + '</span>'
        : '<span class="pr-now-badge base">' + esc(t("prFreeName")) + '</span>';
      const left = p.expiresAt ? Math.ceil((Number(p.expiresAt) - Date.now()) / CAB_DAY) : 0;
      const exp = p.expiresAt
        ? (left <= 0 ? '<span class="pr-now-exp">' + esc(t("cabExpired")) + '</span>'
                     : '<span class="ltr-num">' + esc(t("cabExpiresIn").replace("{n}", String(left))) + '</span>')
        : '<span>' + esc(t("cabNever")) + '</span>';
      return '<div class="pr-now-row">' + badge + '<b>' + esc(pname(p)) + '</b>' +
        '<span class="pr-now-meta">' + exp + '</span></div>';
    }).join("");
    if (cab) cab.innerHTML = rows;
    if (sp) { sp.innerHTML = rows; sp.hidden = false; }
  }
  /* ============ v2.0.1 · ЕДИНЫЙ ПОЛНОЭКРАННЫЙ ЭКРАН ТАРИФОВ ============
     Приказ владельца: «тарифы везде отдельным экраном с кнопкой назад».
     openSubsSec включает body.subs-mode: CSS прячет всю главную, кроме
     #subsSec и модалок (.overlay), мгновенный скролл наверх; выход —
     closeSubsSec по кнопке «назад» в шапке экрана. Входы: VIP-кнопка
     шапки, CTA 13 «Выделяйся», «Все тарифы и подписки» кабинета.
     VIP-модалка снесена — её золотой блок живёт на самом экране. */
  function openSubsSec() {
    renderSubsNow();                     /* свежий список текущих подписок */
    closeOv("cabOverlay"); closeOv("settingsOverlay"); closeOv("detailOverlay");
    const el = document.getElementById("subsSec");
    if (el) el.hidden = false;
    document.body.classList.add("subs-mode");
    document.querySelectorAll(".bn-item").forEach(b => b.classList.remove("on"));
    window.scrollTo(0, 0);
  }
  function closeSubsSec() {
    document.body.classList.remove("subs-mode");
    const el = document.getElementById("subsSec");
    if (el) el.hidden = true;
    document.querySelectorAll(".bn-item").forEach(b => b.classList.toggle("on", b.id === "bnHome"));
  }
  /* v5.3.1 · компактная волна-лента между hero и городами, живущая от скролла:
     в покое стоит, при появлении — импульс, скорость/направление — за скроллом
     (меряется каждый кадр: гладкий скролл, прыжки и моментум — всё ловится),
     после остановки — плавный выбег ~1с */
  const tlMainApi = mountTextLoop($("tlMain"), {
    fontSize: 36, ribbonWidth: 62, curviness: 56, speed: 0, scrollBoost: 1.5
  });
  /* DalilFx — точка входа для отладки/переиспользования (пробы, консоль) */
  window.DalilFx = { mountTextLoop, mountBento, renderCabBento, renderWvMarquee, renderSubsNow,
    openSubsSec, closeSubsSec, MB_BARS, tlMain: tlMainApi };
  /* ================= v2.0.1 · PRICING 1 — тумблер биллинга + CTA =================
     Месяц↔год: цены меняются ($5↔$39, $10↔$70), подпись периода — на
     текущем языке, бейдж выгоды виден только на годовой схеме.
     CTA: «Базовый» → guardedApply (мастер заявки с гостевым гейтом),
     «Проверено»/VIP → data-pack (готовый wa.me-wiring по applyLang).
     v2.0.1: входы на единый экран тарифов — CTA 13 «Выделяйся» и
     кабинет «Все тарифы и подписки» (VIP-кнопка шапки — в wiring topbar).
     Кабинет закрывается перед мастер-заявкой, иначе оверлей накроет экран. */
  {
    const prSec = document.getElementById("pricingSec");
    if (prSec) {
      const prBtns = [...prSec.querySelectorAll(".pr-toggle button")];
      const setBill = y => {
        prBtns.forEach(b => b.classList.toggle("on", (b.dataset.bill === "y") === y));
        prSec.querySelectorAll(".pr-num[data-m]").forEach(n => { n.textContent = y ? n.dataset.y : n.dataset.m; });
        prSec.querySelectorAll(".pr-per2").forEach(p => { p.textContent = t(y ? "prPerY" : "prPerM"); });
        prSec.querySelectorAll(".vip-save").forEach(s => { s.hidden = !y; });
      };
      prBtns.forEach(b => b.addEventListener("click", () => setBill(b.dataset.bill === "y")));
      /* кабинет закрывается перед гейтом/мастером заявки. */
      const prFree = document.getElementById("prFreeCta");
      if (prFree) prFree.addEventListener("click", () => { closeOv("cabOverlay"); guardedApply(); });
      /* CTA 13 «Выделяйся» → единый полноэкранный экран тарифов */
      const c13 = document.getElementById("cta13Btn");
      if (c13) c13.addEventListener("click", () => openSubsSec());
      /* «Все тарифы и подписки» из кабинета → единый экран */
      const spLook = document.getElementById("spLookBtn");
      if (spLook) spLook.addEventListener("click", openSubsSec);
      /* v2.0.1: кнопка «назад» в шапке экрана тарифов */
      const sb = document.getElementById("subsBackBtn");
      if (sb) sb.addEventListener("click", closeSubsSec);
    }
  }
  async function openCabinet() {
    if (!isAuthed()) { askAuth("apply"); return; }
    closeOv("settingsOverlay");
    closeOv("detailOverlay");
    openOv("cabOverlay");
    cabSetTab("docs");
    renderCabinet();
    try { await loadMyListings(); } catch (e) { /* ids останутся прежними */ }
    renderCabinet();   /* перерисовка после подтяжки свежих ids с сервера */
  }
  $("cabBtn").addEventListener("click", openCabinet);
  $("tbCab").addEventListener("click", openCabinet);
  /* v5.3: #cabAddBtn теперь внутри бенто-карточки — биндится в renderCabBento() */
  /* п.28: вкладка «Кабинет» подсвечена, пока открыто окно кабинета; при закрытии
     (крестик/фон/Esc) подсветка возвращается на «Главная» — если та не занята */
  new MutationObserver(() => {
    const on = $("cabOverlay").classList.contains("show");
    $("bnCab").classList.toggle("on", on);
    if (on) $("bnHome").classList.remove("on");
    else if (!document.querySelector(".bn-item.on")) $("bnHome").classList.add("on");
  }).observe($("cabOverlay"), { attributes: true, attributeFilter: ["class"] });

  /* --- v1.4.4 (п.25, приказ владельца): возврат из Google OAuth — токен в
     #lt= или ?lt=. Раньше обработчик запускался ОДИН раз при загрузке, а
     возврат из Chrome в APK (loadUrl того же адреса + фрагмент) — это
     same-document навигация: скрипты НЕ перезапускаются и вход не завершался.
     Теперь: сканируем при загрузке И на hashchange; MainActivity может
     передать токен напрямую (__dlGoogleBack) — вход завершается мгновенно
     на текущей странице. Повтор одного токена исключён (lastLt).
     Ошибки провайдера (#ea=/?ea=) — понятный тост вместо тишины.
     v1.4.4 (п.26, приказ владельца «пусть берет имя с ака гугл»): воркер
     передаёт рядом с токеном и имя аккаунта (un=) — шапка сразу показывает
     настоящее имя из Google; имя сверяем с сервером (/api/me, syncMe) —
     он источник истины и для APK-пути, где un= не доходит. --- */
  async function syncMe() {
    try {
      const tok = store.get(TOKEN_KEY);
      if (!tok || !state.user || state.user.g) return false;
      const r = await withTimeout(fetch(API + "/api/me", { headers: { Authorization: "Bearer " + tok } }), 12000);
      if (r.status === 401 || r.status === 404) { setUser(null); return false; }  /* токен истёк/аккаунт удалён */
      const j = await r.json();
      if (j.ok && j.user) {
        state.user = { ...state.user, id: j.user.id, n: j.user.name || state.user.n, e: j.user.ident || state.user.e };
        try { localStorage.setItem(USER_KEY, JSON.stringify(state.user)); } catch (e) {}
        renderAuthUI();
        loadMyListings();
        ownerAdminCheck();  /* v1.4.2: владелец получает админку автоматически */
        return true;
      }
    } catch (e) { /* офлайн — оставляем локальный профиль */ }
    return false;
  }
  let lastLt = "";
  function googleBackProcess(tok, name, prov) {
    try {
      if (!tok || tok === lastLt) return;
      lastLt = tok;
      const nm = String(name || "").replace(/[\u0000-\u001f<>]/g, "").trim().slice(0, 60);
      finishLogin({ p: prov || "google", n: nm, e: "", token: tok }, false);
      try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
      syncMe();   /* п.26: настоящее имя аккаунта — с сервера */
    } catch {}
  }
  function googleBackScan() {
    try {
      const mu = location.hash.match(/(?:^#|&)un=([^&]+)/) || location.search.match(/[?&]un=([^&]+)/);
      let nm = "";
      if (mu && mu[1]) { try { nm = decodeURIComponent(mu[1]); } catch (e) { nm = mu[1]; } }
      /* v5.4.3 (перенесено): провайдер в pp= (github-коллбек воркера шлёт pp=github) */
      const mp = location.hash.match(/(?:^#|&)pp=([a-z]+)/) || location.search.match(/[?&]pp=([a-z]+)/);
      const prov = (mp && /^[a-z]+$/.test(mp[1]) && mp[1]) || "google";
      const mm = location.hash.match(/(?:^#|&)lt=([A-Za-z0-9_\-.]+)/)
             || location.search.match(/[?&]lt=([A-Za-z0-9_\-.]+)/);
      if (mm && mm[1]) { googleBackProcess(mm[1], nm, prov); return; }
      const me = location.hash.match(/(?:^#|&)ea=([A-Za-z0-9_\-]+)/)
             || location.search.match(/[?&]ea=([A-Za-z0-9_\-]+)/);
      if (me && me[1]) {
        lastLt = "ea:" + me[1];
        toast(t(prov === "github" ? "ghOauthFail" : "auOauthFail"));
        try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
      }
    } catch {}
  }
  googleBackScan();
  window.addEventListener("hashchange", googleBackScan);
  window.__dlGoogleBack = (tok) => googleBackProcess(String(tok || "").replace(/[^A-Za-z0-9_\-.]/g, ""));
  window.__dlOauthErr = () => { try { toast(t("auOauthFail")); } catch (e) {} };

  (async function restoreSession() {
    /* v1.4.4 (п.26): проверка сессии и подтяжка имени — общий syncMe() */
    if (store.get(TOKEN_KEY) && state.user && !state.user.g) await syncMe();
  })();

  /* v1.4.0: Google/Facebook через Firebase удалены ПОЛНОСТЬЮ.
     Сервер готов к прямому входу Google/Facebook без Firebase
     (GET /api/auth/config скажет, заданы ли OAuth-ключи) — кнопки
     вернутся автоматически, когда владелец добавит ключи на сервер. */

  /* ================= Инициализация ================= */
  (async function init() {
    try {
      $("adminBtn").querySelector(".ic").innerHTML = icon("lock", 15);
      $("gearIc").innerHTML = icon("gear", 18);
      $("setThemeIc").innerHTML = icon("palette", 13);
      document.querySelectorAll(".theme-sw .sw-check").forEach(el => { el.innerHTML = icon("check", 11); });
      $("setLangIc").innerHTML = icon("globe", 13);
      $("setWarnIc").innerHTML = icon("trash", 13);   /* v1.4.0: удаление аккаунта */
      $("accDelIc").innerHTML = icon("trash", 16);
      $("delAccIc").innerHTML = icon("trash", 30);
      $("cabEntryIc").innerHTML = icon("chart", 13);   /* v1.4.5: кабинет */
      $("cabBtnIc").innerHTML = icon("chart", 16);
      $("tbCabIc").innerHTML = icon("chart", 16);
      /* v5.3: #cabEmptyIc удалён — иконка пустого состояния встроена в renderCabBento() */
      $("searchIcon").innerHTML = lensSVG(18);   /* v1.4.2: фирменная золотая лупа */
      /* v1.3.0: иконки новых блоков */
      $("notifBtnIc").innerHTML = icon("bell", 18);
      $("mapIc").innerHTML = icon("map", 20);
      $("nearMeIc").innerHTML = icon("locate", 14);
      $("bnHomeIc").innerHTML = icon("home", 21);
      $("bnCatsIc").innerHTML = icon("book", 21);
      $("bnCabIc").innerHTML = icon("chart", 21);   /* п.28: кабинет на нижней панели */
      $("bnMapIc").innerHTML = icon("map", 21);
      $("fMapBtnIc").innerHTML = icon("pin", 15);
      $("aMapBtnIc").innerHTML = icon("pin", 15);
      $("panelIc").innerHTML = icon("gear", 16);
      $("citiesIcon").innerHTML = icon("city", 22);
      $("admGearIc").innerHTML = icon("gear", 20);
      $("admSearchIc").innerHTML = lensSVG(17);   /* v1.4.2: фирменная золотая лупа */
      $("agentIc2").innerHTML = icon("user", 20);
      $("appAgreeBox").innerHTML = icon("check", 14);
      $("appDoneIc").innerHTML = icon("check", 30);
      $("appDoneWaIc").innerHTML = icon("chat", 15);
      /* v5.6.0: секция #subsSec — корона CTA 13, соцкнопки Footer 8 */
      $("ct13Ic").innerHTML = icon("crown", 16);
      $("ftIcTg").innerHTML = icon("send", 18);
      $("ftIcWa").innerHTML = icon("chat", 18);
      document.querySelectorAll(".modal-close").forEach(b => b.innerHTML = icon("x", 18));

      state.levelSelected = !catById(state.cat).levels;
      applyLang();
      renderAll();
      updateCityVisibility();
      startListener();
    } catch (e) {
      console.error(e);
      toast(e.message || "خطأ في التهيئة", "err");
    }
  })();
</script>
